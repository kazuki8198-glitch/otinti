<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="530" viewBox="0 0 1200 530" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#C8742A"/></marker></defs><rect width="1200" height="530" fill="#FFFFFF"/><rect x="20" y="50" width="330" height="290" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="185" y="118.20000000000002" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">離陸前に確認</text><text x="185" y="163.00000000000003" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">滑走路の長さ・状態</text><text x="185" y="195.40000000000003" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">風・重量</text><text x="185" y="227.80000000000004" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">離陸性能</text><text x="185" y="260.20000000000005" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">片発性能</text><text x="185" y="292.6" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">出発後の地形</text><line x1="358" y1="195" x2="412" y2="195" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><rect x="420" y="50" width="330" height="290" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="585" y="134.4" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">ブリーフィング</text><text x="585" y="179.20000000000002" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">異常時の判断</text><text x="585" y="211.60000000000002" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">滑走中と浮揚後の扱い</text><text x="585" y="244.00000000000003" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">必要な速度と経路</text><text x="585" y="276.40000000000003" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">役割分担</text><line x1="758" y1="195" x2="812" y2="118" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><line x1="758" y1="195" x2="812" y2="272" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="1000" y="34" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="700">故障が起きた場面で変わる</text><rect x="820" y="50" width="360" height="130" rx="12" fill="#FFFFFF" stroke="#B23A3A" stroke-width="3"/><text x="1000" y="103" font-size="27" fill="#B23A3A" text-anchor="middle" font-weight="700">滑走中</text><text x="1000" y="147.8" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">中止できる余地</text><rect x="820" y="210" width="360" height="130" rx="12" fill="#FFFFFF" stroke="#B23A3A" stroke-width="3"/><text x="1000" y="263" font-size="27" fill="#B23A3A" text-anchor="middle" font-weight="700">浮揚後</text><text x="1000" y="307.8" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">飛行を続ける能力</text><path d="M585,344 L585,392 L185,392 L185,350" stroke="#C8742A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8" marker-end="url(#a-orange)" opacity="1"/><text x="385" y="430" font-size="24" fill="#C8742A" text-anchor="middle" font-weight="700">条件が厳しければ、重量・出発時刻・滑走路や目的地を変更</text><rect x="20" y="456" width="1160" height="60" rx="10" fill="#E8EEF5" stroke="#C9D3DE" stroke-width="2"/><text x="600" y="495" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">判断をすべて故障発生後へ残さない</text></svg>