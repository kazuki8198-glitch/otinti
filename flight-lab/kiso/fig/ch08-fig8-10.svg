<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="440" fill="#FFFFFF"/><line x1="129" y1="100" x2="495" y2="244" stroke="#2E6DA4" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" opacity="1"/><rect x="24" y="24" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="129" y="69" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">衛星 1</text><line x1="443" y1="100" x2="565" y2="244" stroke="#2E6DA4" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" opacity="1"/><rect x="338" y="24" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="443" y="69" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">衛星 2</text><line x1="757" y1="100" x2="635" y2="244" stroke="#2E6DA4" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" opacity="1"/><rect x="652" y="24" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="757" y="69" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">衛星 3</text><line x1="1071" y1="100" x2="705" y2="244" stroke="#2E6DA4" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 9" opacity="1"/><rect x="966" y="24" width="210" height="70" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="1071" y="69" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">衛星 4</text><rect x="450" y="250" width="300" height="84" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="303" font-size="30" fill="#1F3A5F" text-anchor="middle" font-weight="700">受信機</text><text x="200" y="290" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">信号到達時刻から</text><text x="200" y="322.4" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">距離に関する量を得る</text><text x="1000" y="290" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">3 次元位置と</text><text x="1000" y="322.4" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">時計のずれを求める</text><text x="600" y="395" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">通常は少なくとも 4 衛星</text><text x="600" y="428" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">数だけでは完全性や航空使用の承認を保証しない</text></svg>