<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="372" viewBox="0 0 1200 372" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="372" fill="#FFFFFF"/><rect x="30" y="20" width="1140" height="292" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><rect x="250" y="20" width="920" height="72" rx="0" fill="#E8EEF5" stroke="none" stroke-width="2"/><rect x="30" y="92" width="220" height="220" rx="0" fill="#E8EEF5" stroke="none" stroke-width="2"/><line x1="250" y1="20" x2="250" y2="312" stroke="#C9D3DE" stroke-width="3" stroke-linecap="butt" opacity="1"/><line x1="710" y1="20" x2="710" y2="312" stroke="#C9D3DE" stroke-width="3" stroke-linecap="butt" opacity="1"/><line x1="30" y1="92" x2="1170" y2="92" stroke="#C9D3DE" stroke-width="3" stroke-linecap="butt" opacity="1"/><line x1="30" y1="202" x2="1170" y2="202" stroke="#C9D3DE" stroke-width="3" stroke-linecap="butt" opacity="1"/><rect x="30" y="20" width="1140" height="292" rx="0" fill="none" stroke="#1F3A5F" stroke-width="3"/><text x="140" y="65" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">飛行方式</text><text x="480" y="65" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">VMC　有視界気象状態</text><text x="940" y="65" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">IMC　計器気象状態</text><text x="140" y="160" font-size="36" fill="#1F3A5F" text-anchor="middle" font-weight="700">VFR</text><text x="140" y="270" font-size="36" fill="#1F3A5F" text-anchor="middle" font-weight="700">IFR</text><text x="480" y="156" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">条件を満たして飛行</text><text x="940" y="156" font-size="25" fill="#B23A3A" text-anchor="middle" font-weight="700">そのまま進入しない</text><text x="480" y="266" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">VMC でも IFR は可能</text><text x="940" y="266" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">条件を満たした IFR で飛行</text><text x="600" y="352" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">条件の詳細は法令と航空情報で確認</text></svg>