<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="328" viewBox="0 0 1200 328" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="328" fill="#FFFFFF"/><text x="195" y="48" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">飛行計画</text><rect x="30" y="74" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="195" y="140" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">計画内容の通報</text><text x="195" y="173.75" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">必要な承認</text><text x="600" y="48" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">飛行への管制指示</text><rect x="435" y="74" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="140" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">経路・高度など</text><text x="600" y="173.75" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">許可された範囲</text><text x="1005" y="48" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">離陸の許可</text><rect x="840" y="74" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="1005" y="140" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">対象滑走路から</text><text x="1005" y="173.75" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">離陸する許可</text><path d="M30,246 L30,262 L1170,262 L1170,246" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="600" y="304" font-size="25" fill="#1F3A5F" text-anchor="middle" font-weight="700">それぞれの対象と段階を区別する</text></svg>