<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="352" viewBox="0 0 1200 352" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="352" fill="#FFFFFF"/><rect x="50" y="20" width="1100" height="78" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><line x1="440" y1="34" x2="440" y2="84" stroke="#C9D3DE" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="245" y="69" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">技能証明と限定</text><text x="795" y="68" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">資格・種類・等級・型式など</text><rect x="50" y="114" width="1100" height="78" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><line x1="440" y1="128" x2="440" y2="178" stroke="#C9D3DE" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="245" y="163" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">身体と技能の条件</text><text x="795" y="162" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">身体検査・必要な審査など</text><rect x="50" y="208" width="1100" height="78" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><line x1="440" y1="222" x2="440" y2="272" stroke="#C9D3DE" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="245" y="257" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">計画する飛行</text><text x="795" y="256" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">機体・飛行方式・業務の内容</text><text x="600" y="330" font-size="25" fill="#1F3A5F" text-anchor="middle" font-weight="700">一つの証明だけで、すべての飛行ができるとは限らない</text></svg>