<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="362" viewBox="0 0 1200 362" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker></defs><rect width="1200" height="362" fill="#FFFFFF"/><text x="195" y="48" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">変化を捉える</text><rect x="30" y="74" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="195" y="140" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">気象・性能・燃料</text><text x="195" y="173.75" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">対応できない条件</text><line x1="372" y1="149" x2="423" y2="149" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="600" y="48" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">早く伝える</text><rect x="435" y="74" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="140" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">現在の状況</text><text x="600" y="173.75" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">できない理由と要望</text><line x1="777" y1="149" x2="828" y2="149" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="1005" y="48" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">計画を更新する</text><rect x="840" y="74" width="330" height="150" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="1005" y="140" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">新たな条件を照合</text><text x="1005" y="173.75" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">必要な承認を確認</text><path d="M30,246 L30,262 L1170,262 L1170,246" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="600" y="304" font-size="25" fill="#1F3A5F" text-anchor="middle" font-weight="700">変更の相談と、許可された内容の確認を結び付ける</text><text x="600" y="346" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">緊急時の権限と手順は別に扱い、早めに援助を求める</text></svg>