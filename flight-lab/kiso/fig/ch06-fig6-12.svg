<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="316" viewBox="0 0 1040 316" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1040" height="316" fill="#FFFFFF"/><text x="195" y="34" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">接地対地速度 60 kt</text><text x="195" y="66" font-size="22" fill="#1F3A5F" text-anchor="middle" font-weight="500">速度の基準</text><text x="565" y="34" font-size="26" fill="#C8742A" text-anchor="middle" font-weight="700">接地対地速度 66 kt</text><text x="565" y="66" font-size="22" fill="#C8742A" text-anchor="middle" font-weight="500">速度は 60 kt の 1.1 倍</text><rect x="50" y="109.1" width="290" height="110" rx="10" fill="#F6F8FB" stroke="#1F3A5F" stroke-width="3"/><text x="195" y="158.1" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">運動エネルギー</text><text x="195" y="196.1" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="500">100%（基準）</text><rect x="420" y="86" width="290" height="133.1" rx="10" fill="#FBF3EA" stroke="#C8742A" stroke-width="3"/><text x="565" y="146.55" font-size="26" fill="#C8742A" text-anchor="middle" font-weight="700">運動エネルギー</text><text x="565" y="184.55" font-size="26" fill="#C8742A" text-anchor="middle" font-weight="700">121%（1.21 倍）</text><line x1="24" y1="219.1" x2="736" y2="219.1" stroke="#6B7280" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="880" y="153.1" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">同じ質量</text><text x="880" y="188.2" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">無風で比較</text><text x="520" y="265.1" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="700">速度 10% 増（1.1 倍）→ エネルギー 21% 増（1.1² ＝ 1.21 倍）</text><text x="520" y="301.1" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">着陸距離の増加率とは別</text></svg>