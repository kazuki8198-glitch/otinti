<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>FLIGHT LAB 教科書</title>
<style>
/* TEXTBOOK — style.css: FLIGHT LAB's textbook look (flight-lab/src/style.css: .bk-*, .quiz, table.terms, .tag, .mute,
   .small, .en, .row), with its colours rewritten as this page's variables for a light and a dark view. The figures
   and the calculators are drawn for a dark background (#e8f0fa words, green and red results): they always sit on a
   dark board (#0b1422), on screen and in print. System fonts only (works offline). */
:root {
  color-scheme: light;
  --fs: 16px;
  --bg: #f6f8fb; --panel: #ffffff; --side: #eef2f7; --line: #cdd6e2; --line2: #dfe5ee;
  --ink: #17202c; --muted: #5a6879; --dim: #7a8798;
  --accent: #0b6aa6; --accent-ink: #ffffff; --head: #0b5d92; --part: #9a5b00; --bold: #7a4a00;
  --green: #1d7a3e; --red: #b8322a; --amber: #a86400;
  --key-bg: rgba(29, 122, 62, .08); --warn-bg: rgba(168, 100, 0, .09); --soft: rgba(0, 40, 90, .035);
  --th-bg: rgba(11, 106, 166, .08); --sel: rgba(11, 106, 166, .14); --hover: rgba(11, 106, 166, .07);
  --en: #1f5f8b; --mark: #ffe066; --mark-ink: #17202c;
  --tag-fact: #2b7a4f; --tag-unk: #8a6a00;
  --board: #0b1422; --board-ink: #e8f0fa; --board-mut: #92a5be; --board-line: rgba(150, 176, 206, .26);
  --jp: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --headH: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #07101d; --panel: #0c1a2e; --side: #091525; --line: rgba(150, 176, 206, .26); --line2: #24364c;
    --ink: #e8f0fa; --muted: #92a5be; --dim: #6b7c92;
    --accent: #5fd4ff; --accent-ink: #04121f; --head: #5fd4ff; --part: #ffb547; --bold: #ffd28a;
    --green: #58e08c; --red: #ff6a5a; --amber: #ffb547;
    --key-bg: rgba(95, 212, 106, .07); --warn-bg: rgba(255, 178, 62, .08); --soft: rgba(255, 255, 255, .03);
    --th-bg: rgba(95, 212, 255, .08); --sel: rgba(95, 212, 255, .16); --hover: rgba(95, 212, 255, .08);
    --en: #9fd0f0; --mark: #ffd75e; --mark-ink: #10161f;
    --tag-fact: #8fe0b4; --tag-unk: #f0d68f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #07101d; --panel: #0c1a2e; --side: #091525; --line: rgba(150, 176, 206, .26); --line2: #24364c;
  --ink: #e8f0fa; --muted: #92a5be; --dim: #6b7c92;
  --accent: #5fd4ff; --accent-ink: #04121f; --head: #5fd4ff; --part: #ffb547; --bold: #ffd28a;
  --green: #58e08c; --red: #ff6a5a; --amber: #ffb547;
  --key-bg: rgba(95, 212, 106, .07); --warn-bg: rgba(255, 178, 62, .08); --soft: rgba(255, 255, 255, .03);
  --th-bg: rgba(95, 212, 255, .08); --sel: rgba(95, 212, 255, .16); --hover: rgba(95, 212, 255, .08);
  --en: #9fd0f0; --mark: #ffd75e; --mark-ink: #10161f;
  --tag-fact: #8fe0b4; --tag-unk: #f0d68f;
}

* { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--jp); font-size: 1rem; line-height: 1.6; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
a { color: var(--accent); }
button { font: inherit; font-size: .875rem; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
code { font-family: var(--mono); font-size: .92em; }
.mute { color: var(--muted); } .small { font-size: .78rem; } .note { font-size: .74rem; color: var(--muted); }
.tag { display: inline-block; font-size: .7rem; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); margin: 0 4px; vertical-align: 1px; line-height: 1.5; }
.tag.fact { border-color: var(--tag-fact); color: var(--tag-fact); } .tag.unk { border-color: var(--tag-unk); color: var(--tag-unk); }
.en { color: var(--en); }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.tb-skip { position: absolute; left: -9999px; } .tb-skip:focus { left: 8px; top: 8px; z-index: 30; background: var(--panel); padding: 4px 8px; }

/* ------------------------------------------------------------------ the frame: the header, the contents, the text */
.tb-head { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: var(--headH); }
.tb-brand { white-space: nowrap; }
.tb-tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; flex: 1; justify-content: flex-end; min-width: 0; }
.tb-tools input[type="search"] { flex: 1 1 220px; min-width: 0; max-width: 360px; }
.tb-size { display: inline-flex; } .tb-size button:first-child { border-radius: 6px 0 0 6px; } .tb-size button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
.tb-wrap { display: grid; grid-template-columns: 310px minmax(0, 1fr); }
.tb-side { position: sticky; top: var(--headH); align-self: start; height: calc(100vh - var(--headH)); overflow-y: auto; background: var(--side); border-right: 1px solid var(--line); padding: 8px 10px 40px; }
.tb-toc-hidden .tb-wrap { grid-template-columns: minmax(0, 1fr); } .tb-toc-hidden .tb-side { display: none; }
.tb-prog { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 2px 4px 6px; }
.tb-link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: inherit; }
.tb-part { margin: 14px 4px 4px; font: 700 .78rem/1.4 var(--jp); color: var(--part); }
.tb-toc-ct { margin: 8px 6px 2px; font: 700 .8rem/1.4 var(--jp); color: var(--ink); }
.bk-item { display: flex; gap: 8px; width: 100%; text-align: left; padding: 4px 8px; border: 0; border-radius: 5px; background: transparent; color: var(--ink); font: .82rem/1.45 var(--jp); cursor: pointer; }
.bk-item:hover { background: var(--hover); } .bk-item.sel { background: var(--sel); font-weight: 700; }
.bk-item .bk-num { color: var(--muted); min-width: 3.4em; flex: none; }
.bk-item.done .bk-num::after { content: " ✓"; color: var(--green); }
.tb-hit { margin-bottom: 4px; }
.tb-main { min-width: 0; padding: 16px 30px 60px; outline: none; }
.tb-main > * { max-width: 880px; }
.tb-notice { border: 1px solid var(--amber); background: var(--warn-bg); border-radius: 8px; padding: 8px 14px; margin: 0 0 18px; font-size: .82rem; line-height: 1.6; }
.tb-notice p { margin: 3px 0; }
.tb-nfn { font: 700 .82rem var(--mono); letter-spacing: .12em; color: var(--red); }
.tb-sec, .tb-sec [id], .tb-chapter { scroll-margin-top: calc(var(--headH) + 10px); }
.tb-appnote { border: 1px dashed var(--amber); border-radius: 6px; padding: 6px 12px; color: var(--amber); font-size: .88rem; font-weight: 700; }
.tb-summary { background: var(--soft); border-radius: 6px; padding: 8px 12px; }
.tb-pager { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 8px; }
.tb-pager button { max-width: 100%; text-align: left; }
.tb-note { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
.tb-scroll { overflow-x: auto; max-width: 100%; }
mark.tb-mark { background: var(--mark); color: var(--mark-ink); border-radius: 2px; padding: 0 1px; }
.bk-lesson { display: inline-block; margin: 6px 6px 0 0; padding: 2px 9px; border: 1px solid var(--line); border-radius: 12px; font-size: .8rem; color: var(--muted); background: var(--soft); }

/* ------------------------------------------------------------------ FLIGHT LAB's textbook (.bk-*) */
#tbView { font-size: .94rem; line-height: 1.85; }
.bk-chap { color: var(--muted); font: 700 .75rem/1.5 var(--jp); letter-spacing: .03em; }
.bk-title { margin: 4px 0 4px; font: 700 1.45rem/1.4 var(--jp); }
.tb-num { color: var(--muted); font-weight: 600; margin-right: .2em; }
.bk-en { color: var(--en); font-size: .82rem; margin-bottom: 10px; }
#tbView h3 { margin: 26px 0 6px; font: 700 1.06rem/1.5 var(--jp); color: var(--head); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
#tbView h4 { margin: 16px 0 4px; font: 700 .92rem/1.5 var(--jp); color: var(--ink); }
#tbView p { margin: 8px 0; } #tbView ul, #tbView ol { margin: 6px 0; padding-left: 1.4em; } #tbView li { margin: 3px 0; }
#tbView b { color: var(--bold); }
.bk-t { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: .85rem; line-height: 1.6; }
.bk-t th, .bk-t td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; text-align: left; }
.bk-t th { background: var(--th-bg); color: var(--head); }
.bk-radio td.who { white-space: nowrap; font: 700 .75rem var(--jp); width: 4.5em; }
.bk-radio td.who.p { color: var(--green); } .bk-radio td.who.a { color: var(--accent); }
.bk-radio td.en { font: 600 .85rem/1.55 var(--mono); color: var(--ink); width: 46%; }
@media (max-width: 700px) { .bk-radio td.en { width: auto; font-size: .78rem; } }
.bk-key { margin: 14px 0; padding: 10px 14px; border-left: 4px solid var(--green); background: var(--key-bg); border-radius: 4px; }
#tbView .bk-key > b { color: var(--green); } .bk-key ul { margin: 4px 0 0; }
.bk-warn { margin: 14px 0; padding: 10px 14px; border-left: 4px solid var(--amber); background: var(--warn-bg); border-radius: 4px; }
.bk-f { margin: 12px 0; padding: 8px 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; font: 600 .9rem var(--mono); text-align: center; color: var(--ink); overflow-x: auto; }
.bk-q { margin: 12px 0; padding: 10px 14px; background: var(--soft); border: 1px solid var(--line); border-radius: 6px; }
.bk-q summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
.bk-sim { margin: 14px 0; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 6px; font-size: .85rem; }
.bk-src { font-size: .78rem; color: var(--muted); }
.bk-src li { margin: 2px 0; }
.quiz { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; font-size: .88rem; line-height: 1.7; }
.quiz .ch { display: block; margin: 4px 0; cursor: pointer; }
.quiz .tb-check { margin-top: 4px; }
.quiz .res { margin-top: 6px; font-size: .82rem; }
.quiz .res.ok { color: var(--green); } .quiz .res.ng { color: var(--red); }
table.terms { border-collapse: collapse; width: 100%; font-size: .82rem; line-height: 1.55; }
table.terms td, table.terms th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
table.terms th { color: var(--muted); font-weight: 600; }

/* the dark boards: figures and calculators (their colours are drawn for #0b1422) */
.bk-fig { margin: 14px 0; padding: 10px; text-align: center; background: var(--board); border: 1px solid var(--board-line); border-radius: 8px; color: var(--board-ink); }
.bk-fig svg { width: 100%; max-width: 640px; height: auto; background: var(--board); display: block; margin: 0 auto; }
.bk-fig figcaption { font-size: .75rem; color: var(--board-mut); margin-top: 4px; line-height: 1.5; }
.bk-calc { background: var(--board); color: var(--board-ink); border: 1px solid var(--board-line); border-radius: 8px; padding: 10px 12px; margin: 12px 0; font-size: .85rem; line-height: 1.7; overflow-x: auto; }
#tbView .bk-calc b { color: #ffd28a; }
.bk-calc input { color: var(--board-ink); background: #13233a; border: 1px solid var(--board-line); width: 6.5em; padding: 3px 6px; }
.bk-calc label { white-space: nowrap; }
.bk-calc output { display: block; flex-basis: 100%; }
.bk-calc .bk-t { min-width: 460px; }
.bk-calc .bk-t th, .bk-calc .bk-t td { border-color: var(--board-line); color: var(--board-ink); }
.bk-calc .bk-t th { background: rgba(95, 212, 255, .08); color: #5fd4ff; }
.bk-fig, .bk-calc { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* ------------------------------------------------------------------ the whole book (#all) */
.tb-all-title { font: 700 1.6rem/1.4 var(--jp); margin: 4px 0 10px; }
.tb-all-toc { line-height: 1.55; font-size: .9rem; }
.tb-all-toc h2 { font: 700 1rem/1.5 var(--jp); color: var(--part); margin: 16px 0 4px; }
.tb-all-toc ol { margin: 2px 0; padding-left: 1.2em; list-style: none; } .tb-all-toc li { margin: 2px 0; }
.tb-all-toc a { text-decoration: none; } .tb-all-toc a:hover { text-decoration: underline; }
.tb-chapter { border-top: 3px solid var(--line); margin-top: 40px; padding-top: 10px; }
.tb-chapter-title { font: 700 1.5rem/1.4 var(--jp); margin: 8px 0 14px; }
.tb-chapter .tb-sec { margin-bottom: 28px; }
.tb-chapter .bk-title { font-size: 1.2rem; }

/* ------------------------------------------------------------------ phones: the contents above the text */
@media (max-width: 900px) {
  .tb-wrap { grid-template-columns: minmax(0, 1fr); }
  :root { --headH: 0px; }
  .tb-head { position: static; padding: 8px 12px; }
  .tb-brand { flex-basis: 100%; white-space: normal; }
  .tb-tools { flex-basis: 100%; justify-content: flex-start; }
  .tb-tools input[type="search"] { flex-basis: 100%; max-width: none; }
  .tb-side { position: static; height: auto; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--line); }
  .tb-main { padding: 12px 16px 40px; }
  .bk-title { font-size: 1.25rem; }
}

/* ------------------------------------------------------------------ print */
@media print {
  /* paper is white whatever the screen shows (the boards stay dark) */
  :root:not([data-print]), :root[data-theme] {
    color-scheme: light; --fs: 11pt;
    --bg: #fff; --panel: #fff; --side: #fff; --line: #cdd6e2; --ink: #17202c; --muted: #5a6879;
    --accent: #0b6aa6; --head: #0b5d92; --part: #9a5b00; --bold: #7a4a00; --green: #1d7a3e; --red: #b8322a; --amber: #a86400;
    --key-bg: rgba(29, 122, 62, .08); --warn-bg: rgba(168, 100, 0, .09); --soft: rgba(0, 40, 90, .035);
    --th-bg: rgba(11, 106, 166, .08); --en: #1f5f8b; --tag-fact: #2b7a4f; --tag-unk: #8a6a00;
  }
  .tb-head, .tb-side, .tb-pager, .tb-skip, .tb-check, .tb-prev { display: none !important; }
  .tb-wrap { display: block; }
  .tb-main { padding: 0; } .tb-main > * { max-width: none; }
  body { background: #fff; }
  .tb-chapter { break-before: page; border-top: 0; margin-top: 0; }
  .tb-all-toc { break-after: page; }
  .bk-fig, .bk-calc, .quiz, .bk-key, .bk-warn, tr { break-inside: avoid; }
  .tb-scroll, .bk-calc { overflow: visible; }
  a { color: inherit; }
}
</style>
</head>
<body>
<a class="tb-skip" href="#tbMain">本文へ移動</a>
<header class="tb-head">
  <div class="tb-brand"><b>FLIGHT LAB 教科書</b> <span class="small mute">全 6 部・27 章・120 節</span></div>
  <div class="tb-tools">
    <input type="search" id="tbSearch" placeholder="本文を検索（例：失速、Vmc、METAR）" aria-label="教科書を検索" autocomplete="off">
    <button type="button" id="tbTocBtn" class="tb-toc-btn" aria-controls="tbNav" aria-expanded="true">目次</button>
    <button type="button" id="tbAll" aria-pressed="false">全文</button>
    <button type="button" id="tbTheme" title="表示の明るさ">表示：自動</button>
    <span class="tb-size" role="group" aria-label="文字の大きさ"><button type="button" id="tbSmaller" aria-label="文字を小さく">A−</button><button type="button" id="tbBigger" aria-label="文字を大きく">A＋</button></span>
  </div>
</header>
<div class="tb-wrap">
  <aside class="tb-side" id="tbNav" aria-label="目次">
    <div class="tb-prog small mute"><span id="tbProg"></span> <button type="button" id="tbReset" class="tb-link">読んだ印を消す</button></div>
    <div id="tbToc"></div>
  </aside>
  <main class="tb-main" id="tbMain" tabindex="-1">
    <div class="tb-notice" role="note">
      <p><b>このページは公開情報を基にした非公式の自主学習用教材です。実機訓練、教官の指示、POH/AFM、SOP、航空法規を優先してください。</b></p>
      <p>ANA の公式ソフトウェア・公式教材ではありません。</p>
      <p class="tb-nfn">NOT FOR NAVIGATION</p>
      <p>本文の『この教材』『本アプリ』『このシミュレータ』は FLIGHT LAB（シミュレータのアプリ）のことです。キー操作・メニュー・飛行課目・学科テスト・英語交信のページは、このページにはありません。</p>
    </div>
    <div id="tbView"><noscript><p>このページを読むには JavaScript を有効にしてください（外部との通信はしません）。</p></noscript></div>
  </main>
</div>
<script>
/* ---- FLIGHT LAB: physics.js ---- */
// FLIGHT LAB — physics.js
// The flight model of 空島フライト (Sorajima Flight), carried over: blade-element aerodynamics (the wing cut into
// strips, the tailplane and the fin into pieces, each with its own airflow, angle of attack and stall), tuned at
// load time to the aircraft's reference stability data; a propeller with its left-turning tendencies (slipstream,
// P-factor, torque, gyroscopic precession); the three wheels on springs and dampers with brakes and nose-wheel
// steering; ground effect; turbulence that varies across the span; the keyboard pitch hold, the stick curves and the
// optional assists exactly as there. The world here is the app's own flat teaching ground (55 ft) with the fictional
// LAB RWY 36 and its lakes. Numbers are TEACHING VALUES (仮想教材値); the reference speeds of the two aircraft follow
// published training checklists (sources in the documents), but this is not the aircraft's certified performance.
// Axes (as in Sorajima): world x = east, y = up, z = south; body x = right wing, y = up, -z = the nose.
(function (FL) {
  'use strict';
  const DEG = Math.PI / 180, KT = 1.943844, FT = 3.28084, G = 9.81;
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const wrap360 = a => ((a % 360) + 360) % 360;
  const wrap180 = a => ((a + 540) % 360) - 180;
  // ---------------------------------------------------------------- vectors and quaternions [x, y, z, w]
  const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const vscale = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const vmadd = (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s];
  const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const vlen = a => Math.hypot(a[0], a[1], a[2]);
  const vnorm = a => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const qmul = (a, b) => [
    a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
    a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
    a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
    a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
  const qconj = q => [-q[0], -q[1], -q[2], q[3]];
  const qaxis = (ax, ang) => { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; };
  const qnorm = q => { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; };
  function qrot(q, v) {

  // ---------------------------------------------------------------- MFD (right screen): engine strip + MAP / FPL
  function drawMFD(g, W, H, d) {
    const o = d.o, av = d.av, nav = d.nav;
    g.save();
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    // --- the engine strip (what this teaching model computes; '—' where it has nothing) ---
    const ew = W * 0.2;
    box(g, 0, 0, ew, H, '#05070a', C.line);
    txt(g, 'ENGINE', ew / 2, 14, 13, C.white, 'center', 700);
    // RPM arc
    const engs = d.eng && d.eng.length ? d.eng : [{ run: true, rpm: o.rpm }], twin = engs.length > 1, cap = d.fuelCap || 24;
    g.lineWidth = twin ? 5 : 7;
    engs.forEach((e, i) => {
      const rx = twin ? ew * (0.27 + 0.46 * i) : ew / 2, ry = 70, rr = ew * (twin ? 0.19 : 0.34), rpm = clamp(fin(e.rpm), 0, 2800);
      const arc = (a, b, col) => { g.strokeStyle = col; g.beginPath(); g.arc(rx, ry, rr, (210 - 240 * a / 2800) * -DEG, (210 - 240 * b / 2800) * -DEG, false); g.stroke(); };
      arc(500, 2700, C.green); arc(2700, 2800, C.red);
      const ta = (210 - 240 * rpm / 2800) * -DEG; line(g, rx, ry, rx + Math.cos(ta) * (rr - 4), ry + Math.sin(ta) * (rr - 4), e.run ? C.white : C.red, 3);
      txt(g, Math.round(rpm), rx, ry + 22, twin ? 13 : 16, e.run ? C.white : C.red, 'center', 700); txt(g, twin ? (i ? 'R RPM' : 'L RPM') : 'RPM', rx, ry + 38, 11, C.grey);
    });
    const run = engs.some(e => e.run);
    const rows = [
      ['出力 PWR', run ? `${fin(o.powerPct)} %` : '0 %', run ? fin(o.powerPct) / 100 : 0, '教材モデルの出力'],
      ['FFLOW GPH', fin(o.fuelFlow).toFixed(1), fin(o.fuelFlow) / (twin ? 24 : 12), ''],
      [twin ? 'MAN IN' : 'OIL PSI', '—', null, '未実装'],
      ['OIL °F', '—', null, '未実装'],
      ['EGT °F', '—', null, '未実装'],
      ['FUEL L GAL', fin(o.fuel && o.fuel[0]).toFixed(1), fin(o.fuel && o.fuel[0]) / cap, ''],
      ['FUEL R GAL', fin(o.fuel && o.fuel[1]).toFixed(1), fin(o.fuel && o.fuel[1]) / cap, ''],
      ['VOLTS', '—', null, '未実装'],
      ['AMPS', '—', null, '未実装'],

    txt(g, '— = 未実装（架空値は出しません）', ew / 2, H - 12, 9, C.grey, 'center', 500, jp);

    if (av.fail && av.fail.gps) { g.fillStyle = '#000'; g.fillRect(px, 0, pw, H); txt(g, 'GPS 信号なし — 地図・位置は使えません', px + pw / 2, H / 2, 16, C.yellow, 'center', 700, jp); txt(g, 'VOR（NAV1）と DME で位置を確かめる', px + pw / 2, H / 2 + 24, 13, C.grey, 'center', 600, jp); }

    txt(g, 'G1000型 教材表示 · 架空訓練点 · NOT FOR NAVIGATION', px + pw / 2, H - 8, 10, C.grey, 'center', 600, jp);

<script>
/* ---- FLIGHT LAB: school.js ---- */
// FLIGHT LAB — school.js

// to do (the instructor's words), gives the starting attitude and power as a guide computed from the flight model's own
// equations ("pitch + power = performance", the way a real instructor quotes them), watches target values with
// tolerances, gives hints as a real instructor would (which control fixes which deviation in this phase of flight),

// touchdown, the altitude lost in a stall recovery, the time to full power...). FLIGHT LAB adds three levels
// (導入 / 基礎 / 精度) that scale the tolerances and the continuous hold: a step with `hold` is done only after every
// target stays inside its tolerance for that many seconds IN A ROW (the hold timer resets to 0 when any target leaves it).

  // 導入 widens them, 精度 narrows them (an advanced teaching target, close to some Commercial / Instrument ACS items)
  const LEVELS = [
    { id: 'intro', name: '導入', en: 'Introduction', k: 1.5, holdK: 0.5, hints: true, guide: true, desc: '許容幅を基礎の 1.5 倍に広げ、連続保持の時間を半分に。目安（姿勢と出力）と教官のヒントをすべて表示。' },
    { id: 'basic', name: '基礎', en: 'Basic', k: 1.0, holdK: 1.0, hints: true, guide: true, desc: '許容幅は FAA 自家用操縦士 ACS（実地試験基準）を参考にした値。目安とヒントを表示。' },
    { id: 'precision', name: '精度', en: 'Precision', k: 0.6, holdK: 1.5, hints: false, guide: false, desc: '許容幅を基礎の 6 割に狭め、連続保持を 1.5 倍に。目安とヒントは出さない（事業用・計器飛行の水準を意識した教材用の上級目標）。' },
  ];
  const level = id => LEVELS.find(l => l.id === id) || LEVELS[0];

  // ---------------------------------------------------------------- the instructor's guide: attitude and power

    const a = Math.abs(p);

    climbFull: '速度が速ければ機首を 1〜2° 上げ、遅ければ下げる。出力は全開のまま（上昇中の速度は機首で合わせる）',

  // the diversion estimate (lesson n2): the truth, then the rows
  function estimateTruth(L, id = 'LABEF') {
    const A = FL.avionics, w = A.wpt(id), pos = ph.ne(L.s), dist = A.neDistNm(pos, w), brg = A.trueToMag(A.neBearing(pos, w), ph.MAGVAR_W), gs = Math.max(60, L.s.out.gs || 100);
    return { brg: Math.round(brg), dist: +dist.toFixed(1), eteMin: +(dist / gs * 60).toFixed(1) };
  }
  function submitEstimate(L, input) {
    const truth = estimateTruth(L), num = v => (Number.isFinite(+v) && String(v).trim() !== '' ? +v : NaN);
    L.estimate = { hdg: num(input.hdg), dist: num(input.dist), eteMin: num(input.eteMin), truth };
    return L.estimate;
  }
  function estimateRows(L) {
    const e = L.estimate, kk = L.level.k;
    if (!e) return [{ name: '見積もり', val: '未入力', std: '針路・距離・時間を入力', pass: false }];
    const dh = Number.isFinite(e.hdg) ? Math.abs(w180(e.hdg - e.truth.brg)) : 999, dd = Number.isFinite(e.dist) ? Math.abs(e.dist - e.truth.dist) / Math.max(0.1, e.truth.dist) * 100 : 999, de = Number.isFinite(e.eteMin) ? Math.abs(e.eteMin - e.truth.eteMin) / Math.max(0.1, e.truth.eteMin) * 100 : 999;
    return [
      { name: '針路（磁方位）', val: `${Number.isFinite(e.hdg) ? Math.round(e.hdg) : '—'}°（正解 ${e.truth.brg}°）`, std: `±${Math.round(15 * kk)}°`, pass: dh <= 15 * kk },
      { name: '距離', val: `${Number.isFinite(e.dist) ? e.dist : '—'} NM（正解 ${e.truth.dist}）`, std: `±${Math.round(20 * kk)}%`, pass: dd <= 20 * kk },
      { name: '所要時間', val: `${Number.isFinite(e.eteMin) ? e.eteMin : '—'} 分（正解 ${e.truth.eteMin}）`, std: `±${Math.round(20 * kk)}%`, pass: de <= 20 * kk },
    ];
  }

<script>
/* ---- FLIGHT LAB: book-figs.js ---- */
// FLIGHT LAB — book-figs.js
// The textbook's figures (inline SVG, drawn from the flight model's own data where they show numbers, so the book
// and the simulator agree) and its small calculators. Figures and tables of 空島フライト carried over and moved to
// the FAA world (feet, knots, inHg, the US airspace classes, 14 CFR 91.155), plus new ones for multi-engine flying,
// instruments and TEM. Teaching drawings, not charts: NOT FOR NAVIGATION.
(function (FL) {
  'use strict';
  const DEG = Math.PI / 180;
  const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const C = { ink: '#e8f0fa', mut: '#92a5be', grid: 'rgba(150,176,206,.18)', cy: '#5fd4ff', gr: '#5fd46a', rd: '#ff6a5a', am: '#ffb23e', vi: '#c58cff', bl: '#3d8bff', bg: '#0b1422' };
  const svg = (w, h, body, cap = '') => `<figure class="bk-fig"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${cap}">${body}</svg>${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;
  const T = (x, y, s, o = {}) => `<text x="${x}" y="${y}" fill="${o.c || C.ink}" font-size="${o.fs || 12}" text-anchor="${o.a || 'middle'}" ${o.b ? 'font-weight="700"' : ''} ${o.rot ? `transform="rotate(${o.rot} ${x} ${y})"` : ''}>${s}</text>`;
  const L = (x1, y1, x2, y2, c = C.ink, w = 1.5, dash = '') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  const A = (x1, y1, x2, y2, c, w = 3) => { const a = Math.atan2(y2 - y1, x2 - x1), hh = 9; return L(x1, y1, x2, y2, c, w) + `<path d="M${x2} ${y2} L${x2 - hh * Math.cos(a - 0.45)} ${y2 - hh * Math.sin(a - 0.45)} L${x2 - hh * Math.cos(a + 0.45)} ${y2 - hh * Math.sin(a + 0.45)} Z" fill="${c}"/>`; };
  const P = (pts, c, w = 2, fill = 'none', dash = '') => `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" stroke="${c}" stroke-width="${w}" fill="${fill}" ${dash ? `stroke-dasharray="${dash}"` : ''}/>`;
  const frame = (w, h, x0, x1, y0, y1, xt, yt, xl, yl, m = { l: 50, r: 14, t: 14, b: 36 }) => {
    const X = v => m.l + (v - x0) / (x1 - x0) * (w - m.l - m.r), Y = v => h - m.b - (v - y0) / (y1 - y0) * (h - m.t - m.b);
    let s = '';
    for (const v of xt) s += L(X(v), m.t, X(v), h - m.b, C.grid, 1) + T(X(v), h - m.b + 15, v, { c: C.mut, fs: 11 });
    for (const v of yt) s += L(m.l, Y(v), w - m.r, Y(v), C.grid, 1) + T(m.l - 6, Y(v) + 4, v.toLocaleString ? v.toLocaleString() : v, { c: C.mut, fs: 11, a: 'end' });
    s += T((m.l + w - m.r) / 2, h - 4, xl, { c: C.mut, fs: 11 }) + T(12, (m.t + h - m.b) / 2, yl, { c: C.mut, fs: 11, rot: -90 });
    return { X, Y, s };
  };
  const ac = id => FL.physics.AIRCRAFT.find(a => a.id === id);
  const table = (head, rows) => `<table class="bk-t"><tr>${head.map(x => `<th>${x}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;

  const FIG = {
    forces() {
      let s = '<g transform="translate(170 110)"><ellipse cx="0" cy="0" rx="70" ry="10" fill="#dfe6ee"/><rect x="-66" y="-26" width="12" height="18" fill="#dfe6ee"/><rect x="-14" y="-4" width="40" height="5" fill="#9fb3c8"/>';
      s += A(0, 0, 0, -80, C.gr) + T(0, -88, '揚力（Lift）', { c: C.gr, b: 1 }) + A(0, 0, 0, 80, C.mut) + T(0, 100, '重力（Weight）', { c: C.mut, b: 1 });
      s += A(70, 0, 140, 0, C.am) + T(140, -10, '推力（Thrust）', { c: C.am, b: 1, a: 'end' }) + A(-70, 0, -140, 0, C.rd) + T(-140, -10, '抗力（Drag）', { c: C.rd, b: 1, a: 'start' }) + '</g>';
      return svg(340, 220, s, '図：水平飛行中の 4 つの力。速度も高度も一定なら、揚力＝重力、推力＝抗力でつり合っている');
    },
    aoa() {
      let s = `<g transform="translate(60 120) rotate(-12)"><path d="M0 0 C 30 -22, 120 -20, 200 0 C 120 8, 30 8, 0 0 Z" fill="#dfe6ee"/>${L(-30, 0, 240, 0, C.am, 1.5, '6 4')}${T(250, 4, '翼弦線（chord line）', { c: C.am, a: 'start', fs: 11 })}</g>`;
      s += A(20, 160, 290, 160, C.cy, 2) + T(150, 180, '相対風（relative wind：飛行機が進む向きの反対から来る空気）', { c: C.cy, fs: 11 });
      s += `<path d="M 260 160 A 200 200 0 0 0 256 118" stroke="${C.rd}" stroke-width="2" fill="none"/>` + T(282, 140, '迎え角 α（AOA）', { c: C.rd, b: 1, a: 'start' });
      return svg(420, 190, s, '図：迎え角は「翼弦線」と「相対風」の角度。機首の向き（ピッチ角）とは別もの');
    },
    liftCurve() {
      const p = ac('pa28').phys, W = 440, H = 250;
      const f = frame(W, H, -4, 22, -0.4, 2.4, [-4, 0, 4, 8, 12, 16, 20], [0, 0.5, 1, 1.5, 2], '迎え角 α（度）', '揚力係数 CL');
      const cl = (a, fl) => { const r = a * DEG, cl0 = p.CL0 + p.flapCL * fl, aS = p.aStall - p.flapStall * fl, sw = smoothstep(0, 0.07, r - aS); return lerp(cl0 + p.CLa * r, 1.15 * Math.sin(2 * r), sw); };
      const pts = fl => { const o = []; for (let a = -4; a <= 22; a += 0.25) o.push([f.X(a), f.Y(cl(a, fl))]); return o; };
      let s = f.s + P(pts(0), C.cy, 2.5) + P(pts(1), C.am, 2.5, 'none', '6 4');
      const aS = p.aStall / DEG, cmax = cl(aS + 1.2, 0);
      s += L(f.X(aS + 1.2), f.Y(cmax) - 4, f.X(aS + 1.2), f.Y(-0.4), C.rd, 1, '3 3') + T(f.X(aS + 1.2) + 4, f.Y(cmax) - 10, `臨界迎え角 約 ${Math.round(aS + 1)}°`, { c: C.rd, fs: 11, a: 'start' });
      s += T(f.X(2), f.Y(1.25), 'フラップ 40°', { c: C.am, fs: 11 }) + T(f.X(6.5), f.Y(0.45), 'フラップ UP', { c: C.cy, fs: 11 });
      return svg(W, H, s, '図：Archer（教材モデル）の揚力曲線。迎え角に比例して揚力が増え、臨界迎え角を超えると急に減る＝失速。フラップを下げると曲線が上へずれ、臨界迎え角は少し小さくなる');
    },
    dragCurve() {
      const p = ac('pa28').phys, W = 440, H = 250, Wt = p.mass * 9.81;
      const f = frame(W, H, 40, 140, 0, 3000, [40, 60, 80, 100, 120, 140], [0, 1000, 2000, 3000], '指示対気速度（kt）', '抗力（N）');
      const ind = [], par = [], tot = []; let best = null;
      for (let v = 44; v <= 140; v += 1) {
        const V = v / 1.94384, q = 0.5 * 1.225 * V * V, CL = Wt / (q * p.S), Dp = p.CD0 * q * p.S, Di = p.K * CL * CL * q * p.S;
        par.push([f.X(v), f.Y(Dp)]); ind.push([f.X(v), f.Y(Math.min(Di, 3000))]); tot.push([f.X(v), f.Y(Math.min(Dp + Di, 3000))]);
        if (!best || Dp + Di < best[1]) best = [v, Dp + Di];
      }
      let s = f.s + P(par, C.am, 2, 'none', '6 4') + P(ind, C.vi, 2, 'none', '6 4') + P(tot, C.cy, 2.8);
      s += `<circle cx="${f.X(best[0])}" cy="${f.Y(best[1])}" r="5" fill="${C.gr}"/>` + T(f.X(best[0]), f.Y(best[1]) + 20, `最小抗力 約 ${best[0]} kt`, { c: C.gr, fs: 11 });
      s += T(f.X(128), f.Y(2350), '有害抗力', { c: C.am, fs: 11 }) + T(f.X(52), f.Y(2500), '誘導抗力', { c: C.vi, fs: 11, a: 'start' }) + T(f.X(116), f.Y(1350), '全抗力', { c: C.cy, fs: 11, b: 1 });
      return svg(W, H, s, '図：速度と抗力（Archer 教材モデル・海面上・プロペラ停止の影響は含まない）。遅いと誘導抗力、速いと有害抗力が増え、その間に抗力が最小（揚抗比が最大）になる速度がある。チェックリストの最良滑空 76 kt は、風車状態のプロペラの抗力などを含む実機の値');
    },
    vn() {
      const v = ac('pa28').v, W = 440, H = 260, nP = 3.8, nN = -1.52;
      const f = frame(W, H, 0, 170, -2, 4.5, [0, 40, 80, 120, 160], [-2, -1, 0, 1, 2, 3, 4], '指示対気速度（kt）', '荷重倍数 n（G）');
      const vs = v.s1, va = Math.round(vs * Math.sqrt(nP)), vsN = 62;
      const up = []; for (let x = 0; x <= va; x += 1) up.push([f.X(x), f.Y(Math.min((x / vs) ** 2, nP))]);
      const xn = Math.sqrt(-nN) * vsN, dn = []; for (let x = 0; x <= xn; x += 1) dn.push([f.X(x), f.Y(-((x / vsN) ** 2))]);
      let s = f.s + L(f.X(0), f.Y(0), f.X(170), f.Y(0), C.mut, 1);
      s += `<path d="M${f.X(0)} ${f.Y(0)} ${up.map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')} L${f.X(v.ne)} ${f.Y(nP)} L${f.X(v.ne)} ${f.Y(nN)} L${f.X(xn)} ${f.Y(nN)} ${dn.reverse().map(p => 'L' + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')} Z" fill="rgba(95,212,255,.1)" stroke="${C.cy}" stroke-width="2"/>`;
      s += L(f.X(v.no), f.Y(nP), f.X(v.no), f.Y(nN), C.am, 1.2, '4 3') + T(f.X(v.no), f.Y(4.2), `Vno ${v.no}`, { c: C.am, fs: 11 }) + T(f.X(v.ne), f.Y(4.2), `Vne ${v.ne}`, { c: C.rd, fs: 11 });
      s += L(f.X(va), f.Y(nP), f.X(va), f.Y(0), C.gr, 1.2, '4 3') + T(f.X(va), f.Y(4.2), `Va 約 ${va}`, { c: C.gr, fs: 11 });
      s += T(f.X(30), f.Y(2.6), '失速', { c: C.mut, fs: 11 }) + T(f.X(100), f.Y(1.5), '飛べる範囲', { c: C.cy, b: 1 }) + T(f.X(145), f.Y(-1.2), '構造の限界', { c: C.rd, fs: 11 });
      return svg(W, H, s, `図：V-n 線図（普通類 +${nP} G／${nN} G の例・教材の Archer）。曲線の左は失速、上下の線を超えると構造が壊れるおそれ。チェックリストの Va は最大重量で ${v.va} kt（重量が軽いほど小さい）`);
    },
    turnTable() {
      return table(['バンク角', '荷重倍数', '失速速度の増加', '100 kt での旋回率', '100 kt での旋回半径'], [10, 20, 30, 45, 60, 75].map(b => {
        const tn = Math.tan(b * DEG), n = 1 / Math.cos(b * DEG);
        return [`${b}°`, `${n.toFixed(2)} G`, `×${Math.sqrt(n).toFixed(2)}（+${Math.round((Math.sqrt(n) - 1) * 100)}%）`, `${(1091 * tn / 100).toFixed(1)}°/秒`, `${Math.round(100 * 100 / (11.26 * tn)).toLocaleString()} ft`];
      }));
    },
    leftTurning() {
      let s = '<g transform="translate(170 150)"><rect x="-8" y="-70" width="16" height="130" rx="8" fill="#dfe6ee"/><rect x="-90" y="-20" width="180" height="22" rx="6" fill="#dfe6ee"/><rect x="-36" y="46" width="72" height="12" rx="4" fill="#dfe6ee"/>';
      s += L(-46, -76, 46, -76, C.mut, 4) + A(24, -70, 40, -60, C.am, 2) + A(-24, -82, -40, -92, C.am, 2);
      s += T(50, -46, '下がるブレード（右）', { c: C.am, fs: 11, a: 'start' }) + T(-50, -100, '上がるブレード（左）', { c: C.am, fs: 11, a: 'end' });
      s += A(40, -80, 40, -126, C.gr, 3) + A(-40, -80, -40, -100, C.gr, 2) + T(48, -118, '推力 大', { c: C.gr, fs: 11, a: 'start' }) + T(-34, -112, '推力 小', { c: C.gr, fs: 11, a: 'start' });
      s += `<path d="M 60 70 A 70 70 0 0 1 -60 70" stroke="${C.rd}" stroke-width="2.5" fill="none"/>` + A(-50, 77, -62, 68, C.rd, 2.5) + T(0, 100, '機首は左へ振られる → 右ラダーで打ち消す', { c: C.rd, fs: 12, b: 1 }) + '</g>';
      return svg(340, 270, s, '図：P ファクター（上から見た図）。機首上げ（大きな迎え角）で右側の下がるブレードの迎え角が大きくなり、右側の推力が大きくなって機首が左を向く（操縦席から見て時計回りのプロペラ）');
    },
    stability() {
      const cup = (x, lab, sub, path, ball) => `<path d="${path}" stroke="${C.cy}" stroke-width="2.5" fill="none"/><circle cx="${ball[0]}" cy="${ball[1]}" r="9" fill="${C.am}"/>` + T(x, 150, lab, { c: C.ink, b: 1 }) + T(x, 166, sub, { c: C.mut, fs: 10 });
      const s = cup(70, '正の静安定', '元に戻ろうとする', 'M20 60 Q70 150 120 60', [70, 96]) + cup(210, '中立', 'その場にとどまる', 'M160 105 L260 105', [210, 96]) + cup(350, '負の静安定', 'ずれがどんどん大きくなる', 'M300 120 Q350 30 400 120', [350, 66]);
      return svg(420, 180, s, '図：静安定のたとえ。飛行機は縦（ピッチ）と方向（ヨー）に正の静安定を持つよう設計されている');
    },
    pattern() {
      // LAB RWY 36: the runway vertical (north up), a LEFT pattern on its west side
      let s = `<rect x="300" y="40" width="16" height="200" fill="#3a4658" stroke="${C.mut}"/>` + T(308, 254, '36', { c: C.ink, fs: 12, b: 1 }) + T(308, 32, '18', { c: C.mut, fs: 11 });
      const pts = [[308, 30], [308, 10], [280, 0], [110, 0], [80, 20], [80, 270], [110, 300], [280, 300], [308, 290], [308, 245]];
      s += P(pts, C.cy, 2.5) + A(308, 270, 308, 252, C.cy, 2.5) + A(150, 300, 200, 300, C.cy, 2);
      s += T(330, 18, '離陸・上昇（upwind）', { c: C.cy, fs: 11, a: 'start' }) + T(190, -8, 'クロスウインド', { c: C.cy, fs: 11 });
      s += T(64, 150, 'ダウンウインド：地上 1,000 ft・90 kt・方位 180°', { c: C.cy, fs: 11, rot: -90 }) + T(190, 318, 'ベース：方位 090°・フラップ 25°・75 kt', { c: C.cy, fs: 11 }) + T(330, 276, `ファイナル：70 kt・フラップ 40°`, { c: C.cy, fs: 11, a: 'start' });
      s += `<circle cx="80" cy="240" r="6" fill="${C.am}"/>` + T(92, 236, 'アビーム：パワーを絞りフラップ 10°・降下開始', { c: C.am, fs: 10, a: 'start' });
      s += `<circle cx="96" cy="292" r="6" fill="${C.gr}"/>` + T(110, 282, '進入端が斜め後ろ 45° でベースへ', { c: C.gr, fs: 10, a: 'start' });
      s += T(200, 150, '旋回はすべて左（反時計回り）', { c: C.mut, fs: 11 }) + T(200, 168, '約 1.6 km（1 NM）離れて滑走路と平行', { c: C.mut, fs: 10 });
      return svg(520, 330, `<g transform="translate(20 10)">${s}</g>`, '図：LAB RWY 36（架空）の左場周経路と、この教材の Archer の目安。場周高度は AIM の推奨（プロペラ機は地上 1,000 ft）が一般的だが、空港ごとに決まりがある（Chart Supplement で確認）');
    },
    windTriangle() {
      let s = A(60, 220, 260, 40, C.cy, 3) + T(120, 110, '機首方位・真対気速度（TAS）', { c: C.cy, fs: 11, rot: -42 });
      s += A(260, 40, 330, 90, C.am, 3) + T(330, 60, '風', { c: C.am, fs: 12, b: 1, a: 'start' });
      s += A(60, 220, 330, 90, C.gr, 3) + T(220, 190, '実際の航跡（track）・対地速度（GS）', { c: C.gr, fs: 11, rot: -26 });
      s += `<path d="M 118 168 A 80 80 0 0 1 130 184" stroke="${C.rd}" stroke-width="2" fill="none"/>` + T(144, 196, '偏流修正角（WCA）', { c: C.rd, fs: 11, a: 'start' });
      return svg(400, 240, s, '図：風の三角形。「行きたい航跡」を飛ぶには、風上側に機首を向ける（偏流修正）');
    },
    holding() {
      let s = `<circle cx="120" cy="120" r="6" fill="${C.am}"/>` + T(120, 142, 'フィックス（VOR 等）', { c: C.am, fs: 11 });
      s += `<path d="M120 120 L320 120 A 45 45 0 0 1 320 210 L120 210 A 45 45 0 0 1 120 120" stroke="${C.cy}" stroke-width="2.5" fill="none"/>`;
      s += A(200, 120, 215, 120, C.cy) + A(240, 210, 225, 210, C.cy) + T(220, 110, 'アウトバウンド（1 分）', { c: C.cy, fs: 11 }) + T(220, 230, 'インバウンド（1 分・14,000 ft 以下）', { c: C.cy, fs: 11 });
      s += L(120, 30, 120, 290, C.mut, 1, '5 4') + L(120, 120, 200, 30, C.mut, 1, '5 4');
      s += T(70, 60, 'パラレル', { c: C.gr, fs: 12, b: 1 }) + T(70, 78, 'エントリー', { c: C.gr, fs: 11 }) + T(175, 50, 'ティアドロップ', { c: C.vi, fs: 12, b: 1 }) + T(60, 250, 'ダイレクト', { c: C.rd, fs: 12, b: 1 }) + T(60, 268, 'エントリー', { c: C.rd, fs: 11 });
      return svg(400, 300, s, '図：右回りの標準待機経路と 3 つの入り方（どの方向からフィックスに来たかで決まる。AIM 5-3-8）');
    },
    wbEnvelope() {
      const W = 440, H = 260, env = FL.bookCalc.ARCHER_WB.env;
      const f = frame(W, H, 80, 95, 1600, 2600, [80, 83, 86, 89, 92, 95], [1700, 2000, 2300, 2600], '重心位置（基準線から in）', '重量（lb）');
      let s = f.s + `<path d="${env.map((p, i) => (i ? 'L' : 'M') + f.X(p[0]).toFixed(1) + ' ' + f.Y(p[1]).toFixed(1)).join(' ')} Z" fill="rgba(95,212,255,.12)" stroke="${C.cy}" stroke-width="2"/>`;
      s += T(f.X(89.5), f.Y(1900), '許容範囲', { c: C.cy, b: 1 }) + T(f.X(81.5), f.Y(2450), '前すぎ', { c: C.rd, fs: 11 }) + T(f.X(94), f.Y(2100), '後ろすぎ', { c: C.rd, fs: 11, rot: -90 });
      return svg(W, H, s, '図：重量・重心の許容範囲（エンベロープ）の形の例。数値は教材用近似で、実機は必ずその機体の POH / 重量重心表で');
    },
    clouds() {

    atm() {

    vfrMinima() {
      return table(['空域', '飛行視程', '雲からの距離（下 / 上 / 水平）'], [
        ['Class A', '—（VFR 不可）', '—'], ['Class B', '3 SM', '雲に入らない（Clear of clouds）'], ['Class C', '3 SM', '500 ft 下 / 1,000 ft 上 / 2,000 ft 水平'], ['Class D', '3 SM', '500 ft 下 / 1,000 ft 上 / 2,000 ft 水平'],
        ['Class E（10,000 ft MSL 未満）', '3 SM', '500 ft 下 / 1,000 ft 上 / 2,000 ft 水平'], ['Class E（10,000 ft MSL 以上）', '5 SM', '1,000 ft 下 / 1,000 ft 上 / 1 SM 水平'],
        ['Class G（地上 1,200 ft 以下）昼', '1 SM', '雲に入らない'], ['Class G（地上 1,200 ft 以下）夜', '3 SM', '500 / 1,000 / 2,000 ft（場周経路の特例あり）'],
        ['Class G（地上 1,200 ft 超・10,000 ft MSL 未満）昼', '1 SM', '500 ft 下 / 1,000 ft 上 / 2,000 ft 水平'], ['Class G（同）夜', '3 SM', '500 ft 下 / 1,000 ft 上 / 2,000 ft 水平'],
        ['Class G（地上 1,200 ft 超・10,000 ft MSL 以上）', '5 SM', '1,000 ft 下 / 1,000 ft 上 / 1 SM 水平']]) + '<p class="bk-src">出典：14 CFR 91.155(a)。このほか、地表まで設定された管制空域（Class B・C・D・E の地表区域）では、雲高 1,000 ft 未満では雲の下を VFR で飛べず（91.155(c)）、地上視程 3 SM 以上でないと VFR で離着陸・場周経路に入れない（91.155(d)）。特別有視界飛行方式（91.157）は別。</p>';
    },
    airspace() {
      // a schematic cross-section of US airspace (heights are typical, not universal)
      const W = 520, H = 260, y = ft => 230 - ft / 18000 * 210;
      let s = `<rect x="0" y="${y(18000)}" width="${W}" height="${y(14500) - y(18000) + 0}" fill="rgba(197,140,255,.12)"/>` + T(W - 8, y(18000) + 14, 'Class A：18,000 ft MSL 以上（IFR のみ）', { c: C.vi, fs: 11, a: 'end' });
      s += `<path d="M150 ${y(10000)} L370 ${y(10000)} L370 ${y(6000)} L420 ${y(6000)} L420 ${y(3000)} L330 ${y(3000)} L330 230 L190 230 L190 ${y(3000)} L100 ${y(3000)} L100 ${y(6000)} L150 ${y(6000)} Z" fill="rgba(61,139,255,.18)" stroke="${C.bl}"/>` + T(260, y(8500), 'Class B（大空港・逆ウエディングケーキ形）', { c: C.bl, fs: 11 });
      s += `<path d="M20 ${y(4000)} L70 ${y(4000)} L70 230 L46 230 L46 ${y(1200)} L20 ${y(1200)} Z" fill="rgba(255,90,79,.0)" stroke="${C.rd}"/>`;
      s += `<path d="M440 ${y(4000)} L510 ${y(4000)} L510 ${y(1200)} L490 ${y(1200)} L490 230 L460 230 L460 ${y(1200)} L440 ${y(1200)} Z" fill="rgba(255,90,79,.15)" stroke="${C.rd}"/>` + T(475, y(4600), 'Class C', { c: C.rd, fs: 11, b: 1 }) + T(475, y(5600), '5 NM / 10 NM', { c: C.mut, fs: 10 });
      s += `<rect x="20" y="${y(2500)}" width="40" height="${230 - y(2500)}" fill="rgba(95,212,255,.18)" stroke="${C.cy}" stroke-dasharray="4 3"/>` + T(40, y(3100), 'Class D', { c: C.cy, fs: 11, b: 1 });
      s += T(260, y(14000), 'Class E（管制空域。多くは地上 700 / 1,200 ft から上）', { c: C.gr, fs: 11 }) + T(260, 222, 'Class G（非管制空域・地表付近）', { c: C.am, fs: 11 });

      return svg(W, H, s, '図：米国の空域の断面（模式図・高さは代表例）。Class B は許可（cleared into the Class Bravo）が必要、Class C・D は管制との双方向の無線交信の確立が必要（14 CFR 91.129〜91.131、AIM 3-2）');

    xwindTable() {

    stableApproach() {
      return table(['項目', '安定進入の目安（この教材の Archer・フラップ 40°）'], [['進入角', '3°（PAPI 白 2・赤 2）'], ['速度', '70 kt（+10／−5 kt 以内）'], ['降下率', '約 370 fpm（1,000 fpm を超えない）'], ['形態', 'フラップ・チェックリスト完了'], ['コース', 'センターラインの延長上。大きな修正が要らない'], ['判断', '地上 500 ft（VMC の目安）で満たさなければ<b>ゴーアラウンド</b>']]);

    papi() {
      const row = (y, cols, lab) => cols.map((c, i) => `<circle cx="${90 + i * 34}" cy="${y}" r="11" fill="${c ? '#f2f2f2' : '#ff4a3a'}"/>`).join('') + T(250, y + 4, lab, { c: C.ink, fs: 12, a: 'start' });
      const s = row(30, [1, 1, 1, 1], '高すぎる（3.5° 以上）') + row(70, [1, 1, 1, 0], 'やや高い') + row(110, [1, 1, 0, 0], '正しい（3°）') + row(150, [1, 0, 0, 0], 'やや低い') + row(190, [0, 0, 0, 0], '低すぎる（2.5° 以下）');
      return svg(460, 210, s, '図：PAPI（精密進入角指示灯）の見え方。滑走路の左側に 4 つ並ぶ（LAB RWY 36 も同じ）。白が多いと高い、赤が多いと低い（AIM 2-1-2）');

    oeiForces() {
      let s = '<g transform="translate(200 150)"><rect x="-6" y="-80" width="12" height="150" rx="6" fill="#dfe6ee"/><rect x="-150" y="-12" width="300" height="20" rx="6" fill="#dfe6ee"/><rect x="-50" y="56" width="100" height="10" rx="4" fill="#dfe6ee"/>';
      s += `<rect x="-78" y="-40" width="18" height="44" rx="6" fill="#9fb3c8"/><rect x="60" y="-40" width="18" height="44" rx="6" fill="#9fb3c8"/>` + L(-92, -44, -46, -44, C.rd, 4) + T(-69, -52, '停止', { c: C.rd, fs: 11 });
      s += A(69, -44, 69, -110, C.gr, 4) + T(69, -118, '推力（右エンジン）', { c: C.gr, fs: 11 }) + A(-69, -40, -69, 20, C.rd, 3) + T(-110, 34, '風車状態のプロペラの抗力', { c: C.rd, fs: 10 });
      s += `<path d="M 40 -90 A 90 90 0 0 0 -60 -70" stroke="${C.am}" stroke-width="3" fill="none"/>` + A(-50, -78, -64, -66, C.am, 3) + T(-10, -100, '機首は止まった側（左）へ', { c: C.am, fs: 12, b: 1 });
      s += A(0, 70, 30, 70, C.cy, 3) + T(60, 92, 'ラダー（右を踏む）の力', { c: C.cy, fs: 11 });
      s += '</g>';
      return svg(400, 260, s, '図：片発停止（左エンジン停止）の力。生きている右エンジンの推力と止まった左のプロペラの抗力で、機首は左へ回ろうとする。右ラダー（生きている側の足）で止め、生きている側へ 2〜5° バンクすると横滑りが最小になる（Airplane Flying Handbook 第 13 章）');
    },
    vmcFactors() {
      return table(['条件（14 CFR 23 の Vmc 決定条件の考え方）', 'Vmc への影響', '理由'], [
        ['生きているエンジンが最大出力', '高くなる', '非対称推力が最大'], ['止まった側のプロペラが風車状態（フェザーしていない）', '高くなる', '止まった側の抗力が大きい'],
        ['重心が後方（後方限界）', '高くなる', 'ラダーの腕（重心から舵まで）が短くなる'], ['重量が軽い', '高くなる（Vmc の定義上）', 'バンクによる横向きの揚力の助けが小さい'],
        ['脚 UP・フラップ離陸位置', '一般に高くなる', '脚の「竜骨効果」がない（機体による）'], ['バンク 5° まで生きている側へ', '低くなる', '揚力の横成分が非対称推力を助ける'],
        ['密度高度が高い（高い・暑い）', '低くなる', '出力が減る（ただし失速速度に近づく）'], ['臨界発動機の停止', '最も高い', 'P ファクター等で生きている側の推力線が外側（Seminole は左右逆回転なので臨界発動機なし）']])
        + '<p class="bk-src">出典：FAA Airplane Flying Handbook（FAA-H-8083-3C）第 13 章、14 CFR 23.2135（旧 23.149）。数値・条件は機体の AFM が優先。</p>';
    },
    ils() {
      let s = `<rect x="360" y="150" width="120" height="10" fill="#3a4658"/>` + T(420, 176, '滑走路', { c: C.mut, fs: 11 });
      s += L(40, 150 - Math.tan(3 * DEG) * 340, 380, 150, C.gr, 2.5) + T(120, 112, 'グライドスロープ（3°）', { c: C.gr, fs: 11 });

      s += `<circle cx="300" cy="${150 - Math.tan(3 * DEG) * 80}" r="5" fill="${C.am}"/>` + T(300, 112, '決心高度（DA）', { c: C.am, fs: 11 }) + T(300, 126, 'ここで滑走路が見えなければ進入復行', { c: C.am, fs: 10 });

      return svg(500, 190, s, '図：ILS（計器着陸装置）。ローカライザーが左右、グライドスロープが上下のずれを示し、PFD の CDI と菱形（GS）に表示される（AIM 1-1-9）');

    scan() {
      const c = (x, y, lab) => `<rect x="${x - 36}" y="${y - 18}" width="72" height="36" rx="6" fill="rgba(95,212,255,.08)" stroke="${C.cy}"/>` + T(x, y + 4, lab, { c: C.ink, fs: 12, b: 1 });
      let s = c(200, 100, '姿勢') + c(80, 100, '速度') + c(320, 100, '高度') + c(200, 190, '方位') + c(80, 190, '旋回率') + c(320, 190, '昇降率');
      for (const [x, y] of [[80, 100], [320, 100], [200, 190], [80, 190], [320, 190]]) s += L(200 + (x - 200) * 0.25, 100 + (y - 100) * 0.25, 200 + (x - 200) * 0.6, 100 + (y - 100) * 0.6, C.am, 2);
      s += T(200, 40, '放射状クロスチェック（radial scan）：姿勢 → 他の計器 → 姿勢 → …', { c: C.am, fs: 12 });
      return svg(400, 230, s, '図：計器のスキャン。いつも姿勢に戻ってから次の計器へ。G1000 では中央の姿勢表示の周りに速度・高度・昇降率・方位が並ぶ（Instrument Flying Handbook 第 6 章）');
    },
    tem() {
      let s = `<rect x="20" y="30" width="140" height="60" rx="8" fill="rgba(255,178,62,.12)" stroke="${C.am}"/>` + T(90, 56, '脅威（Threat）', { c: C.am, b: 1 }) + T(90, 74, '天気・他機・不具合…', { c: C.mut, fs: 10 });
      s += `<rect x="190" y="30" width="140" height="60" rx="8" fill="rgba(255,106,90,.12)" stroke="${C.rd}"/>` + T(260, 56, 'エラー（Error）', { c: C.rd, b: 1 }) + T(260, 74, '操作・手順・交信の誤り', { c: C.mut, fs: 10 });
      s += `<rect x="360" y="30" width="140" height="60" rx="8" fill="rgba(197,140,255,.12)" stroke="${C.vi}"/>` + T(430, 52, '望ましくない', { c: C.vi, b: 1 }) + T(430, 68, '機体の状態（UAS）', { c: C.vi, b: 1 }) + T(430, 84, '高度・速度の逸脱…', { c: C.mut, fs: 10 });
      s += A(160, 60, 188, 60, C.ink, 2) + A(330, 60, 358, 60, C.ink, 2);
      s += `<rect x="20" y="120" width="480" height="44" rx="8" fill="rgba(95,212,110,.1)" stroke="${C.gr}"/>` + T(260, 147, '管理（Manage）：予測（ブリーフィング）→ 気づく（モニター・クロスチェック）→ 対処（立て直す）', { c: C.gr, fs: 12 });
      return svg(520, 180, s, '図：TEM（Threat and Error Management）の流れ。脅威とエラーを早く見つけて管理し、望ましくない状態（UAS）に進ませない（SKYbrary の TEM の説明を図にしたもの）');
    },
    standardRate() {
      return table(['真対気速度', '標準旋回（3°/秒）のバンク', '目安「速度 ÷ 10 ＋ 7」'], [70, 90, 100, 120, 150].map(v => [`${v} kt`, `${(Math.atan(3 * v / 1091) / DEG).toFixed(0)}°`, `${Math.round(v / 10 + 7)}°`]));
    },
  };

  // ---------------------------------------------------------------- calculators inside the text
  const ARCHER_WB = {
    // teaching approximations (教材用近似・機体ごとに要確認): arms in inches from the datum, the envelope's shape
    rows: [['空虚重量（BEW）', 1640, 87.0], ['前席（操縦士・同乗者）', 340, 80.5], ['後席', 150, 118.1], ['燃料（40 gal × 6 lb）', 240, 95.0], ['手荷物', 50, 142.8]],
    env: [[82.0, 1600], [82.0, 2050], [88.6, 2550], [93.0, 2550], [93.0, 1600]],
    max: 2550,
  };
  const CALC = {
    turn(el) {
      el.innerHTML = '<label>速度 <input type="number" value="100" min="40" max="300"> kt</label> <label>バンク <input type="number" value="30" min="5" max="75"> °</label> <output></output>';
      const [v, b] = el.querySelectorAll('input'), out = el.querySelector('output');
      const f = () => { const V = +v.value, B = +b.value * DEG, tn = Math.tan(B); out.innerHTML = `荷重倍数 <b>${(1 / Math.cos(B)).toFixed(2)} G</b>・旋回率 <b>${(1091 * tn / V).toFixed(1)}°/秒</b>・半径 <b>${Math.round(V * V / (11.26 * tn)).toLocaleString()} ft</b>・失速速度 ×${Math.sqrt(1 / Math.cos(B)).toFixed(2)}`; };
      v.addEventListener('input', f); b.addEventListener('input', f); f();
    },
    da(el) {
      el.innerHTML = '<label>標高・高度 <input type="number" value="55" step="100"> ft</label> <label>気温 <input type="number" value="33"> ℃</label> <label>高度計規正値 <input type="number" value="29.92" step="0.01"> inHg</label> <output></output>';
      const [h, t, q] = el.querySelectorAll('input'), out = el.querySelector('output');
      const f = () => { const pa = +h.value + (29.92 - +q.value) * 1000, isa = 15 - 2 * pa / 1000, da = pa + 120 * (+t.value - isa); out.innerHTML = `気圧高度 <b>${Math.round(pa).toLocaleString()} ft</b>・標準気温 ${isa.toFixed(0)}℃・密度高度 <b>${Math.round(da).toLocaleString()} ft</b>（概算式：気圧高度＋120×（気温−標準気温））`; };
      for (const e of [h, t, q]) e.addEventListener('input', f); f();
    },
    xwind(el) {
      el.innerHTML = '<label>滑走路 <input type="number" value="36" min="1" max="36"> （番号）</label> <label>風向 <input type="number" value="060" step="10"> °</label> <label>風速 <input type="number" value="12"> kt</label> <output></output>';
      const [r, d, s] = el.querySelectorAll('input'), out = el.querySelector('output');
      const f = () => { const a = ((+d.value - +r.value * 10) % 360 + 540) % 360 - 180, x = +s.value * Math.sin(a * DEG), hw = +s.value * Math.cos(a * DEG);
        out.innerHTML = `角度 <b>${Math.abs(Math.round(a))}°</b>・横風 <b>${Math.abs(x).toFixed(0)} kt（${x >= 0 ? '右' : '左'}から）</b>・${hw >= 0 ? '向かい風' : '<span style="color:#ff6a5a">追い風</span>'} <b>${Math.abs(hw).toFixed(0)} kt</b>${Math.abs(x) > 17 ? '　<span style="color:#ff6a5a">Archer の実証横風成分 17 kt を超える</span>' : ''}`; };
      for (const e of [r, d, s]) e.addEventListener('input', f); f();
    },
    wca(el) {
      el.innerHTML = '<label>真航路 <input type="number" value="090"> °</label> <label>真対気速度 <input type="number" value="105"> kt</label> <label>風向 <input type="number" value="030"> °</label> <label>風速 <input type="number" value="15"> kt</label> <output></output>';
      const [c, v, wd, ws] = el.querySelectorAll('input'), out = el.querySelector('output');
      const f = () => { const tc = +c.value * DEG, tas = +v.value, a = (+wd.value) * DEG - tc, w = +ws.value, xw = w * Math.sin(a), wca = Math.asin(clamp(xw / tas, -1, 1)), gs = tas * Math.cos(wca) - w * Math.cos(a);
        out.innerHTML = `偏流修正角 <b>${xw >= 0 ? '右' : '左'}へ ${Math.abs(wca / DEG).toFixed(0)}°</b>・真針路 <b>${String(Math.round((((tc + wca) / DEG) % 360 + 360) % 360)).padStart(3, '0')}°</b>・対地速度 <b>${Math.round(gs)} kt</b>`; };
      for (const e of [c, v, wd, ws]) e.addEventListener('input', f); f();
    },
    wb(el) {
      const R = ARCHER_WB.rows;

      for (const e of [d, g, b, r]) e.addEventListener('input', f); f();
    },
    rule60(el) {
      el.innerHTML = '<label>飛んだ距離 <input type="number" value="20"> NM</label> <label>航路から外れた距離 <input type="number" value="2" step="0.1"> NM</label> <label>残りの距離 <input type="number" value="40"> NM</label> <output></output>';
      const [a, b, c] = el.querySelectorAll('input'), out = el.querySelector('output');
      const f = () => { const off = 60 * +b.value / +a.value, close = 60 * +b.value / +c.value; out.innerHTML = `外れた角度 <b>${off.toFixed(0)}°</b>・目的地へ向けるには <b>${(off + close).toFixed(0)}°</b> 修正（平行に戻すだけなら ${off.toFixed(0)}°）`; };
      for (const e of [a, b, c]) e.addEventListener('input', f); f();
    },
  };
  FL.bookFigs = FIG;
  FL.bookCalc = Object.assign(CALC, { ARCHER_WB });

<p>米国では FAA（連邦航空局）が資格を出します。規則は <b>14 CFR</b>（連邦規則集 第 14 編）で、操縦士の資格は Part 61、飛び方の規則は Part 91 にあります。</p>
${bk.t(['資格・限定', 'できること（要点）', '主な規則'], [
  ['Student Pilot Certificate（学生操縦士）', '教官の承認（logbook endorsement）の範囲で単独飛行。乗客は乗せられない。昼は視程 3 SM、夜は 5 SM 未満では飛べない など', '61.83〜61.95、61.89'],
  ['Private Pilot（自家用）', '報酬を受けずに操縦。乗客を乗せられる', '61.102〜61.117'],
  ['Instrument Rating（計器飛行証明）', '計器飛行方式（IFR）で、雲の中など外が見えない条件で飛べる', '61.65'],
  ['Commercial Pilot（事業用）', '報酬を受けて操縦できる', '61.121〜61.133'],
  ['Multi-engine（多発限定）', 'エンジンが 2 つ以上の飛行機', '61.63 等'],
  ['ATP（定期運送用）', 'エアラインの機長などに必要な最上位の資格', '61.151〜']])}
<p>それぞれに<b>学科試験</b>と<b>実地試験</b>（口述＋飛行）があり、実地試験の基準は <b>ACS（Airman Certification Standards）</b>として公開されています。この教材の「基礎」レベルの許容幅は、自家用の ACS（FAA-S-ACS-6C）を参考にしています。</p>
${bk.key('資格（certificate）と身体検査証明（medical certificate）の両方が有効でないと飛べない', '学科で「なぜ」を理解し、飛行で「どうやるか」を体に覚えさせる。この教科書は前者、シミュレータは後者の練習台')}
${bk.src('14 CFR Part 61', 'FAA Airman Certification Standards')}` },
      { id: 'intro.study', t: 'この教材での学び方', h: () => `
<ol><li><b>読む</b>：教科書の節を読み、「考えてみよう」で自分の言葉で説明できるか確かめる。</li>
<li><b>答える</b>：章末の確認問題と学科テスト（80% で合格）。間違えた問題は解説を読み直す。</li>
<li><b>飛ぶ</b>：課程表の課目を「導入 → 基礎 → 精度」の順に。左上の教官パネルの「指示・使うキー・目安」を読み、右上の操作の状態で自分の操作を確かめる。</li>
<li><b>振り返る</b>：講評の × の項目と「次に意識すること」を読み、メモを書く（学習記録。正式な飛行日誌ではない）。</li></ol>
<p>シミュレータの練習は、実機の訓練の<b>予習・復習</b>のためのものです。手順を声に出して言う、目標値を先に決める、計器の見方を体に覚えさせる――この 3 つに使うのが効果的です。</p>
${bk.sim('最初の課目「姿勢・出力・トリム」で、操作とトリムに慣れましょう。', ['a1', '姿勢・出力・トリム'])}` },
    ],
    terms: [['Cadet pilot', '自社養成パイロット訓練生', ''], ['Ground school', '座学', 'ロンドンで英語'], ['Lesson / Sortie', 'レッスン・1 回の飛行', ''], ['Check flight / Stage check', '審査飛行', ''], ['First solo', '初単独飛行', ''], ['Endorsement', '教官の承認（ログブックへの記載）', ''], ['ACS', '実地試験基準', 'Airman Certification Standards'], ['POH / AFM', '飛行規程', 'Pilot\'s Operating Handbook / Airplane Flight Manual'], ['SOP', '標準運航手順', 'Standard Operating Procedures']],
    examples: ['今週の計画：{ch:aero}を読む → 課目「直線水平飛行」を導入で 3 回 → 講評を見て「高度が下がりがち＝トリム不足」とメモ。', '公開情報の「レッスン 12 回」は事実、「各レッスンの内容」は公開されていないので推測しない。'],
    cautions: ['本アプリは ANA や訓練校の公式教材ではない。実機訓練・教官の指示・POH/AFM・SOP・航空法規を優先する。', 'アプリの課目に合格しても、ソロや資格の可否とは関係しない。'],
    quiz: [
      { q: '公開情報で、フライト訓練の最初に使うとされている機体は？', choices: ['Piper Archer', 'Piper Seminole', 'Boeing 777', 'Cirrus SR20'], answer: 0, why: '公開情報では単発機 Piper Archer で始め、その後双発機 Piper Seminole に進む。' },
      { q: 'この教材の速度・許容幅の扱いとして正しいものは？', choices: ['ANA の審査基準そのもの', '訓練校の SOP の値', '公開資料を参考にした教材の値（実機・審査は POH・教官・公式基準が優先）', 'すべての Archer に共通の正式な値'], answer: 2, why: '審査基準や SOP は公開されていない。参考にした値も機体ごとに要確認で、実際は POH・教官・公式の基準が優先。' },
      { q: '学生操縦士（Student Pilot）が単独で飛べないのはどれ？（14 CFR 61.89）', choices: ['昼間・視程 5 SM', '乗客を乗せる', '教官の承認の範囲での単独飛行', '訓練空域での練習'], answer: 1, why: '61.89(a)：学生操縦士は乗客を乗せて機長として飛べない。昼は視程 3 SM 未満・夜は 5 SM 未満でも飛べない。' },
    ],

  // ======================================================================= 2
  B.add({ id: 'aero', part: 'p1', t: '飛行の原理', en: 'Principles of flight (aerodynamics)',
    summary: '4 つの力、揚力と迎え角、抗力、失速とスピン、旋回と荷重倍数、安定性、プロペラの左偏向、地面効果とフラップ、速度の制限。',
    secs: [
      { id: 'aero.forces', t: '飛行機に働く 4 つの力', h: () => `
<p>空を飛んでいる飛行機には、いつも次の 4 つの力が働いています。</p>${FIG.forces()}
<ul><li><b>重力（Weight）</b>：地球が機体を下へ引く力。機体・燃料・人・荷物の重さの合計。</li><li><b>揚力（Lift）</b>：翼が空気を押し下げることで生まれる、機体を持ち上げる力。</li>
<li><b>推力（Thrust）</b>：プロペラが機体を前へ引く力。</li><li><b>抗力（Drag）</b>：空気の抵抗。前進を邪魔する力。</li></ul>
<p>高度も速度も変わらない<b>水平直線飛行</b>では、揚力＝重力、推力＝抗力で<b>つり合って</b>います。つり合いが崩れると、崩れた方向へ機体が加速します。パワーを上げて推力＞抗力にすると速度が増え、速度が増えると揚力も増えるので、何もしないと機体は上昇を始めます。</p>
${bk.key('つり合っている＝「止まっている」ではなく「一定の速度・一定の方向で動き続けている」', '上昇中も、速度と上昇率が一定なら力はつり合っている（推力の一部が重力の一部を支えている）')}
${bk.q('水平飛行中、高度を変えずに速度だけを上げたい。操作は？', 'パワーを上げる（推力＞抗力で加速）。同時に、速度が増えて揚力が増える分だけ<b>機首を少し下げて</b>迎え角を減らし、揚力を重力と同じに保つ。最後にトリムを取り直す。')}
${bk.sim('トリムと姿勢・出力の関係を体験します。', ['a1', '姿勢・出力・トリム'])}` },
      { id: 'aero.lift', t: '揚力はどうやって生まれるか', h: () => `
<p>翼は、前から来る空気を<b>下向きに曲げて</b>送り出す形と角度になっています。空気を下へ押せば、その反作用で翼は上へ押されます（ニュートンの第 3 法則）。このとき翼の上面では空気が速く流れて圧力が下がり、下面では圧力が上がります（ベルヌーイの定理）。2 つの説明は矛盾せず、同じ現象を別の角度から見たものです。</p>
${bk.f('L ＝ ½ × ρ × V² × S × C<sub>L</sub>')}
${bk.t(['記号', '意味', '操縦士が変えられるか'], [['ρ（ロー）', '空気の密度。高い所・暑い日・湿った日ほど小さい', '×（場所と天気で決まる）'], ['V', '対気速度（空気に対する速さ）', '○ パワーと姿勢'], ['S', '翼の面積', '△ フラップで少し増える'], ['C<sub>L</sub>', '揚力係数。主に<b>迎え角</b>で決まる', '○ 操縦桿（エレベーター）']])}
<p>V は<b>2 乗</b>で効きます。速度が 2 倍なら揚力は 4 倍。遅く飛ぶときは大きな迎え角やフラップが必要になります。</p>
${bk.q('この教材の Archer（重さ 1,050 kg、翼面積 15.8 m²）が海面上を 100 kt（51.4 m/s）で水平飛行している。必要な C<sub>L</sub> は？', '揚力＝重力＝1,050 × 9.81 ≒ 10,300 N。½ρV²S ＝ 0.5 × 1.225 × 51.4² × 15.8 ≒ 25,600。C<sub>L</sub> ≒ 10,300 ÷ 25,600 ≒ <b>0.40</b>。70 kt なら約 0.82 と約 2 倍必要（速度の 2 乗に反比例）。')}` },
      { id: 'aero.aoa', t: '迎え角と揚力係数', h: () => `
<p><b>迎え角（AOA：Angle of Attack）</b>は、翼弦線と<b>相対風</b>（翼に当たる空気の流れ）との角度です。</p>${FIG.aoa()}
<p>よく誤解されるのが「迎え角＝機首の上げ下げ（ピッチ角）」という思い込みです。<b>ピッチ角は地平線に対する角度、迎え角は空気の流れに対する角度</b>で、別物です。降下中は機首が水平線より下でも、迎え角はプラスで揚力を出しています。</p>${FIG.liftCurve()}
<p>揚力係数は迎え角にほぼ比例して増えますが、ある角度（<b>臨界迎え角</b>、一般的な軽飛行機で約 15〜18°）を超えると、翼の上面から空気の流れがはがれて揚力が急に減ります。これが<b>失速</b>です。</p>
${bk.key('操縦桿を引く＝迎え角を増やす。押す＝迎え角を減らす', '失速は「速度」ではなく「迎え角」で起きる。どんな速度・姿勢でも臨界迎え角を超えれば失速する（FAA も強調している点）', 'フラップを下げると同じ迎え角で揚力が増える。臨界迎え角は少し小さくなる')}` },
      { id: 'aero.drag', t: '抗力・揚抗比・最良滑空速度', h: () => `
<ul><li><b>有害抗力（parasite drag）</b>：機体の形・摩擦・脚やアンテナ。<b>速度の 2 乗に比例して増える</b>。</li>
<li><b>誘導抗力（induced drag）</b>：揚力を作ることの副作用（翼端渦）。<b>遅いほど（迎え角が大きいほど）大きい</b>。</li></ul>${FIG.dragCurve()}
<p>2 つを足した全抗力はある速度で最小になり、<b>揚力と抗力の比（L/D）</b>が最大になります。エンジンが止まったときに最も遠くまで滑空できる速度が<b>最良滑空速度</b>で、Archer のチェックリストでは <b>${AR.glide} KIAS</b>（最大重量の値。降りる場所が決まったら 66 KIAS）。</p>
${bk.key('最良滑空速度より遅くても速くても、滑空距離は短くなる。「遠くへ行きたいから機首を上げる」は逆効果', '向かい風では少し速く、追い風では少し遅く飛ぶと、地面に対して遠くまで行ける（教官・POH の指示に従う）')}
${bk.sim('エンジン故障から滑走路へ、最良滑空速度を保って滑空します。', ['e3', '上空でのエンジン故障'])}` },
      { id: 'aero.stall', t: '失速とスピン', h: () => `
<p>失速は<b>臨界迎え角を超えたとき</b>に起きます。兆候：失速警報（ホーン）、操縦桿の手ごたえが軽くなる、機体の振動（バフェット）、機首や片翼が落ちる。</p>
<h4>失速からの回復（基本・FAA の考え方）</h4>
<ol><li><b>操縦桿を前へ</b>：迎え角を減らす（最優先。これをしない限り回復しない）</li><li><b>翼を水平に</b></li><li><b>パワーを最大に</b>（機体の手順に従う）</li><li>速度が回復したら、ゆるやかに上昇へ（急に引くと<b>二次失速</b>）</li></ol>
${bk.t(['条件', '失速速度（指示対気速度）'], [['重量が重い', '上がる'], ['旋回・引き起こし（荷重倍数が大きい）', '上がる（√荷重倍数 倍）'], ['フラップを下げる', '下がる'], ['重心が前', '上がる（尾翼の下向きの力が増える）'], ['翼に霜・氷・汚れ', '大きく上がる（離陸前に必ず除去）']])}
<h4>スピン</h4>
<p>失速した状態で<b>横滑り</b>があると、片方の翼だけが深く失速して回転しながら落ちる＝<b>スピン</b>。典型はファイナルへの旋回でオーバーシュートしそうになり、ラダーで機首を回しながら引くケース。Archer のチェックリストの回復手順：<b>スロットル アイドル → 操縦輪をいっぱいに前 → エルロン中立 → ラダーを回転と反対へいっぱい → 回転が止まったらラダー中立 → なめらかに水平飛行の姿勢へ</b>（機体の POH が優先）。</p>
${bk.key('失速＝迎え角の問題。回復の第一歩は必ず「前へ」', 'スピンは「失速＋横滑り」。低高度の旋回ではボールを中央に、速度を十分に')}
${bk.sim('着陸形態の失速と離陸形態の失速を体験し、回復で失う高度を採点します。', ['a7', 'パワーオフ失速'], ['a8', 'パワーオン失速'])}` },
      { id: 'aero.turn', t: '旋回の物理と荷重倍数', h: () => `
<p>飛行機は<b>機体を傾けて（バンク）揚力を横へ傾け</b>、その横向きの成分で曲がります。揚力の一部が横向きに使われるので、高度を保つには<b>揚力を増やす（少し引く）</b>必要があります。</p>
${bk.f('荷重倍数 n ＝ 1 ÷ cos（バンク角）　　旋回中の失速速度 ＝ 通常の失速速度 × √n')}${FIG.turnTable()}
${bk.f('旋回率（°/秒）≒ 1,091 × tan（バンク）÷ 速度（kt）　　旋回半径（ft）≒ 速度² ÷（11.26 × tan（バンク））')}
<p>計器飛行の基本の<b>標準旋回（毎秒 3°、2 分で 360°）</b>に必要なバンクは、おおよそ「<b>速度（kt）÷ 10 ＋ 7</b>」度です。</p>${bk.calc('turn')}
<ul><li>バンクを入れると同時に、<b>エルロンと同じ側のラダー</b>を少し踏む（逆ヨーの打ち消し）。ボールを中央に＝<b>釣り合い旋回（coordinated turn）</b></li>
<li>深いバンクでは機体がさらに傾こうとする（<b>オーバーバンキング傾向</b>）。少し反対側にエルロンを当てる</li><li>ロールアウトは目標の針路の手前（バンク角の半分くらい）から始める</li></ul>
${bk.sim('中程度の旋回（30°）と急旋回（45°）で、高度とバンクの維持を練習します。', ['a4', '中程度の旋回'], ['a5', '急旋回'])}` },
      { id: 'aero.stab', t: '安定性（縦・横・方向）', h: () => `${FIG.stability()}
<p><b>静安定</b>は、ずれたときに元に戻ろうとする力が働くか。<b>動安定</b>は、戻る途中の揺れが時間とともに小さくなるか、です。</p>
${bk.t(['軸', '動き', '主な操縦翼面', '安定を生むもの'], [['縦軸まわり（ロール）', '傾く', 'エルロン', '上反角（低翼の Archer は翼が V 字）'], ['横軸まわり（ピッチ）', '機首の上下', 'スタビレーター（Archer は水平尾翼全体が動く）', '重心が揚力の中心より前＋水平尾翼'], ['垂直軸まわり（ヨー）', '機首の左右', 'ラダー', '垂直尾翼（風見鶏と同じ）']])}
<p>一般的な飛行機は<b>重心が主翼の揚力の中心より前</b>にあり、機首が下がろうとするのを水平尾翼が下向きの力で支えています。この「速度を一定に保とうとする性質」があるので、<b>トリムを取った速度</b>で飛び続けます。重心が後ろすぎると安定が失われ、失速やスピンから回復できなくなることがあります（{ch:perf}の重量重心）。</p>
${bk.key('重心位置は安定性そのもの。重量重心の計算は安全のため', '「トリムを取れば手を離しても飛ぶ」のは縦の静安定のおかげ', 'スパイラル不安定：バンクが少しずつ深くなり螺旋を描いて降りていく。雲の中で姿勢がわからなくなると陥る（第 4 部）')}` },
      { id: 'aero.left', t: '左偏向傾向と逆ヨー（右ラダーが必要な理由）', h: () => `
<p>操縦席から見て時計回りにプロペラが回る単発機（Archer など）は、<b>高出力・低速・大迎え角</b>のとき機首が左へ向こうとします。原因は 4 つ（PHAK）：</p>
<ol><li><b>後流（スパイラルスリップストリーム）</b>：プロペラの空気がらせん状に機体を回り、垂直尾翼の左側に当たって機首を左へ押す</li><li><b>P ファクター</b>：機首上げでは右側の下がるブレードの推力が大きく、機首が左へ</li>
<li><b>トルク</b>：プロペラを回す反作用で機体が左へ傾こうとする</li><li><b>ジャイロ効果（歳差）</b>：回転するプロペラの向きを変えると 90° 先に力が現れる</li></ol>${FIG.leftTurning()}
<p>機体は巡航で打ち消されるように作られているので、<b>巡航ではほぼ打ち消され、離陸・上昇では右ラダー、アイドルで降下中はわずかに左ラダー</b>が必要になります。<b>逆ヨー</b>：右エルロンを使うと、上がる左翼の抗力が増えて機首が一瞬左を向く。バンクを入れるときはエルロンと同じ側のラダーを一緒に踏みます。</p>
${bk.key('上昇中にボールが右に寄っていたら「ボールを踏む」＝右ラダー（E）', 'このシミュレータはこれらの効果を計算している。自動ラダー（U）を OFF にすると、離陸・上昇で右ラダーが必要になる', '双発の Seminole は左右のプロペラが逆に回るので、これらの効果が打ち消し合う（第 5 部）')}
${bk.sim('自動ラダーを OFF にして離陸すると、右ラダーの必要性がわかります。', ['t1', '通常離陸と上昇'])}` },
      { id: 'aero.ge', t: '地面効果とフラップ', h: () => `
<p>翼が地面に近づく（おおむね<b>翼幅より低い</b>高さ）と、地面が翼端渦と吹き下ろしを邪魔するので、<b>誘導抗力が減り、揚力が少し増えます</b>（地面効果）。</p>
<ul><li>着陸：フレアで思ったより沈まず、長く浮いて滑走路を使い過ぎる（フロート）。速すぎる進入の典型的な結果。低翼の Archer は特に地面効果が強い</li>
<li>離陸：地面効果の中では浮けても、離れると抗力が増えて沈むことがある。十分な速度になるまで無理に上昇しない</li></ul>
${bk.t(['Archer のフラップ', '効果', '主な使い道（チェックリスト）'], [['10°', '揚力が増え、抗力の増加は小さい', '場周経路のアビーム'], ['25°', '揚力も抗力も増える', '短距離・軟弱地離陸、ベース、ゴーアラウンド時の位置'], ['40°', '抗力が大きく増える（降下角を深くできる）', '着陸']])}
${bk.key(`フラップは白い帯（Vfe ${AR.fe} KIAS）以下でだけ使う`, 'ゴーアラウンドではフラップを一度に全部上げない（チェックリスト：まず 25° へ、障害物を越えてからゆっくり上げる）')}
${bk.sim('短距離着陸で、フラップ 40° の進入とフレアでの浮きを体験します。', ['x2', '短距離着陸'])}` },
      { id: 'aero.vn', t: '速度の制限と V-n 線図', h: () => `<p>機体の強さには限界があり、<b>速度</b>と<b>荷重倍数（G）</b>の組み合わせで飛んでよい範囲が決まっています。</p>${FIG.vn()}
${bk.t(['記号', '名前', 'この教材の Archer の値（出典）'], [['Vso / Vs1', '失速速度（着陸形態 / 通常）', `${AR.s0} / ${AR.s1} kt（教材値・POH で確認）`], ['Vfe', 'フラップ下げ最大速度（白い帯の上端）', `${AR.fe} KIAS（チェックリスト）`], ['Va', '設計運動速度（乱気流ではこれ以下）', `${AR.va} KIAS（2,550 lb）・89 KIAS（1,917 lb）（チェックリスト）`], ['Vno', '最大構造巡航速度（緑の帯の上端）', `${AR.no} kt（教材値）`], ['Vne', '超過禁止速度（赤線）', `${AR.ne} kt（教材値）`]])}
${bk.key('乱気流の中では Va 以下に減速する。Va は重量が軽いほど小さい', '速度計の色：白＝フラップ範囲、緑＝通常、黄＝穏やかな空気のみ、赤線＝超過禁止')}` },
    ],
    terms: [['Lift / Weight / Thrust / Drag', '揚力・重力・推力・抗力', ''], ['Angle of attack (AOA)', '迎え角', ''], ['Critical angle of attack', '臨界迎え角', ''], ['Stall', '失速', ''], ['Spin', 'スピン', ''], ['Load factor', '荷重倍数', 'G'], ['Coordinated turn', '釣り合い旋回', 'ボールが中央'], ['Adverse yaw', '逆ヨー', ''], ['Left-turning tendencies', '左偏向傾向', 'P-factor, torque, slipstream, gyroscopic'], ['Ground effect', '地面効果', ''], ['Best glide speed', '最良滑空速度', ''], ['Maneuvering speed (Va)', '設計運動速度', '']],
    examples: ['30° バンクで高度を保つには、荷重 1.15 G 分だけ揚力を増やす＝少し引いてパワーを少し足す。', '着陸進入が速すぎると、地面効果でフロートして接地点が先へ延びる。', '離陸滑走で機首が左に振られる → 右ラダー（E）で押さえる。'],
    cautions: ['失速は速度ではなく迎え角で起きる。速度計だけを見て「速いから安全」と思わない。', '低高度の旋回でラダーを使って無理に機首を回さない（スピンの典型）。', '数値は教材モデルとチェックリストの参考値。実機は POH が優先。'],

      { q: 'バンク 60° で高度を保って旋回するときの荷重倍数は？', choices: ['1.15 G', '1.41 G', '2.0 G', '3.8 G'], answer: 2, why: 'n＝1÷cos60°＝2。失速速度は √2 ≒ 1.41 倍になる。' },
      { q: '離陸・上昇（高出力・低速）で単発プロペラ機に必要なラダーは？', choices: ['左ラダー', '右ラダー', 'ラダーは不要', '交互に踏む'], answer: 1, why: '左偏向傾向（後流・P ファクター等）で機首が左へ向くので、右ラダーで打ち消す。' },

  B.add({ id: 'sys', part: 'p1', t: '機体と装備（Archer と G1000）', en: 'Aircraft systems: the Piper Archer and the G1000',
    summary: '操縦翼面とトリム、エンジン（点火・燃料・ミクスチャー・キャブレターアイス）、燃料系統、電気系統、ピトー静圧・AHRS と G1000、予備計器とコンパス。',
    secs: [
      { id: 'sys.ctl', t: '機体の構造・操縦翼面・トリム', h: () => `
<p>Piper Archer は<b>低翼・4 座・単発</b>の練習機です。水平尾翼は全体が動く<b>スタビレーター（stabilator）</b>で、後ろの小さな<b>アンチサーボタブ</b>が動きを重くして過敏さを抑え、トリムタブも兼ねています。</p>
${bk.t(['操縦装置', '動く翼面', '機体の動き', 'このシミュレータのキー'], [['操縦輪を左右', 'エルロン（主翼の外側後ろ）', 'ロール（傾く）', 'A / D'], ['操縦輪を前後', 'スタビレーター', 'ピッチ（機首上下）', 'W / S'], ['ラダーペダル', 'ラダー（垂直尾翼の後ろ）・前輪の操向', 'ヨー（機首左右）', 'Q / E'], ['トリムホイール', 'スタビレーターのタブ', '操縦の力を消す', 'T']])}
<p><b>トリム</b>は、操縦桿に力を加えなくてもその姿勢・速度を保てるようにする装置です。「姿勢を決める → パワーを決める → 落ち着いたらトリムで力を消す」が基本の順番。トリムで機体を操縦しようとしないこと。</p>
${bk.key('操縦桿の力が残っている＝トリムがずれている', '「姿勢＋パワー＝性能」。トリムはその状態を楽に保つ道具')}
${bk.sim('T キーでトリムを取り、手を離しても水平飛行が続く状態を作ります。', ['a1', '姿勢・出力・トリム'])}` },
      { id: 'sys.engine', t: 'エンジン・点火・ミクスチャー・キャブレターアイス', h: () => `
<p>Archer のエンジンは一般に <b>Lycoming O-360（180 hp）</b>の空冷水平対向 4 気筒です（燃料噴射式の機体もある。訓練校のチェックリストには両方の始動手順が載っている版もある＝<b>機体ごとに要確認</b>）。プロペラは<b>固定ピッチ</b>で、回転計（RPM）がそのまま出力の目安になります。</p>
<h4>マグネトー（点火）</h4>
<ul><li>点火はエンジンの回転で発電するマグネトーで行う。電気系統が止まってもエンジンは止まらない。2 系統・各シリンダーにプラグ 2 本</li>
<li>離陸前の<b>マグチェック</b>（公開チェックリストの例：2,000 rpm で、落ち幅 最大 175 rpm・左右差 最大 50 rpm）</li></ul>
<h4>ミクスチャー（混合比）</h4>
<p>高度が上がると空気が薄くなるのに燃料の量は同じなので、混合気が<b>濃すぎ</b>になります。ミクスチャーで燃料を絞る（<b>リーン</b>）と出力・燃費が戻ります。離着陸は通常フルリッチ（チェックリスト：5,000 ft 未満は FULL RICH）。いっぱいに引く（IDLE CUT-OFF）とエンジンが止まります＝停止の操作。<span class="tag unk">このシミュレータでは未実装</span></p>
<h4>キャブレターアイス</h4>
<p>キャブレター内では燃料の気化と空気の膨張で温度が大きく下がり、晴れていても氷ができて空気の通り道をふさぎます（湿度が高いと起きやすい）。兆候は<b>回転がじわじわ落ちる・エンジンの荒れ</b>。対処は<b>キャブレターヒート ON</b>（一時的にさらに荒れてから回復）。公開チェックリストの「エンジンの荒れ」の最初の項目もキャブヒート ON です。<span class="tag unk">このシミュレータでは未実装</span></p>
${bk.key('油圧は最重要。始動後すぐに上がらない・飛行中に下がる → 着陸を考える（チェックリスト：油圧の喪失は「なるべく早く着陸」＋エンジン停止に備える）', '回転が理由なく下がったら、まずキャブレターアイスを疑う')}` },
      { id: 'sys.fuel', t: '燃料系統（左右のタンクとセレクター）', h: () => `
<p>Archer は<b>左右の主翼にタンク</b>があり、燃料セレクターで <b>LEFT / RIGHT / OFF</b> を選びます（高翼のセスナにある BOTH の位置はない）。低翼なので重力では送れず、エンジン駆動の燃料ポンプと<b>電動燃料ポンプ（補助）</b>で送ります。</p>
<ul><li><b>タンクの切り替え</b>：左右の量の差が大きくならないよう、時間を決めて切り替える。切り替えるときは電動ポンプ ON（チェックリストの例）</li>
<li>離陸・着陸前：<b>燃料の多い側</b>、電動ポンプ ON（Before Takeoff / Before Landing）</li>
<li>飛行前：各タンクとストレーナーから<b>サンプリング</b>（水・ごみ・燃料の種類）。100LL の航空ガソリンは青い</li>
<li>残量は燃料計だけを信じない：<b>目視</b>＋<b>飛行時間×消費率</b>の計算</li></ul>
${bk.key('エンジンが止まったら、まずタンクを切り替える（チェックリストの再始動手順：76 KIAS・タンク切替・電動ポンプ ON・ミクスチャー RICH・キャブヒート ON・マグを確認）', '燃料切れは「計画と確認の失敗」。VFR では昼 30 分・夜 45 分の予備が規則（14 CFR 91.151）')}
${bk.sim('MFD の燃料表示（左右の量）を見ながら飛んでみましょう。', ['a2', '直線水平飛行'])}` },
      { id: 'sys.elec', t: '電気系統と G1000', h: () => `
<ul><li><b>オルタネーター</b>：エンジンで回る発電機。飛行中の電力をまかない、バッテリーを充電する</li><li><b>バッテリー</b>：始動と、発電機が止まったときの非常用電源（時間は限られる）</li>
<li><b>BATT MASTR / ALTR スイッチ</b>：電気系統の入切。<b>エンジン（マグネトー）とは別</b></li><li><b>EMERG BATT</b>：G1000 機の予備計器などのための非常用バッテリー（チェックリストの始動前点検で ARM）</li>
<li><b>サーキットブレーカー</b>：過電流で飛び出す。再び飛んだら戻さない（火災のおそれ）</li></ul>
<p>G1000 は電気で動くので、<b>電源の喪失＝表示の喪失</b>につながります。公開チェックリストの「ALT 灯点灯」：電流計を確認 → ALT スイッチ OFF → 負荷を最小に → サーキットブレーカーを確認・リセット → ALT ON。戻らなければ負荷を減らし「なるべく早く着陸」。</p>
${bk.key('発電機が止まったら、不要な電気を切ってバッテリーを節約し、早めに着陸を計画する', '電気系統の煙・火災（チェックリスト）：EMERG BATT ARM 確認 → マスター OFF → ALT OFF → 換気 → 消火 → なるべく早く着陸')}` },
      { id: 'sys.g1000', t: 'ピトー静圧・AHRS・ADC と G1000 の表示', h: () => `
<p>速度・高度・昇降率は空気の圧力から、姿勢と方位は傾きを感じるセンサーから求めます。G1000 では次の装置が計算し、PFD に表示します。</p>
${bk.t(['装置', '入力', '出すもの'], [['ピトー管（全圧）・静圧孔（静圧）', '空気の圧力', '—'], ['ADC（エアデータコンピュータ）', 'ピトー圧・静圧・外気温', '速度（IAS・TAS）、高度、昇降率、外気温'], ['AHRS（姿勢方位基準装置）', '加速度・角速度・磁気センサー', '姿勢（ピッチ・バンク）、方位、旋回率'], ['GPS', '衛星の電波', '位置・対地速度・航跡（GS・TRK）']])}
<h4>速度の種類</h4>
<ul><li><b>IAS（指示対気速度）</b>：速度計の値。失速速度など操縦の基準は IAS</li><li><b>TAS（真対気速度）</b>：空気に対する本当の速さ。高いところでは IAS より大きい（1,000 ft ごとに約 2%）</li><li><b>GS（対地速度）</b>：地面に対する速さ＝TAS に風を足し引き</li></ul>
<h4>詰まったときの症状（ピトー静圧系統）</h4>
${bk.t(['故障', '速度計', '高度計・昇降計'], [['ピトー管と排水穴の両方が詰まる', '高度計のように動く（上昇で速度が増えて見える）', '正常'], ['静圧孔が詰まる', '上昇で遅く、降下で速く表示', '高度計は止まる、昇降計は 0']])}
<p>静圧孔が詰まったら<b>代替静圧（Alternate Static）</b>に切り替える。着氷による詰まりはピトーヒーターで防ぐ（飛行前に温まることを確認）。</p>
${bk.key('高度計は「高い所から低い所へ飛ぶと、実際より高く表示される」（気圧・気温とも）。<b>High to low, look out below</b>', 'AHRS が壊れると PFD の姿勢・方位に赤い ×。予備計器と GPS の航跡で飛ぶ（第 4 部・課目「部分パネル」）')}
${bk.sim('G1000 型 PFD の各部を 1 つずつ説明するチュートリアル。', ['i3', '部分パネル（AHRS 故障）'])}
<p>${bk.see('ifr.instr', '計器の故障と部分パネル（第 4 部）')}</p>` },
      { id: 'sys.compass', t: '磁気コンパスと予備計器', h: () => `
<ul><li><b>偏差（Variation）</b>：真北と磁北の違い。フロリダ中部では磁北が真北より約 6〜7° 西（西偏、年とともに変わる＝最新の値はチャートや NOAA で確認）。この教材の LAB 空域は「6°W」の教材用近似</li>
<li><b>自差（Deviation）</b>：機体の金属・電気の影響。コンパスのそばの<b>自差カード</b>で補正</li>
<li><b>北旋誤差</b>（北半球）：北向きから旋回すると最初は逆に振れて遅れ、南向きからは先回りする。北へは手前でロールアウト（UNOS：Undershoot North, Overshoot South）</li>
<li><b>加速誤差</b>（北半球）：東・西向きで加速すると北へ、減速すると南へ振れる（ANDS：Accelerate North, Decelerate South）</li></ul>
<p>G1000 の機体には、主の表示が使えないときのための<b>予備計器</b>（姿勢・速度・高度）があります。公開チェックリストの始動前点検にも「Standby Instruments and PFD operate — VERIFY」があります。</p>
${bk.key('磁気コンパスは「直線・水平・定速」のときだけ正しく読める', '計器が怪しいときは、他の計器と比べて「どれが仲間はずれか」を探す')}` },
      { id: 'sys.gear', t: '降着装置・ブレーキ・灯火', h: () => `
<ul><li><b>前輪式（三輪式）</b>：地上で安定し、前が見やすい。前輪はラダーペダルと連動して向きが変わる（Archer は固定脚＝格納しない）</li>
<li><b>引込脚</b>（Seminole）：抗力が減るが、<b>脚の下げ忘れ</b>に注意。着陸前チェックリスト（GUMPS）で「緑 3 つ」を確認</li>
<li><b>ブレーキ</b>：ペダル上部（トーブレーキ）。左右別々に効く。着陸滑走では機首を下ろしてから</li></ul>
<p>灯火：航空灯（左翼端＝赤、右翼端＝緑、尾部＝白）、衝突防止灯（ストロボ・ビーコン）、着陸灯。<b>正面から来る機体の赤と緑の位置</b>で相手の向きがわかる（赤が右に見えたら相手はこちらを向いている）。</p>` },
    ],
    terms: [['Stabilator', 'スタビレーター（全遊動式水平尾翼）', 'Archer'], ['Anti-servo tab', 'アンチサーボタブ', ''], ['Trim', 'トリム', ''], ['Magneto', 'マグネトー', ''], ['Mixture (rich / lean / idle cut-off)', 'ミクスチャー', ''], ['Carburetor ice / carb heat', 'キャブレターアイス・キャブヒート', ''], ['Fuel selector', '燃料セレクター', 'LEFT / RIGHT / OFF'], ['Electric fuel pump', '電動燃料ポンプ', ''], ['Alternator', '発電機', ''], ['Pitot-static system', 'ピトー静圧系統', ''], ['AHRS / ADC', '姿勢方位基準装置・エアデータコンピュータ', 'G1000'], ['Standby instruments', '予備計器', ''], ['Variation / Deviation', '偏差・自差', '']],
    examples: ['巡航中に回転が 2,400 → 2,300 rpm へじわじわ下がった → キャブヒート ON、荒れたあと回復するか見る。', 'ALT の注意表示 → 電流計で確認 → 手順に従って ALT をリセット → 戻らなければ電気を節約して着陸へ。', '右タンクで 30 分飛んだので左へ切り替える（電動ポンプ ON、切替後の燃圧を確認）。'],
    cautions: ['ミクスチャー・キャブヒート・燃料タンク切替はこのシミュレータでは未実装（チェックリストで「教材では未実装」と表示）。', '手順・数値は機体の POH と訓練校のチェックリストが優先。この章の例は公開されている一つの版に基づく。'],
    quiz: [
      { q: 'Archer（低翼機）の燃料セレクターについて正しいものは？', choices: ['BOTH の位置で両方のタンクから送る', 'LEFT / RIGHT / OFF から選び、時間を決めて切り替える', '燃料は重力だけで送られる', '切り替えは不要'], answer: 1, why: 'Archer は左右のタンクを LEFT / RIGHT で選ぶ（BOTH はない）。量の差が大きくならないよう切り替える。低翼なのでポンプで送る。' },
      { q: '静圧孔が詰まったとき、高度計はどうなる？', choices: ['上昇で高く表示される', '止まる（変化しない）', '0 になる', '速度計のように動く'], answer: 1, why: '静圧が変わらないので高度計は止まり、昇降計は 0。代替静圧に切り替える。' },
      { q: '固定ピッチの Archer で、巡航中に原因なく回転がじわじわ下がった。最初に疑うのは？', choices: ['プロペラの破損', 'キャブレターアイス', '燃料の入れすぎ', 'オルタネーターの故障'], answer: 1, why: 'キャブレターアイスの典型的な兆候。キャブヒートを入れる（一時的に荒れてから回復）。' },
    ],
    refs: [R.phak, R.archerCk, R.g1000, R.archer, R.acron], lessons: ['a1', 'i3'] });

  // ======================================================================= 4
  B.add({ id: 'perf', part: 'p1', t: '性能と重量・重心', en: 'Performance, weight and balance',
    summary: '密度高度（暑いフロリダの夏）、離着陸距離の読み方、上昇・巡航の性能、重量重心の計算とその意味。',
    secs: [
      { id: 'perf.da', t: '密度高度：暑い・高い・湿った日は性能が落ちる', h: () => `
<p>飛行機の性能（エンジンの出力・プロペラの推力・翼の揚力）は<b>空気の密度</b>で決まります。密度を「標準大気なら何 ft に相当するか」で表したものが<b>密度高度（density altitude）</b>です。</p>${FIG.atm()}
${bk.f('気圧高度 ≒ 標高 ＋（29.92 − 高度計規正値）× 1,000 ft　　密度高度 ≒ 気圧高度 ＋ 120 ×（気温 − 標準気温）')}${bk.calc('da')}
<p>Sanford の標高は約 55 ft と低いのですが、<b>夏の 33℃</b>では標準気温（約 15℃）より 18℃ 高く、密度高度は 2,000 ft を超えます。<b>湿度</b>も密度を下げます（水蒸気は乾いた空気より軽い）。</p>
${bk.key('高い・暑い・湿った（High, Hot, Humid）＝離陸距離が延び、上昇率が下がる', '密度高度が高いと、真対気速度は速いが、指示対気速度で見る失速速度・Vr は同じ（IAS で飛ぶ）')}` },
      { id: 'perf.tol', t: '離着陸距離と POH の性能表', h: () => `
<p>14 CFR 91.103 は、飛行前に<b>使う空港の滑走路長</b>と、POH の<b>離着陸距離</b>を確認することを求めています。性能表は気圧高度・気温・重量・風・滑走路の状態で距離が変わる形で書かれています。</p>
${bk.t(['条件', '離陸距離', '着陸距離'], [['重量が重い', '延びる', '延びる'], ['密度高度が高い', '延びる', '延びる'], ['向かい風', '短くなる', '短くなる'], ['追い風', '大きく延びる', '大きく延びる'], ['芝・濡れた滑走路', '延びる（芝・柔らかい地面）', '延びる（ブレーキが効きにくい）'], ['上り坂', '延びる', '短くなる']])}
<ul><li>性能表の値は<b>新しい機体と熟練した操縦士</b>で測ったもの。実際には余裕（マージン）を持たせる</li><li>「50 ft の障害物を越えるまで」の距離と「地上滑走」の距離を区別する</li></ul>
${bk.key('離陸できるか迷う滑走路なら「離陸を中止する地点」を決めておく（例：滑走路の半分までに Vr の 70% に達しなければ中止＝広く教えられている目安）', '追い風成分 10% ごとに距離が大きく延びる。風向きと使用滑走路を確認')}
${bk.sim('短距離離陸（ブレーキを踏んでフルパワー・Vx で上昇）。', ['x3', '短距離離陸'])}` },
      { id: 'perf.climb', t: '上昇・巡航・燃料消費の目安', h: () => {
        const P = FL.physics, s = P.newState({ aircraft: 'pa28' }), V = AR;
        const vy = P.steadyState(s, V.y, null, { pwr: 'full', altFt: 100 }), vy3 = P.steadyState(s, V.y, null, { pwr: 'full', altFt: 3000 }), cr = P.steadyState(s, V.cruise, 0, { altFt: 3000 });
        return `<p>上昇は<b>Vy（最良上昇率：時間あたり最も高く）</b>と<b>Vx（最良上昇角：距離あたり最も高く）</b>を使い分けます。Archer のチェックリストは Vy ${V.y}・Vx ${V.x}・巡航上昇 ${V.climb} KIAS（エンジンの冷却と前方視界のため、地上 1,000 ft 以上では速めの巡航上昇）。</p>
${bk.t(['この教材の Archer（教材モデルの計算値）', '値'], [['全開・Vy・海面付近の上昇率', `約 ${Math.round(vy.fpm / 10) * 10} fpm`], ['全開・Vy・3,000 ft の上昇率', `約 ${Math.round(vy3.fpm / 10) * 10} fpm（高いほど下がる）`], [`3,000 ft・${V.cruise} KIAS の水平飛行`, `スロットル約 ${Math.round(cr.thr * 100)}%・約 ${Math.round(cr.rpm / 50) * 50} rpm`]])}
<p>これらは教材モデルの値で、実機の POH の上昇性能（最大重量の値など）とは違います。燃料消費は出力でおおきく変わります（巡航で 1 時間に 8〜10 US gal 前後が一般的な目安。POH の表で確認）。</p>${bk.calc('fuel')}
${bk.key('Vx は障害物を越えるとき、Vy は早く高度を取りたいとき', '燃料は「時間 × 消費率 ＋ 予備（昼 30 分・夜 45 分）＋ タキシー・上昇分」で計画')}`; } },
      { id: 'perf.wb', t: '重量と重心（Weight & Balance）', h: () => `
<p>重量が重いと失速速度が上がり、離陸距離が延び、上昇率が下がります。<b>重心（CG）</b>の位置は安定性と操縦性そのものです。</p>
${bk.t(['重心の位置', '影響'], [['前すぎ', '機首が重く、フレアで引ききれない（尾翼の下向きの力が大きい）。失速速度が上がる。安定しすぎて操縦が重い'], ['後ろすぎ', '安定が失われる。失速・スピンからの回復が難しくなる（最も危険）。操縦が軽すぎて引きすぎやすい']])}
<h4>計算の手順</h4>
<ol><li>各項目の<b>重量 × アーム（基準線からの距離）＝ モーメント</b></li><li>重量とモーメントをそれぞれ合計</li><li><b>重心 ＝ 合計モーメント ÷ 合計重量</b></li><li>重量と重心がエンベロープ（許容範囲）の中か確認。燃料が減ると重心が動くので、着陸時も確認</li></ol>
${bk.calc('wb')}${FIG.wbEnvelope()}
${bk.warn('上の計算機と図の数値（アーム・許容範囲）は<b>教材用近似</b>です。実際の機体は、その機体の重量重心表（空虚重量・アームは機体ごとに違う）と POH の許容範囲で計算してください。')}
${bk.key('最大重量を超えない・重心を範囲に入れる・着陸時（燃料が減った状態）も確認', '後ろの席や手荷物は重心を大きく後ろへ動かす（アームが長い）')}` },
    ],
    terms: [['Density altitude', '密度高度', ''], ['Pressure altitude', '気圧高度', '29.92 inHg 基準'], ['Takeoff / landing distance', '離陸・着陸距離', ''], ['Ground roll', '地上滑走距離', ''], ['Over a 50-ft obstacle', '50 ft の障害物を越える距離', ''], ['Vx / Vy', '最良上昇角速度・最良上昇率速度', ''], ['Weight and balance', '重量と重心', ''], ['Center of gravity (CG)', '重心', ''], ['Arm / Moment / Datum', 'アーム・モーメント・基準線', ''], ['CG envelope', '重心の許容範囲', '']],
    examples: ['夏の Sanford（55 ft・33℃・29.92 inHg）：密度高度は約 2,300 ft。離陸距離が延び、上昇率が下がる。', '後席に 2 人と手荷物 50 lb を積んだら、重心が後方限界に近づいた → 手荷物を減らす。'],
    cautions: ['性能表・重量重心表は機体ごとに違う。この章の数値は説明用。', '追い風での離陸・着陸は距離が大きく延びる。風の弱い日でも風向きを確認。'],
    quiz: [
      { q: '密度高度が高くなる組み合わせは？', choices: ['低い・寒い・乾いた', '高い・暑い・湿った', '高い・寒い・乾いた', '低い・暑い・乾いた'], answer: 1, why: '標高が高く、気温が高く、湿度が高いと空気の密度が下がり、密度高度が高くなる＝性能が落ちる。' },
      { q: '重心が後方限界を超えたときに最も問題になるのは？', choices: ['離陸距離がわずかに延びる', '安定が失われ、失速・スピンからの回復が難しくなる', '燃費が悪くなる', '着陸で機首が重くなる'], answer: 1, why: '重心が後ろすぎると縦の安定が失われ、最も危険。前すぎは操縦が重く、フレアで引ききれないことがある。' },
      { q: '14 CFR 91.103 が飛行前に求めている確認は？', choices: ['燃料価格', '滑走路長と離着陸距離の情報（すべての飛行）', 'ATC の周波数だけ', '機体の塗装'], answer: 1, why: '91.103：すべての飛行で使う空港の滑走路長と離着陸距離の情報、IFR や空港近辺以外の飛行では気象・燃料・代替案なども。' },
    ],
    refs: [R.phak, R.wb, R.cfr91, R.archerCk], lessons: ['x3', 'a3'] });
})(typeof globalThis !== 'undefined' ? (globalThis.FL = globalThis.FL || {}) : {});
