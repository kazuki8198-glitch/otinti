<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="310" viewBox="0 0 1120 310" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker></defs><rect width="1120" height="310" fill="#FFFFFF"/><text x="560" y="36" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">通常の尾翼機を　形態や操縦系統などの条件をそろえて比較</text><rect x="25" y="62" width="400" height="125" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="225" y="112.98" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">重心が前寄り</text><text x="225" y="148.10000000000002" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">縦の静安定の余裕が大きい側</text><rect x="695" y="62" width="400" height="125" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="895" y="112.98" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">重心が後寄り</text><text x="895" y="148.10000000000002" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">縦の静安定の余裕が小さい側</text><line x1="435" y1="124" x2="683" y2="124" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="560" y="105" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">重心後退</text><text x="560" y="244" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">静安定　乱れの直後に元へ戻そうとする傾向</text><text x="560" y="288" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">動安定や操縦性とは区別し　承認された前後限界を守る</text></svg>