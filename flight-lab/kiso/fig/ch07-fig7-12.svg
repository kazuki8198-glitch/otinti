<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="496" viewBox="0 0 1200 496" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#6B7280"/></marker></defs><rect width="1200" height="496" fill="#FFFFFF"/><text x="600" y="38" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">架空TAFの時間帯を重ねる</text><text x="24" y="125" font-size="24" fill="#6B7280" text-anchor="start" font-weight="700">UTC</text><line x1="170" y1="116" x2="1160" y2="116" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" opacity="1"/><line x1="170" y1="104" x2="170" y2="128" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="170" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">15日03</text><line x1="269" y1="104" x2="269" y2="128" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="269" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">06</text><line x1="401" y1="104" x2="401" y2="128" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="401" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">10</text><line x1="467" y1="104" x2="467" y2="128" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="467" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">12</text><line x1="863" y1="104" x2="863" y2="128" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="863" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">16日00</text><line x1="1160" y1="104" x2="1160" y2="128" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="1160" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">09</text><text x="24" y="190" font-size="24" fill="#1F2937" text-anchor="start" font-weight="700">TEMPO</text><rect x="269" y="156" width="132" height="50" rx="8" fill="#B23A3A" opacity=".25"/><rect x="269" y="156" width="132" height="50" rx="8" fill="none" stroke="#B23A3A" stroke-width="3"/><text x="487" y="190" font-size="26" fill="#B23A3A" text-anchor="start" font-weight="700">15日06〜10　一時的な悪化</text><text x="24" y="270" font-size="24" fill="#1F2937" text-anchor="start" font-weight="700">BECMG</text><rect x="401" y="236" width="66" height="50" rx="8" fill="#DCE8F3" stroke="#2E6DA4" stroke-width="3"/><line x1="479" y1="261" x2="1160" y2="261" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="487" y="324" font-size="24" fill="#1F2937" text-anchor="start" font-weight="500">15日10〜12に風が変化し、以後継続</text><line x1="302" y1="372" x2="302" y2="216" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><circle cx="302" cy="372" r="8" fill="#1F3A5F" stroke="#fff" stroke-width="3"/><text x="326" y="381" font-size="24" fill="#1F3A5F" text-anchor="start" font-weight="700">到着 15日07 UTC（16 JST）は TEMPO 区間内</text><text x="665" y="444" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="700">全体の有効期間 15日03 UTC〜16日09 UTC＝30時間</text><line x1="170" y1="468" x2="1160" y2="468" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-gray)" marker-start="url(#a-gray)" opacity="1"/><line x1="170" y1="456" x2="170" y2="480" stroke="#6B7280" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="1160" y1="456" x2="1160" y2="480" stroke="#6B7280" stroke-width="3" stroke-linecap="round" opacity="1"/></svg>