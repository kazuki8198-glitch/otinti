<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="306" viewBox="0 0 1200 306" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="306" fill="#FFFFFF"/><text x="194" y="44" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">速度と降下経路</text><rect x="24" y="66" width="340" height="116" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="194" y="116" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">目標の範囲へ</text><text x="194" y="151.1" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">安定している</text><text x="600" y="44" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">形態と出力</text><rect x="430" y="66" width="340" height="116" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="116" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">必要な状態と</text><text x="600" y="151.1" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">確認が整っている</text><text x="1006" y="44" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">継続の判断</text><rect x="836" y="66" width="340" height="116" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="1006" y="116" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">大きな修正なしで</text><text x="1006" y="151.1" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">着陸へ向かえる</text><text x="600" y="234" font-size="28" fill="#B23A3A" text-anchor="middle" font-weight="700">条件が整わない → 早く復行を判断する</text><text x="600" y="284" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">PAPI の表示だけでは　速度・形態・滑走路の安全は分からない</text></svg>