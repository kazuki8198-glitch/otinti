<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="200" viewBox="0 0 960 200" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker></defs><rect width="960" height="200" fill="#FFFFFF"/><rect x="20" y="18" width="250" height="76" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="145" y="65.36" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">準備と地上走行</text><rect x="355" y="18" width="250" height="76" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="480" y="65.36" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">姿勢と経路の管理</text><rect x="690" y="18" width="250" height="76" rx="12" fill="#E8EEF5" stroke="#1F3A5F" stroke-width="3"/><text x="815" y="65.36" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">離着陸と振り返り</text><line x1="282" y1="56" x2="343" y2="56" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><line x1="617" y1="56" x2="678" y2="56" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="480" y="140" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">目的を理解する → 状態を見る → 操作する → 結果を確かめる</text><text x="480" y="182" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">知識を判断へ結び付け　実行は教官との訓練で身に付ける</text></svg>