<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="470" viewBox="0 0 1200 470" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker></defs><rect width="1200" height="470" fill="#FFFFFF"/><path d="M30,78 L30,58 L1170,58 L1170,78" stroke="#1F3A5F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="600" y="40" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">操縦を保ちながら（姿勢・方向・速度）</text><rect x="30" y="95" width="255" height="210" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><circle cx="64" cy="130" r="20" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="64" y="139" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="171.5" y="140" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">識別</text><text x="157.5" y="195" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">異常がある側を</text><text x="157.5" y="227.4" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">複数の表示で照合</text><line x1="291" y1="200" x2="319" y2="200" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><rect x="325" y="95" width="255" height="210" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><circle cx="359" cy="130" r="20" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="359" y="139" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="466.5" y="140" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">対象の確認</text><text x="452.5" y="195" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">操作する</text><text x="452.5" y="227.4" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">レバー・スイッチを</text><text x="452.5" y="259.8" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">確かめる</text><line x1="586" y1="200" x2="614" y2="200" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><rect x="620" y="95" width="255" height="210" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><circle cx="654" cy="130" r="20" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="654" y="139" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="761.5" y="140" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">操作</text><text x="747.5" y="195" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">承認された</text><text x="747.5" y="227.4" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">手順で行う</text><line x1="881" y1="200" x2="909" y2="200" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><rect x="915" y="95" width="255" height="210" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><circle cx="949" cy="130" r="20" fill="#1F3A5F" stroke="#1F3A5F" stroke-width="2"/><text x="949" y="139" font-size="24" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="1056.5" y="140" font-size="27" fill="#1F3A5F" text-anchor="middle" font-weight="700">結果の確認</text><text x="1042.5" y="195" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">変化を照合する</text><rect x="30" y="330" width="1140" height="100" rx="12" fill="#FBEFEF" stroke="#B23A3A" stroke-width="3"/><text x="600" y="370" font-size="24" fill="#B23A3A" text-anchor="middle" font-weight="700">足にかかる力や機首の偏りだけで、停止するエンジンを決めない</text><text x="600" y="408" font-size="24" fill="#B23A3A" text-anchor="middle" font-weight="700">作動中のエンジンを止めると、両発の推力を失う</text><text x="600" y="458" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">考え方の図であり、全機種共通の操作順序ではない</text></svg>