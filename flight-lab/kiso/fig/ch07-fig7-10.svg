<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker></defs><rect width="1200" height="260" fill="#FFFFFF"/><text x="600" y="40" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">過冷却水滴による着氷の基本例</text><rect x="30" y="70" width="340" height="170" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="200" y="145.64" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">空気中の水滴</text><text x="200" y="188.51999999999998" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">0℃未満でも液体</text><line x1="378" y1="155" x2="422" y2="155" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><rect x="430" y="70" width="340" height="170" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="145.64" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">機体への衝突</text><text x="600" y="188.51999999999998" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">形状や水滴径が関係</text><line x1="778" y1="155" x2="822" y2="155" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><rect x="830" y="70" width="340" height="170" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="1000" y="145.64" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">表面での凍結</text><text x="1000" y="188.51999999999998" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">形状と性能が変化</text></svg>