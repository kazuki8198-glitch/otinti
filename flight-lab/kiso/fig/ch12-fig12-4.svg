<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="298" viewBox="0 0 1200 298" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="298" fill="#FFFFFF"/><rect x="30" y="20" width="540" height="140" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="300" y="81.3" font-size="30" fill="#1F3A5F" text-anchor="middle" font-weight="700">QNHによる高度</text><text x="300" y="120.3" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">現地の気圧を基準に規正</text><rect x="630" y="20" width="540" height="140" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="900" y="81.3" font-size="30" fill="#1F3A5F" text-anchor="middle" font-weight="700">フライトレベル</text><text x="900" y="120.3" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">標準気圧 1013.25 hPa を使用</text><text x="600" y="222" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">同じ数字でも　基準が違えば意味が違う</text><text x="600" y="274" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">変更時点は公示情報と指示で確認</text></svg>