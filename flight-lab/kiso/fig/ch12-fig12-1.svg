<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="212" viewBox="0 0 1200 212" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-navy" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#1F3A5F"/></marker></defs><rect width="1200" height="212" fill="#FFFFFF"/><rect x="30" y="14" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="195" y="64.08" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">計器で状態を知る</text><rect x="435" y="14" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="64.08" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">方式と経路を守る</text><rect x="840" y="14" width="330" height="80" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="1005" y="64.08" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">継続と復行を判断</text><line x1="372" y1="54" x2="423" y2="54" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><line x1="777" y1="54" x2="828" y2="54" stroke="#1F3A5F" stroke-width="5" stroke-linecap="round" marker-end="url(#a-navy)" opacity="1"/><text x="600" y="146" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">姿勢と出力 → 表示の照合 → 経路の監視 → 運航の判断</text><text x="600" y="194" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">原理と判断は座学、操作は教官との訓練へ</text></svg>