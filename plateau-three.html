<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>関内 three.js 試作</title>
<style>
:root{--bg:#0b1220;--ink:#e8f0fa;--line:rgba(95,212,255,.45)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,"Zen Kaku Gothic New",sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:max(10px,env(safe-area-inset-left));top:10px;padding:6px 10px;border-radius:8px;background:rgba(6,12,22,.72);font:12px ui-monospace,Menlo,monospace;white-space:pre;pointer-events:none}
#help{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:10px;padding:5px 10px;border-radius:8px;background:rgba(6,12,22,.62);font-size:12px;pointer-events:none}
#panel{position:fixed;right:max(10px,env(safe-area-inset-right));top:10px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(560px,calc(100% - 20px));justify-content:flex-end}
#panel button{padding:6px 10px;border-radius:7px;border:1px solid var(--line);background:rgba(20,34,54,.92);color:var(--ink);font:600 12px system-ui,sans-serif;cursor:pointer}
#panel button.on{border-color:#ffd66b}
#settings{position:fixed;right:max(10px,env(safe-area-inset-right));top:96px;display:none;width:300px;padding:10px 12px;border-radius:10px;background:rgba(6,12,22,.92);border:1px solid var(--line);font-size:12px}
#settings label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0}
#settings select{background:#14223a;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 4px;font:12px system-ui}
#settings .note{opacity:.75;margin-top:6px;line-height:1.4}
#out{position:fixed;left:10px;right:10px;bottom:44px;height:30%;display:none;background:rgba(6,12,22,.94);color:#dfe7f0;border:1px solid var(--line);border-radius:8px;padding:8px;font:11px/1.4 ui-monospace,Menlo,monospace}
#pad{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));display:none;grid-template-columns:repeat(3,54px);gap:6px}
#pad button{height:46px;border-radius:10px;border:1px solid rgba(232,240,250,.35);background:rgba(8,17,31,.5);color:var(--ink);font:700 16px system-ui;touch-action:none}
#credit{position:fixed;right:10px;bottom:6px;font-size:10px;opacity:.75;pointer-events:none;text-align:right}
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

<body>

</div>

<script type="module">
// =====================================================================
//  The Kannai test block in three.js, for a PC: PLATEAU's own city (its
//  buildings, LOD2 or LOD3; its road surfaces, LOD3, with kerbs made from
//  their raised edges; its single trees), through 3DTilesRendererJS;
//  three's standard PBR materials in a linear pipeline, lit by a
//  photographed sky (Poly Haven HDRI: its sun as the shadow-casting light,
//  the rest as the ambient light and what shiny surfaces mirror), then
//  ambient occlusion, a little bloom, ACES tone mapping; a car that drives
//  on PLATEAU's road surface and stops at its walls. Everything in one
//  survey's frame, so buildings, kerbs, trees and the wheels agree.
// =====================================================================
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { Pass } from 'three/addons/postprocessing/Pass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { TilesRenderer } from '3d-tiles-renderer';
import { GLTFExtensionsPlugin, ReorientationPlugin, LoadRegionPlugin, SphereRegion } from '3d-tiles-renderer/plugins';
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const BASE = 'https://assets.cms.plateau.reearth.io/assets/';
const SETS = {
  lod2: BASE + '94/a960a4-7e19-439f-8249-b743e939102a/14100_yokohama-shi_city_2024_citygml_2_op_bldg_3dtiles_14104_naka-ku_lod2/tileset.json',
  lod3: BASE + '98/34e4f3-a849-4f12-8bd2-50826a53fa62/14100_yokohama-shi_city_2024_citygml_2_op_bldg_3dtiles_14104_naka-ku_lod3/tileset.json',
  roads: BASE + '51/8e3f96-c5d3-4d89-9397-0aa810b096f7/14100_yokohama-shi_city_2024_citygml_2_op_tran_3dtiles_lod3/tileset.json',
  nishi2: BASE + '4a/84f474-71c4-4b33-a328-0c5798b79f2f/14100_yokohama-shi_city_2024_citygml_2_op_bldg_3dtiles_14103_nishi-ku_lod2/tileset.json',
  nishi3: BASE + '57/4b4e13-9239-4570-b4c3-18f695ef7035/14100_yokohama-shi_city_2024_citygml_2_op_bldg_3dtiles_14103_nishi-ku_lod3/tileset.json',
  kana2: BASE + '67/51cc26-b148-4296-892d-807ba6798fa8/14100_yokohama-shi_city_2024_citygml_2_op_bldg_3dtiles_14102_kanagawa-ku_lod2/tileset.json',
  trees: BASE + '83/75c1ef-9ab7-4e3a-87be-ba98230726d0/14100_yokohama-shi_city_2024_citygml_2_op_veg_SolitaryVegetationObject_3dtiles_lod3/tileset.json',
};
const SPOT = { lat: 35.446899, lon: 139.641167, h: 39.3, dx: 0.54, dz: -0.841 };   // (h: the street's ellipsoidal height there; dx, dz: the way it runs, east and south)
const touch = matchMedia('(pointer: coarse)').matches;
const qs = new URLSearchParams(location.search), NORENDER = qs.has('norender');   // (norender: the world and the driving without drawing, for tests)
// the picture: three presets, each a starting point for the settings below (kept in this browser). 高画質固定 draws at
// 100 % of the screen and doesn't change it; バランス lets the resolution drop to 60 % when frames run long and come
// back; 軽量 is for weak GPUs. Chosen by the GPU the first time (?q=high / balance / low to pick one)
const GPU = (() => { try { const gl = document.createElement('canvas').getContext('webgl2'), d = gl && gl.getExtension('WEBGL_debug_renderer_info'); return d ? String(gl.getParameter(d.UNMASKED_RENDERER_WEBGL)) : ''; } catch (e) { return ''; } })();
const PRESETS = {
  high: { label: '高画質固定', msaa: 4, aoScale: 1, aoSamples: 12, bloom: true, err: 8, bytes: 2.6e9, s: { auto: false, scale: 1, tex: 4096, shadow: 4096, ao: true, dist: 600 } },
  balance: { label: 'バランス', msaa: 2, aoScale: 0.5, aoSamples: 8, bloom: true, err: 10, bytes: 2.0e9, s: { auto: true, scale: 1, tex: 4096, shadow: 2048, ao: true, dist: 480 } },
  low: { label: '軽量', msaa: 0, aoScale: 0.5, aoSamples: 8, bloom: false, err: 16, bytes: 0.6e9, s: { auto: true, scale: 1, tex: 2048, shadow: 2048, ao: false, dist: 350 } },
};
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* (no storage: settings last for this visit) */ } } };
const qPick = { high: 'high', balance: 'balance', mid: 'balance', low: 'low' }[qs.get('q')];
const saved = store.get('ydrive-settings');
const QN = qPick || (saved && PRESETS[saved.preset] ? saved.preset : touch ? 'low' : /Intel|Iris|UHD|Radeon\(TM\) Graphics|Radeon Graphics|Vega \d+ Graphics|Apple M/i.test(GPU) ? 'balance' : 'high');
const P = PRESETS[QN];
const S = { ...P.s, ...(saved && saved.preset === QN && !qPick ? saved.s : {}) };   // (the settings, as changed in the panel)
const Q = { dpr: 1, msaa: P.msaa, ao: S.ao, aoScale: P.aoScale, aoSamples: P.aoSamples, bloom: P.bloom, shadow: S.shadow || 2048, maxTex: QN === 'low' ? 1024 : 2048, err: P.err, rad: S.dist, bytes: P.bytes };
const QLABEL = P.label;
const saveSettings = () => store.set('ydrive-settings', { preset: QN, s: S });

// ---- the renderer, and the passes after it ----
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, Q.dpr));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = S.shadow > 0; renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.info.autoReset = false;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2500);
camera.layers.enable(1);                                                // (layer 1: the tree cards)
class Hook extends Pass { constructor(fn) { super(); this.fn = fn; this.needsSwap = false; } render() { this.fn(); } }
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: Q.msaa }));
composer.addPass(new RenderPass(scene, camera));
// the AO's own drawing of the scene (depth and normals) leaves out the tree cards (to it their cut-out leaves would be
// solid squares) and doesn't redraw the sun's shadow map
composer.addPass(new Hook(() => { camera.layers.disable(1); renderer.shadowMap.autoUpdate = false; }));
const ao = new GTAOPass(scene, camera, 1, 1);
ao.updateGtaoMaterial({ radius: 0.8, distanceExponent: 1.4, thickness: 1.2, scale: 1.0, samples: Q.aoSamples });
{ const set = ao.setSize.bind(ao); ao.setSize = (w, h) => set(Math.max(1, Math.round(w * Q.aoScale)), Math.max(1, Math.round(h * Q.aoScale))); }   // (AO is soft: worked out at a lower resolution, spread over the frame)
ao.blendIntensity = 0.85; ao.enabled = Q.ao; composer.addPass(ao);
composer.addPass(new Hook(() => { camera.layers.enable(1); renderer.shadowMap.autoUpdate = true; }));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.16, 0.35, 2.2);   // (only what is brighter than white: the sun on chrome and glass)
bloom.enabled = Q.bloom; composer.addPass(bloom);
composer.addPass(new OutputPass());                                    // (ACES and the sRGB encoding, once, at the end)
composer.setSize(innerWidth, innerHeight);
// the resolution drawn at: S.scale of the screen's when fixed; with 自動解像度 on, between 60 % and S.scale, lowered
// when frames run long and raised when there is room (the panel and the HUD show what it is now and the screen's size)
let rscale = S.auto ? S.scale : S.scale, rsAt = 0, rsLast = '';
function setScale(v) { rscale = v; composer.setPixelRatio(renderer.getPixelRatio() * rscale); }
function adaptScale(now) {
  if (!S.auto || bench || NORENDER || now - rsAt < 1500 || fr.length < 60) return;
  rsAt = now;
  const s = stats(fr.slice(-60));
  let n = rscale;
  if (s.p50 > 19) n = Math.max(0.6, rscale * 0.9); else if (s.p50 < 17.5 && s.p95 < 19.5) n = Math.min(S.scale, rscale * 1.05);
  if (Math.abs(n - rscale) > 0.005) { rsLast = n < rscale ? '↓' : '↑'; setScale(n); }
}
setScale(rscale);

// fetched next to the page; where a file type isn't served, its base64 copy in <name>.json
async function fetchBin(u) { try { const r = await fetch(u); if (r.ok && !/html/.test(r.headers.get('content-type') || '')) return await r.arrayBuffer(); } catch (e) { /* the JSON copy */ } const j = await (await fetch(u + '.json')).json(), b = atob(j.glb || j.data), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a.buffer; }

// ---- the sky: Poly Haven's "Kloofendal 48d Partly Cloudy (Pure Sky)". Seen: the 4k photo, its linear radiance
// stored at a quarter (so the clouds fit 8 bits; only the sun's disc is clipped). Lighting: the 1k HDR with its sun
// clipped out; the sun is the directional light below, with shadows (48 deg up; 4.37 at normal incidence, measured
// from the HDR's own disc) ----
const SUN = new THREE.Vector3(0.553, 0.743, 0.377).normalize();
new THREE.TextureLoader().load('models/tex/sky_4k.jpg', t => {
  t.mapping = THREE.EquirectangularReflectionMapping; t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t; scene.backgroundIntensity = 4.0;
});
const pmrem = new THREE.PMREMGenerator(renderer);
fetchBin('models/tex/sky_env_1k.hdr').then(buf => {
  const d = new HDRLoader().parse(buf), t = new THREE.DataTexture(d.data, d.width, d.height, THREE.RGBAFormat, d.type);
  Object.assign(t, { colorSpace: THREE.LinearSRGBColorSpace, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false, flipY: true, mapping: THREE.EquirectangularReflectionMapping });
  t.needsUpdate = true;
  scene.environment = pmrem.fromEquirectangular(t).texture; t.dispose();
}).catch(e => console.warn('sky light', e));
const sun = new THREE.DirectionalLight(new THREE.Color(1.0, 1.0, 0.91), 4.37);
sun.castShadow = true; sun.shadow.mapSize.set(Q.shadow, Q.shadow);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, near: 1, far: 900 });
sun.shadow.bias = -0.0002; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);
scene.fog = new THREE.FogExp2(new THREE.Color(0.433, 0.466, 0.564), 0.00042);   // (the horizon's own colour)

// ---- materials: ambientCG's photographed surfaces (colour, normal, roughness), laid by world position (from above
// on the flat, from the side on walls and kerb faces) ----
const texLoader = new THREE.TextureLoader(), maxAniso = renderer.capabilities.getMaxAnisotropy();
function pbr(name) {
  const t = k => { const x = texLoader.load(`models/tex/pbr/${name}_${k}.jpg`); x.wrapS = x.wrapT = THREE.RepeatWrapping; x.anisotropy = Math.min(maxAniso, 16); if (k === 'c') x.colorSpace = THREE.SRGBColorSpace; return x; };
  return { c: t('c'), n: t('n'), r: t('r') };
}
function worldMat(set, scale, extra = {}) {
  const m = new THREE.MeshStandardMaterial({ map: set.c, normalMap: set.n, roughnessMap: set.r, roughness: 1, metalness: 0, ...extra });
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader.replace('#include <project_vertex>', `#include <project_vertex>
    {
      vec3 wp = (modelMatrix * vec4(transformed, 1.0)).xyz, wn = normalize(mat3(modelMatrix) * objectNormal);
      vec2 wuv = (abs(wn.y) > 0.6 ? wp.xz : vec2(abs(wn.x) > abs(wn.z) ? wp.z : wp.x, wp.y)) / ${scale.toFixed(3)};
      #ifdef USE_MAP
        vMapUv = wuv;
      #endif
      #ifdef USE_NORMALMAP
        vNormalMapUv = wuv;
      #endif
      #ifdef USE_ROUGHNESSMAP
        vRoughnessMapUv = wuv;
      #endif
    }`);
  };
  m.customProgramCacheKey = () => 'world-uv-' + scale;
  return m;
}
const ASPHALT = pbr('asphalt'), PAVING = pbr('paving'), CONCRETE = pbr('concrete'), SOIL = pbr('soil');
const roadMats = [
  worldMat(ASPHALT, 2.5, { color: new THREE.Color(0.62, 0.62, 0.64) }),     // carriageway: the photographed asphalt, darkened to Japanese tarmac
  worldMat(PAVING, 1.2),                                                    // pavement
  worldMat(SOIL, 2.0),                                                      // planting: the tree pits' earth and weeds
  worldMat(CONCRETE, 3.0),                                                  // island
];
const kerbMat = worldMat(CONCRETE, 1.0, { color: new THREE.Color(0.95, 0.94, 0.9) });

// ---- the ground between the roads (lots, plazas, the park): a surface through PLATEAU's own road heights, a little
// under them; on a 6 m grid, the cells the roads don't reach filled from the coarser averages ----
const GH = { cs: 6, n: 301, x0: -900, z0: -900, dirty: false, at: 0, ready: false };
GH.min = new Float32Array(GH.n * GH.n).fill(Infinity);
GH.h = new Float32Array(GH.n * GH.n).fill(-0.35);
const groundGeo = (() => {
  const n = GH.n, p = new Float32Array(n * n * 3), idx = new Uint32Array((n - 1) * (n - 1) * 6);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) { const k = j * n + i; p[k * 3] = GH.x0 + i * GH.cs; p[k * 3 + 1] = -0.35; p[k * 3 + 2] = GH.z0 + j * GH.cs; }
  let q = 0;
  for (let j = 0; j < n - 1; j++) for (let i = 0; i < n - 1; i++) {
    const a = j * n + i, b = a + 1, d = a + n, c = d + 1;               // (a: i,j  b: i+1,j  d: i,j+1  c: i+1,j+1; split a-c)
    idx[q++] = a; idx[q++] = c; idx[q++] = b; idx[q++] = a; idx[q++] = d; idx[q++] = c;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p, 3)); g.setIndex(new THREE.BufferAttribute(idx, 1)); g.computeVertexNormals();
  return g;
})();
const ground = new THREE.Mesh(groundGeo, worldMat(CONCRETE, 3.0, { color: new THREE.Color(0.78, 0.77, 0.74) }));
ground.receiveShadow = true; ground.frustumCulled = false; scene.add(ground);
function groundNote(x, y, z) {
  const i = Math.round((x - GH.x0) / GH.cs), j = Math.round((z - GH.z0) / GH.cs);
  if (i < 0 || j < 0 || i >= GH.n || j >= GH.n) return;
  const k = j * GH.n + i; if (y < GH.min[k]) { GH.min[k] = y; GH.dirty = true; }
}
function groundRebuild() {
  const n = GH.n, N = n * n;
  let lv = { v: new Float32Array(N), w: new Uint8Array(N), nx: n, nz: n }; const L = [lv];
  for (let k = 0; k < N; k++) if (GH.min[k] < Infinity) { lv.v[k] = GH.min[k]; lv.w[k] = 1; }
  while (lv.nx > 1 || lv.nz > 1) {
    const cx = Math.ceil(lv.nx / 2), cz = Math.ceil(lv.nz / 2), v = new Float32Array(cx * cz), c = new Float32Array(cx * cz), w = new Uint8Array(cx * cz);
    for (let j = 0; j < lv.nz; j++) for (let i = 0; i < lv.nx; i++) { const k = j * lv.nx + i; if (lv.w[k]) { const q = (j >> 1) * cx + (i >> 1); v[q] += lv.v[k]; c[q]++; } }
    for (let q = 0; q < cx * cz; q++) if (c[q]) { v[q] /= c[q]; w[q] = 1; }
    L.push(lv = { v, w, nx: cx, nz: cz });
  }
  if (!lv.w[0]) return;
  for (let l = L.length - 2; l >= 0; l--) {
    const f = L[l], c = L[l + 1];
    for (let j = 0; j < f.nz; j++) for (let i = 0; i < f.nx; i++) {
