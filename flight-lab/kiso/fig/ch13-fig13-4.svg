<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="456" viewBox="0 0 1120 456" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#6B7280"/></marker></defs><rect width="1120" height="456" fill="#FFFFFF"/><text x="111" y="34" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="700">記号</text><text x="385" y="34" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="700">名称</text><text x="850" y="34" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="700">何を達成するための値か</text><rect x="20" y="50" width="1080" height="104" rx="12" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="2"/><rect x="36" y="64" width="150" height="76" rx="10" fill="#FFFFFF" stroke="#2E6DA4" stroke-width="4"/><text x="111" y="116" font-size="40" fill="#2E6DA4" text-anchor="middle" font-weight="700">V<tspan dy="9.6" font-size="28">YSE</tspan></text><text x="385" y="94" font-size="24" fill="#1F3A5F" text-anchor="middle" font-weight="700">片発時の</text><text x="385" y="126.4" font-size="24" fill="#1F3A5F" text-anchor="middle" font-weight="700">最良上昇率速度</text><line x1="575" y1="102" x2="615" y2="102" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-gray)" opacity="1"/><text x="850" y="94" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">時間当たりの高度増加を最大に</text><text x="850" y="130" font-size="24" fill="#2E6DA4" text-anchor="middle" font-weight="700">多くの小型双発機で青い線</text><rect x="20" y="170" width="1080" height="104" rx="12" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="2"/><rect x="36" y="184" width="150" height="76" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="4"/><text x="111" y="236" font-size="40" fill="#1F3A5F" text-anchor="middle" font-weight="700">V<tspan dy="9.6" font-size="28">XSE</tspan></text><text x="385" y="214" font-size="24" fill="#1F3A5F" text-anchor="middle" font-weight="700">片発時の</text><text x="385" y="246.4" font-size="24" fill="#1F3A5F" text-anchor="middle" font-weight="700">最良上昇角速度</text><line x1="575" y1="222" x2="615" y2="222" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-gray)" opacity="1"/><text x="850" y="231" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">水平距離に対する高度増加</text><rect x="20" y="290" width="1080" height="104" rx="12" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="2"/><rect x="36" y="304" width="150" height="76" rx="10" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="4"/><text x="111" y="356" font-size="40" fill="#1F3A5F" text-anchor="middle" font-weight="700">V<tspan dy="9.6" font-size="28">SSE</tspan></text><text x="385" y="334" font-size="24" fill="#1F3A5F" text-anchor="middle" font-weight="700">意図的に片発状態を</text><text x="385" y="366.4" font-size="24" fill="#1F3A5F" text-anchor="middle" font-weight="700">作る際の安全速度</text><line x1="575" y1="342" x2="615" y2="342" stroke="#6B7280" stroke-width="3" stroke-linecap="round" marker-end="url(#a-gray)" opacity="1"/><text x="850" y="334" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">訓練等で使う</text><text x="850" y="370" font-size="24" fill="#1F2937" text-anchor="middle" font-weight="500">最低操縦速度とは区別</text><text x="560" y="436" font-size="24" fill="#B23A3A" text-anchor="middle" font-weight="700">青線で飛んでも、必ず上昇するとは限らない</text></svg>