<script>
/* ---- FLIGHT LAB: book-2.js ---- */
// FLIGHT LAB — book-2.js : Part 1 (ground school), chapters 5–8: weather, regulations and airspace,
// aviation English and ATC, human factors and decision making. Facts from 14 CFR, the AIM and FAA handbooks (cited).
(function (FL) {
  'use strict';
  const B = FL.book, R = B.R, bk = B.bk, FIG = FL.bookFigs;

  // ======================================================================= 5
  B.add({ id: 'wx', part: 'p1', t: '航空気象（フロリダの空を中心に）', en: 'Aviation weather',
    summary: '大気と気圧、雲と前線、フロリダの夏の雷雨と海風、霧、ウインドシア、METAR と TAF の読み方、気象情報の入手と「行くか・やめるか」。',
    secs: [
      { id: 'wx.atm', t: '大気・気圧・気温', h: () => `${FIG.atm()}
<p>国際標準大気（ISA）は海面で <b>15℃・29.92 inHg（1013.25 hPa）</b>、上に行くほど気温は約 2℃／1,000 ft、気圧は約 1 inHg／1,000 ft 下がります。実際の大気は日ごとに違い、高度計は<b>その場所の気圧（高度計規正値・altimeter setting）</b>に合わせて使います（米国では 18,000 ft MSL 未満で現地の規正値、それ以上は 29.92）。</p>
${bk.t(['用語', '意味'], [['高気圧（High）', '下降気流。晴れやすい。北半球では時計回りに風が吹き出す'], ['低気圧（Low）', '上昇気流。雲や雨。北半球では反時計回りに風が吹き込む'], ['露点（dewpoint）', '空気を冷やしたとき水滴（雲・霧）ができ始める温度。気温と露点の差が小さいほど雲・霧ができやすい'], ['安定・不安定', '持ち上げた空気がさらに上がるなら不安定（積雲・にわか雨・乱気流）、戻るなら安定（層雲・霧・視程が悪い）']])}
${bk.key('高度計は「高い所から低い所へ」飛ぶと実際より高く表示される（気圧・気温とも）', '気温と露点が近づいたら（差 2〜3℃以内）、霧・低い雲を疑う')}` },
      { id: 'wx.ts', t: '雷雨とフロリダの夏', h: () => `${FIG.clouds()}${FIG.seaBreeze()}
<p>積乱雲（雷雨）ができるには<b>湿った空気・不安定な大気・持ち上げる力（地面の加熱・海風・前線・山）</b>の 3 つが必要です。フロリダ中部の夏は条件がそろいやすく、<b>午後に雷雨が発達し、夕方に弱まる</b>日が多くなります。</p>
${bk.t(['雷雨の危険', '内容'], [['乱気流', '雲の中だけでなく、周囲や下でも激しい（雲から 20 NM 以上離れることが推奨される＝Aviation Weather Handbook の考え方）'], ['ダウンバースト・マイクロバースト', '強い下降気流が地面で広がる。進入中に入ると、まず向かい風（速度が増える）→ 下降気流 → 追い風（速度が急に減る）で墜落の危険'], ['ひょう・雷・着氷', '雲の外にも降ることがある'], ['ガストフロント', '雷雨から吹き出す突風。雷雨より先に空港に届く']])}
${bk.key('積乱雲には近づかない・下を通らない・間をすり抜けない', 'ウインドシア（速度が ±15 kt 以上急に変わる、昇降率が大きく変わる）を感じたら、迷わず全開・ゴーアラウンド', 'フロリダの夏の訓練は午前中に計画することが多い（教官・学校の方針に従う）')}` },
      { id: 'wx.fog', t: '霧・低い雲・視程', h: () => `
${bk.t(['霧の種類', 'でき方', 'フロリダでの例'], [['放射霧', '晴れて風の弱い夜に地面が冷え、湿った空気が冷やされる', '冬〜春の明け方。日が昇ると消えることが多い'], ['移流霧', '暖かく湿った空気が冷たい地面・海の上へ流れてくる', '冬に暖かい空気が流れ込むとき'], ['前線霧・雨の霧', '暖かい雨が冷たい空気の中に降って湿度が上がる', '前線の通過時']])}
<p>VFR（有視界飛行）では<b>雲から離れ、決められた視程以上</b>で飛ばなければなりません（{ch:law}の 14 CFR 91.155）。視程が悪化しそうな日は、出発前に代替の計画（引き返す・別の空港）を決めます。</p>
${bk.key('VFR の操縦士が雲に入るのは重大事故の典型（空間識失調）。雲が近づいたら早めに引き返す', '「行ける」と思ったときこそ、引き返す判断の地点を先に決めておく')}` },
      { id: 'wx.metar', t: 'METAR と TAF の読み方', h: () => `
<p>空港の定時観測が <b>METAR</b>、予報が <b>TAF</b> です。米国の形式は単位（statute mile・inHg）が日本と違います。<b>以下は架空の例</b>です。</p>
${bk.f('METAR KSFB 141753Z 09012G20KT 10SM FEW035 SCT050 BKN250 32/23 A3001 RMK AO2 TSB45 SLP162')}
${bk.t(['部分', '意味'], [['KSFB', '空港（ICAO 4 文字。米国本土は K で始まる）'], ['141753Z', '14 日 17:53 UTC（Z＝協定世界時。フロリダの夏時間では −4 時間＝13:53）'], ['09012G20KT', '風：090°（真方位）から 12 kt、突風 20 kt'], ['10SM', '視程 10 statute mile（法定マイル）'], ['FEW035 SCT050 BKN250', '雲：3,500 ft に少し、5,000 ft に散在、25,000 ft に多い（高さは地上から・100 ft 単位）。BKN と OVC が「雲高（ceiling）」'], ['32/23', '気温 32℃・露点 23℃'], ['A3001', '高度計規正値 30.01 inHg'], ['RMK AO2 TSB45', '備考：自動観測所（AO2）、45 分に雷雨が始まった（TSB45）']])}
${bk.t(['雲量', '意味'], [['SKC / CLR', '雲なし（自動観測は CLR＝12,000 ft 以下に雲なし）'], ['FEW', '1/8〜2/8'], ['SCT', '3/8〜4/8'], ['BKN', '5/8〜7/8（雲高）'], ['OVC', '8/8（雲高）']])}
<p>TAF の例（架空）：<code>TAF KSFB 141130Z 1412/1512 09010KT P6SM SCT040 TEMPO 1418/1422 3SM TSRA BKN030CB</code> ＝ 14 日 12Z〜15 日 12Z の予報、6 SM 超（P6SM）、18〜22Z の間に一時（TEMPO）雷雨・雨で視程 3 SM、3,000 ft に積乱雲を伴う雲。</p>
${bk.key('風向は METAR・TAF では真方位、ATIS・管制の風は磁方位', '「BKN / OVC の最も低い層」が雲高。VFR の判断は雲高と視程の両方で', '気温と露点の差が小さい・TEMPO TS がある日は特に計画を慎重に')}` },
      { id: 'wx.brief', t: '気象情報の入手と「行くか・やめるか」', h: () => `
<p>14 CFR 91.103 は、飛行前に必要なすべての情報（空港付近以外の飛行・IFR では気象の報告と予報など）を把握することを求めています。米国では <b>Aviation Weather Center（aviationweather.gov）</b>の METAR・TAF・GFA（Graphical Forecasts for Aviation）・PIREP（操縦士報告）・SIGMET などを使い、<b>1800wxbrief</b> などのフライトサービスで正式なブリーフィングを受けられます。</p>
${bk.t(['確認すること', '例'], [['出発・目的地・代替空港の実況と予報', 'METAR・TAF・ATIS'], ['経路の天気', 'GFA、レーダー、衛星画像、PIREP'], ['危険な天気', 'SIGMET・AIRMET（乱気流・着氷・IFR 状態・雷雨）'], ['風と気温', 'Winds and Temperatures Aloft（航法計算に使う）'], ['NOTAM', '滑走路閉鎖・航法施設の停止・TFR（一時的飛行制限）']])}
${bk.key('判断は「行けるか」ではなく「安全に行って帰れるか、だめなら代わりはあるか」', '個人の最低条件（personal minimums）を先に決めておく（例：訓練生のうちは雲高 3,000 ft・視程 5 SM 以上 など、教官と相談して）')}
${bk.sim('突風を伴う横風の日の判断と着陸を練習します（TEM の課目）。', ['r1', 'TEM：脅威を予測して管理する'])}` },
    ],
    terms: [['METAR / TAF', '定時観測・飛行場予報', ''], ['Ceiling', '雲高', 'BKN・OVC の最も低い層'], ['Visibility (SM)', '視程（法定マイル）', ''], ['Dewpoint / spread', '露点・気温との差', ''], ['Thunderstorm (TS) / CB', '雷雨・積乱雲', ''], ['Microburst / wind shear', 'マイクロバースト・ウインドシア', ''], ['Sea breeze', '海風', ''], ['Altimeter setting', '高度計規正値', 'inHg'], ['PIREP', '操縦士の気象報告', ''], ['SIGMET / AIRMET', '重要気象情報', ''], ['NOTAM / TFR', '航空情報・一時的飛行制限', '']],
    examples: ['METAR の 09012G20KT と滑走路 36：風は右から 90°、横風成分は最大 20 kt で Archer の実証横風 17 kt を超える → 別の滑走路・別の時間・中止を考える。', '夏の朝の TAF に「TEMPO 1418/1422 TSRA」→ 訓練は午前中に終える計画にする。'],
    cautions: ['この章の METAR・TAF は架空の例。実際の判断は最新の公式情報で。', '雷雨の距離の目安・個人の最低条件は、教官・学校の方針に従う。'],
    quiz: [
      { q: 'METAR の「BKN012 OVC025」の雲高（ceiling）は？', choices: ['1,200 ft', '2,500 ft', '12,000 ft', '雲高なし'], answer: 0, why: 'BKN・OVC の最も低い層が雲高。BKN012 は地上 1,200 ft。' },
      { q: '進入中にマイクロバーストに入ったとき、典型的に最初に起きることは？', choices: ['速度が急に減る', '向かい風で速度が増え、機体が浮く', 'エンジンが止まる', '何も起きない'], answer: 1, why: '最初は向かい風（速度増加）→ 下降気流 → 追い風（急な速度低下）。最初の「浮き」に合わせてパワーを絞ると、その後の沈みに耐えられない。' },
      { q: 'METAR の風向と ATIS の風向の違いは？', choices: ['どちらも磁方位', 'METAR は真方位、ATIS・管制は磁方位', 'METAR は磁方位、ATIS は真方位', 'どちらも真方位'], answer: 1, why: '書かれた報告（METAR・TAF）は真方位、声で伝える ATIS・管制の風は磁方位（滑走路番号と比べやすい）。' },
    ],
    refs: [R.wx, R.awc, R.phak, R.cfr91], lessons: ['r1', 'x1'] });

  // ======================================================================= 6

    secs: [
      { id: 'radio.why', t: '交信とは何か・誰と話すのか', h: () => `
<p>飛行中の無線交信（radiotelephony）は、パイロットと管制官が<b>同じ絵（どこに・どの機が・次に何をするか）</b>を持つための道具です。AIM（FAA の公式マニュアル）は、交信で最も大切なのは<b>「理解（understanding）」</b>であり、そのために<b>短く</b>、しかし伝わらなければ<b>必要な言葉を使ってでも</b>伝えること、そして俗語や無駄話（CB 無線のような言い方）は使わないことを求めています（AIM 4-2-1）。</p>
<h3>誰と話すのか：管制の種類と呼び方</h3>
${bk.t(['相手（英語の呼び方）', 'していること', 'いつ話すか'], [
  ['ATIS（例：LAB information Bravo）', '録音放送。風・視程・雲・気温・高度計規正値・使用滑走路・注意事項を繰り返し流す。話しかけることはできない', '出発前・到着前に必ず聞く'],
  ['Clearance Delivery（例：LAB Clearance Delivery）', '出発の許可・出発周波数・トランスポンダーのコードを出す（ある空港だけ）', 'エンジン始動の前後'],
  ['Ground（例：LAB Ground）', '地上管制。誘導路・滑走路の横断の指示', 'タキシーの前、着陸後に滑走路を出てから'],
  ['Tower（例：LAB Tower）', '飛行場管制。滑走路の使用（離陸・着陸・横断）と場周経路', '離陸の準備ができたら、到着の 15 NM ほど前から（AIM 4-3-2）'],
  ['Departure / Approach（例：LAB Departure）', 'レーダーで出発・到着の機を誘導し、交通情報を出す', '離陸後（管制塔に言われたら）、到着の前'],
  ['Center（例：Jacksonville Center）', '航空路管制。広い範囲をレーダーで見る', 'IFR の巡航、VFR の交通情報（余裕があれば）'],
  ['Flight Service（例：Orlando Radio）', '飛行情報業務。気象・飛行計画の受付', 'VFR 飛行計画を開く・閉じる、天気を聞く'],
  ['CTAF / UNICOM / MULTICOM', '管制塔のない空港の共通周波数。自分の位置と意図を全員に知らせる（自己通報）', '管制塔のない空港の周りで（{ch:radio5}）']])}
<p>AIM 4-2-6 の表のとおり、地上局は<b>「場所の名前＋局の種類」</b>で呼びます（例：Miami Ground、St. Louis Departure、Washington Center）。</p>
${bk.key('交信は「理解」のため。短く、でも伝わらなければ言葉を足す', '相手（局）によって仕事が違う。地上を動くのは Ground、滑走路と場周は Tower')}` },
      { id: 'radio.equip', t: '無線機・マイク・オーディオパネルの使い方', h: () => `
<ul><li><b>周波数</b>：航空機の通信（COM）は VHF 帯 118.000〜136.975 MHz。最近の無線機は 25 kHz 間隔で合わせる。G1000 では<b>使用中（active）</b>と<b>予備（standby）</b>の 2 つを表示し、予備を合わせてから ⇄ で入れ替える。</li>
<li><b>見通し距離</b>：VHF は光と同じでまっすぐ進む。山や地球の丸みの陰には届かない。<b>高いほど遠くまで届く</b>（AIM 4-2-2）。</li>
<li><b>同時に話せるのは 1 人</b>：送信ボタン（PTT：操縦輪の親指のスイッチ）を押している間は相手の声が聞こえない。2 機が同時に送信すると両方とも聞こえない（「ブロック」）。</li>
<li><b>話し方</b>（AIM 4-2-2）：マイクを唇のすぐ近くに。ボタンを押してから<b>一呼吸おいて</b>話し始める（最初の言葉が切れないように）。<b>ふつうの会話の声</b>で。離したら、相手が書き取ったり別の周波数で話していたりするので<b>数秒待つ</b>。</li>
<li><b>スタックマイク</b>：PTT が押しっぱなしになると周波数全体が使えなくなる（stuck mike）。返事がないときは、音量・周波数・マイクが押しっぱなしでないかを確かめる。</li></ul>
<h3>オーディオパネル</h3>
<p>どの無線機で<b>送信</b>するか（MIC：COM1 / COM2）と、どの無線機を<b>聞く</b>か（COM1・COM2・NAV1・NAV2 の受信ボタン）を選ぶ箱です。よくある失敗は「COM2 に周波数を合わせたのに MIC が COM1 のまま」。この教材の中央のオーディオパネルも同じ配置です（送信はできません）。</p>
${bk.key('返事がないときの確認：①音量 ②周波数（使用中の側か）③MIC の選択 ④ヘッドセットの差し込み ⑤スタックマイク ⑥もう一方の無線機', '高く上がると無線が届きやすい（迷ったとき・緊急時にも使う考え方）')}` },
      { id: 'radio.technique', t: '聞く → 考える → 話す', h: () => `
<ol><li><b>聞く</b>：送信する前に必ず聞く。周波数を変えた直後は特に、誰かが話していないか、ほかの機の交信が続いていないか（管制官の質問にパイロットが答える途中かもしれない）を確かめる。ATIS や周波数を聞いているだけでわかることも多い（AIM 4-2-2）。</li>
<li><b>考える</b>：言うことを先に決める。長い内容は紙に書いておく（AIM 4-2-2：think before keying, jot it down）。</li>
<li><b>話す</b>：決まった型（{ch:radio3}）で、短く、はっきり。</li></ol>
<p>そして、<b>操縦が最優先</b>です（Aviate → Navigate → Communicate）。無線に気を取られて高度や速度を外すのは本末転倒。忙しいときは「Stand by」（少し待って）と言ってよい。</p>
<h3>学生操縦士であることを伝える</h3>
<p>AIM 4-2-4 は、混雑した空域で手助けを受けるため、学生操縦士は最初の呼び出しで <b>“student pilot”</b> と名乗ることを勧めています（例：「Dayton tower, Fleetwing One Two Three Four, <b>student pilot</b>.」）。管制官はゆっくり話したり、指示を丁寧にしたりしてくれます。クリアランス・地上・管制塔・出発／進入管制のそれぞれ最初の交信で言うのがよい、とされています。</p>
${bk.key('「聞く」が 7 割。周波数を聞いていれば、自分の番・混み具合・ほかの機の位置がわかる', 'student pilot と名乗るのは恥ずかしいことではなく、安全のための決まった方法')}` },
      { id: 'radio.listen', t: '日本語話者のための聞き取りのコツ', h: () => `
<p>英語の交信は速く、雑音もあります。けれど<b>言う内容の型は決まっている</b>ので、型を知っていれば聞き取れる量が大きく増えます。（この節は教材としての学習のコツです。）</p>
${bk.t(['コツ', 'やり方'], [
  ['① まずコールサインだけを聞く', '交信は「相手のコールサイン → 指示」の順。自分のコールサイン（Archer Seven Lima Alpha）が聞こえたら、そこから全集中。ほかの機の指示は聞き流してよいが、自分に関係する交通（同じ滑走路など）は頭に入れる'],
  ['② 次に来る言葉を予想する', 'タキシーなら「滑走路・経路・hold short」、離陸なら「滑走路・風・cleared for takeoff」、到着なら「入り方・報告点・順番」。予想があると、聞き逃した部分を「Say again」で正確に聞き直せる'],
  ['③ 数字は書き取る', 'ひざ板（kneeboard）やメモに、聞いた順に書く。周波数・コード・高度・針路は記憶に頼らない'],
  ['④ 紛らわしい言葉を知っておく', 'two（2）と to・too、four（4）と for、left と right（L と R の発音）、hold short（手前で止まる）と hold position（その場で止まる）。管制は 15 を「one five」と 1 桁ずつ言うので「fifteen / fifty」の混同は起きにくい'],
  ['⑤ わからなければ聞き直す', '推測で動かない。「Say again」。速すぎるなら「Say again, slowly」と添えてよい。自分宛てか不安なら「Verify, was that for Archer Seven Lima Alpha?」'],
  ['⑥ 声に出して練習する', 'この教材の「英語交信」ページの台本を、音声に合わせて同時に言う（シャドーイング）。椅子に座って 1 回の飛行の交信を最初から最後まで言ってみる']])}
${bk.sim('英語交信のページで、1 回の飛行の交信を音声つきで最初から最後まで聞けます（メニュー → 英語交信）。', ['t2', '場周経路'])}` },
    ],
    terms: [['Radiotelephony', '無線電話（音声の交信）', ''], ['Air traffic control (ATC)', '航空交通管制', ''], ['ATIS', '飛行場情報の自動放送', ''], ['Clearance Delivery', '出発許可の伝達', ''], ['Ground / Tower', '地上管制・飛行場管制', ''], ['Departure / Approach', '出発管制・進入管制', 'レーダー'], ['Center', '航空路管制', ''], ['Flight Service Station (FSS) / "Radio"', '飛行情報業務', ''], ['PTT (push-to-talk)', '送信ボタン', ''], ['Stuck mike', '押しっぱなしのマイク', ''], ['Audio panel', 'オーディオパネル', ''], ['Student pilot', '学生操縦士（最初の交信で名乗る）', 'AIM 4-2-4']],
    examples: ['離陸前、周波数を Tower に変えた → 先に 5 秒ほど聞いて、誰も話していないこと・管制官の質問の途中でないことを確かめてから「LAB Tower, Archer Seven Lima Alpha, holding short runway three six, ready for departure」。', '返事がない → 音量・周波数・MIC の選択・スタックマイクを確認 → もう一度、短く呼ぶ。'],
    cautions: ['この章の周波数・LAB 空港・コールサインは架空の練習用。実際の周波数は最新のチャート・Chart Supplement で確認する。', 'この教材は実際の管制にはつながらず、音声を送信しない。'],
    quiz: [
      { q: '周波数を変えた直後にまずすることは？（AIM 4-2-2）', choices: ['すぐに呼び出す', '少し聞いて、誰も話していないことを確かめる', '音量を下げる', 'トランスポンダーを 7600 にする'], answer: 1, why: 'Listen before you transmit。直後はほかの交信の途中かもしれない。割り込むと相手の受信をふさぐ。' },
      { q: '着陸して滑走路を出たあと、地上走行の指示をもらう相手は？', choices: ['ATIS', 'Ground', 'Departure', 'Center'], answer: 1, why: '地上（誘導路）の移動は Ground。ただし管制塔に「contact ground」と言われてから切り替える（AIM 4-3-21）。' },
      { q: 'AIM が学生操縦士に勧めている名乗り方は？', choices: ['最初の交信で "student pilot" と言う', '交信の最後に "over" と言う', '名乗らない', 'コールサインを省略する'], answer: 0, why: 'AIM 4-2-4：最初の呼び出しで student pilot と名乗ると、管制官が必要な手助けをしてくれる。' },
    ],
    refs: [R.aim42, R.aim43, R.pcg, R.ana1], lessons: ['t1', 't2'] });

  // ======================================================================= radio 2
  B.add({ id: 'radio2', before: 'hf', part: 'p1', t: '言葉の決まり：アルファベット・数字・標準用語', en: 'Standard words: the phonetic alphabet, numbers and phraseology',
    summary: 'フォネティックアルファベットと数字の発音、高度・針路・速度・周波数・時刻・高度計規正値・コードの言い方、コールサインの決まり、標準用語（Roger・Wilco・Say again など）の正しい意味。',
    secs: [
      { id: 'comm.basic', t: 'フォネティックアルファベットと数字の発音', h: () => `
<p>雑音の中でも 1 文字ずつ確実に伝えるため、文字は ICAO のフォネティックアルファベットで言います。最初の交信のコールサイン、1 文字だけの言葉、聞き取りにくい言葉のつづりに使います（AIM 4-2-7）。発音は AIM の表の読み方とカタカナの目安です。</p>
${bk.t(['文字', '言い方', '発音（AIM）', '目安'], [
  ['A', 'Alfa', 'AL-FAH', 'アルファ'], ['B', 'Bravo', 'BRAH-VOH', 'ブラボー'], ['C', 'Charlie', 'CHAR-LEE / SHAR-LEE', 'チャーリー'], ['D', 'Delta', 'DELL-TAH', 'デルタ'],
  ['E', 'Echo', 'ECK-OH', 'エコー'], ['F', 'Foxtrot', 'FOKS-TROT', 'フォックストロット'], ['G', 'Golf', 'GOLF', 'ゴルフ'], ['H', 'Hotel', 'HOH-TEL', 'ホテル'],
  ['I', 'India', 'IN-DEE-AH', 'インディア'], ['J', 'Juliett', 'JEW-LEE-ETT', 'ジュリエット'], ['K', 'Kilo', 'KEY-LOH', 'キロ'], ['L', 'Lima', 'LEE-MAH', 'リーマ'],
  ['M', 'Mike', 'MIKE', 'マイク'], ['N', 'November', 'NO-VEM-BER', 'ノベンバー'], ['O', 'Oscar', 'OSS-CAH', 'オスカー'], ['P', 'Papa', 'PAH-PAH', 'パパ'],
  ['Q', 'Quebec', 'KEH-BECK', 'ケベック'], ['R', 'Romeo', 'ROW-ME-OH', 'ロミオ'], ['S', 'Sierra', 'SEE-AIR-RAH', 'シエラ'], ['T', 'Tango', 'TANG-GO', 'タンゴ'],
  ['U', 'Uniform', 'YOU-NEE-FORM', 'ユニフォーム'], ['V', 'Victor', 'VIK-TAH', 'ビクター'], ['W', 'Whiskey', 'WISS-KEY', 'ウィスキー'], ['X', 'X-ray', 'ECKS-RAY', 'エックスレイ'],
  ['Y', 'Yankee', 'YANG-KEY', 'ヤンキー'], ['Z', 'Zulu', 'ZOO-LOO', 'ズールー']])}
${bk.t(['数字', '1', '2', '3', '4', '5', '6', '7', '8', '9', '0'], [['発音（AIM）', 'WUN', 'TOO', 'TREE', 'FOW-ER', 'FIFE', 'SIX', 'SEV-EN', 'AIT', 'NIN-ER', 'ZEE-RO']])}
<p><b>9 は「niner」</b>（ドイツ語の nein と区別するため、と説明されることが多い）。<b>3 は「tree」、5 は「fife」</b>のように、雑音の中でも区別しやすい発音にしています。</p>
${bk.key('最初の交信ではコールサインをフォネティックで全部言う', '数字は原則 1 桁ずつ（10 は one zero）')}` },
      { id: 'comm.numbers', t: '数字の言い方：高度・針路・速度・周波数・時刻・コード', h: () => `
${bk.t(['種類', '書き方', '言い方', '決まり（出典）'], [
  ['一般の数字', '10', 'one zero', '1 桁ずつ（AIM 4-2-8）'],
  ['高度（9,900 ft まで）', '500 / 4,500', 'five hundred / four thousand five hundred', '「千・百」で言う（AIM 4-2-8）'],
  ['高度（10,000 ft 以上）', '10,000 / 13,500', 'one zero thousand / one three thousand five hundred', '千の位より上は 1 桁ずつ（AIM 4-2-8・4-2-9）'],
  ['フライトレベル（18,000 ft 以上）', 'FL190', 'flight level one niner zero', '米国は 18,000 ft から（AIM 4-2-9）'],
  ['針路・方位・コース', '090 / 005', 'heading zero niner zero / zero zero five', '3 桁・磁方位（真方位なら “true” を付ける）（AIM 4-2-10）'],
  ['風', '220° 15 kt / 2 kt', 'wind two two zero at one five / wind calm', '風向は 3 桁・磁方位（AIM 4-2-10）。管制の型は “wind (風向) at (風速)”、3 kt 未満は “calm”（JO 7110.65）'],
  ['速度', '120 kt', 'one two zero knots', '1 桁ずつ＋knots（AIM 4-2-11）'],
  ['周波数', '121.7 / 119.75', 'one two one point seven / one one niner point seven five', '小数点は “point”（ICAO は “decimal”）（AIM 4-2-8）'],
  ['地上管制の周波数（121 MHz 台）', '121.7', 'ground point seven', '管制官が 121 を省くことがある（AIM 4-3-14）'],
  ['高度計規正値', '29.92 inHg', 'altimeter two niner niner two', '1 桁ずつ'],
  ['トランスポンダーのコード', '4271', 'squawk four two seven one', '1 桁ずつ'],
  ['時刻', '14:30 UTC', 'one four three zero Zulu', 'FAA は UTC を使う。フロリダの標準時（EST）は UTC−5、夏時間（EDT）は UTC−4（AIM 4-2-12）'],
  ['滑走路', '36 / 9R / 27C', 'runway three six / runway niner right / runway two seven center', '1 桁ずつ＋left / right / center'],
  ['距離・時計の方位', '5 NM・2 時の方向', 'five miles / two o\'clock', '時計の方位は機首（12 時）が基準'],
  ['航空路', 'V12', 'Victor twelve', 'AIM 4-2-8']])}
${bk.key('高度だけは「thousand・hundred」を使う。ほかの数字は 1 桁ずつ', '針路は必ず 3 桁（heading zero niner zero）。090 を「ninety」と言わない')}
${bk.q('“Climb and maintain one zero thousand five hundred” は何 ft？', '10,500 ft。10,000 ft 以上は千の位より上を 1 桁ずつ（one zero）言う。')}` },
      { id: 'comm.callsign', t: 'コールサインの決まり', h: () => `
<ul><li><b>最初の交信では省略しない</b>：機種名・型式名またはメーカー名のあとに登録記号の数字と文字。機種名を言うときは<b>先頭の N を省く</b>（例：Bonanza Six Five Five Golf）（AIM 4-2-4）。この教材の「Archer Seven Lima Alpha」は架空。</li>
<li><b>省略は管制官から</b>：交信が確立したあと、管制官が「機種名＋最後の 3 文字」に省略して呼んだら、パイロットもそれを使ってよい（AIM 4-2-4）。例：「Archer Seven Lima Alpha」→「Archer Seven Lima Alpha（3 文字なのでそのまま）」、「Cessna One Two Three Four Five」→「Cessna Three Four Five」。</li>
<li><b>似たコールサインがいるとき</b>は省略しない。自分への指示か疑わしいときは「<b>Verify clearance for</b>（完全なコールサイン）」（AIM 4-2-4）。似たコールサインの取り違えは、ほかの機への許可を自分のものとして実行してしまう事故につながる。</li>
<li><b>エアライン</b>は会社の呼出符号と便名を「まとまった数」で言う（例：United Twenty-Five Heavy。ANA の呼出符号は “All Nippon”）。</li></ul>
${bk.key('コールサインは「誰への交信か」を決める一番大切な部分。最初は省略しない', '省略してよいのは、管制官が先に省略してから')}` },
      { id: 'comm.words', t: '標準用語の正しい意味（Pilot/Controller Glossary）', h: () => `
<p>FAA の Pilot/Controller Glossary（PCG）は、管制官の方式基準（JO 7110.65）と同じ用語集です。意味をまちがえると事故になるものがあります。</p>
${bk.t(['用語', '意味（PCG の定義の要約）', '使い方の注意'], [
  ['Roger', '最後の送信を全部受信した', '<b>「はい」の意味ではない</b>。はい / いいえで答える質問に Roger は使わない'],
  ['Wilco', '受信し、理解し、従う（will comply）', '滑走路・高度・針路の指示には Wilco ではなく<b>内容を復唱</b>する'],
  ['Affirmative / Negative', 'はい / いいえ（Negative は「許可しない」「それは違う」も）', '「Yes / No」より聞き取りやすい'],
  ['Say again', '直前の送信をもう一度（部分なら “say again all after …”）', '聞き取れないときは推測せずに使う'],
  ['Stand by', '少し待って（「許可」でも「不許可」でもない）', '待つ時間が長ければ、もう一度呼んでよい'],
  ['Unable', '指示・要求・許可に従えない', '理由（雲・性能など）や代わりの案を添える'],
  ['Verify', '確認してください', '例：Verify assigned altitude'],
  ['Correction', '言いまちがえた。正しくは次のとおり', '自分の言いまちがいを直すとき'],
  ['Read back', '私の言ったことを復唱して', '管制官から言われたら全部を復唱'],
  ['I say again / Words twice', 'もう一度言う / 交信状態が悪いので各句を 2 回言って（言う）', ''],
  ['Immediately / Expedite', '直ちに（危険を避けるため）/ 速やかに', 'Immediately は今すぐ動く'],
  ['Go ahead', 'どうぞ話して（PCG：ほかの意味に使わない）', '「どうぞ進んで」の意味ではない'],
  ['Over / Out', '送信終わり・返事を待つ / 交信終わり・返事不要', 'ふつうの管制交信ではほとんど使わない。“Over and out” は矛盾'],
  ['Contact / Monitor', '交信を始めよ / 聞いて待て（こちらからは呼ばない）', 'Monitor と言われたら呼び出さない'],
  ['Traffic in sight / Negative contact', '言われた他機が見えた / 見えない', '見えるまで探す。見えなければ Negative contact'],

  B.add({ id: 'radio3', before: 'hf', part: 'p1', t: '交信の型：呼び出し・応答・復唱', en: 'How a call is built: initial contact, acknowledgement and readback',
    summary: '最初の呼び出しの型、管制官の呼び出しへの応え方、周波数の変更、復唱しなければならないもの・しなくてよいもの、わからないとき・従えないときの言い方、よくある間違い。',

<p>AIM 4-2-3 の決まった順番：</p>
<ol><li><b>相手の局の名前</b>（LAB Ground）</li><li><b>自分のコールサイン（省略しない）</b>（Archer Seven Lima Alpha）</li><li><b>地上ではいる場所</b>（at the west ramp）</li><li><b>要求（短ければ）</b>（request taxi）</li><li>必要なら “Over”（ふつうは省く）</li></ol>
<p>覚え方：<b>Who you are calling → Who you are → Where you are → What you want</b>。ATIS を聞いたら “<b>with information Bravo</b>” を入れる（AIM 4-1-13）。AIM の例：</p>

${fic}
<h3>混んでいるとき</h3>
<p>周波数が混んでいて、相手が自分の呼び出しを聞けるか分からないときは、まず短く呼ぶ（「LAB Approach, ${CS}」）。管制官が「${CS}, LAB Approach」と応えたら、要求を言う。受信が確かなら最初から要求まで言う方が周波数の節約になる（AIM 4-2-3）。</p>
<h3>管制官から呼ばれたとき・周波数を変えるとき</h3>
<ul><li>すべての呼び出し・許可に応答する。コールサインを最初か最後に付けて、Wilco・Roger・Affirmative・Negative など（AIM 4-2-3）。</li>
<li>周波数を変えるよう言われたら<b>必ず応答してから</b>変える（黙って変えると、管制官には無線の故障と区別できない）。そしてできるだけ早く変える（AIM 4-2-3）。</li>
<li><b>Contact</b>（交信せよ）なら新しい周波数で呼び出す。<b>Monitor</b>（聞いて待て）なら呼び出さずに聞く（PCG）。</li></ul>
<h3>Class C 空域に入る前の「交信の確立」</h3>
<p>Class C は入る前に双方向の交信を確立する必要があります（{ch:law}）。AIM 3-2-4：管制官が<b>こちらのコールサインを言って</b>「${CS}, stand by」と応えたら確立（入ってよい）。<b>コールサインなし</b>の「Aircraft calling LAB Approach, stand by」は確立していない。「remain outside Charlie airspace and stand by」なら外で待つ（JO 7110.65）。</p>
${bk.key('最初の呼び出し：相手 → 自分 → 場所 → 要求（＋ATIS の記号）', '周波数の変更は「応答してから」変える', 'Class C：コールサイン付きの応答があれば交信確立')}` },

<p>復唱は、聞きまちがい・言いまちがいを<b>その場で見つける</b>ための二重確認です。AIM の決まり：</p>

${say([
  ['Ground', `${CSS}, runway three six, taxi via Alpha, hold short of taxiway Charlie.`, '滑走路 36 へ、誘導路 A 経由で地上走行。誘導路 C の手前で止まれ。'],

  ['P', `One one niner point seven five, ${CSS}.`, '（周波数を復唱して応答してから変える）']])}
<h3>復唱しなくてよいもの（内容で応える）</h3>
${bk.t(['管制官', 'あなた'], [

${bk.key('数字（高度・針路・周波数・コード）と滑走路は必ず復唱。「Roger」だけでは足りない', '言われた順に、最後にコールサイン')}` },
      { id: 'comm.clarify', t: 'わからないとき・従えないとき', h: () => `
${bk.t(['場面', '言い方', 'ポイント'], [
  ['聞き取れなかった', '“Say again, ' + CSS + '.”／一部だけなら “Say again all after Charlie.”', '推測で復唱・行動しない（PCG）'],
  ['自分宛てか分からない', '“Verify clearance for Archer Seven Lima Alpha.”', '似たコールサインに注意（AIM 4-2-4）'],
  ['経路が分からない', '“Request progressive taxi.”', '一区間ずつ案内してもらえる（AIM 4-3-18）'],

  B.add({ id: 'radio4', before: 'hf', part: 'p1', t: '1 回の飛行の交信：出発から到着まで', en: 'A whole flight on the radio: from the ramp to the ramp',
    summary: '管制塔とレーダー管制のある空港（Class C を想定した架空の LAB）で、ATIS → 地上 → 管制塔 → 出発管制 → 訓練空域 → 進入管制 → 管制塔（場周・着陸）→ 地上 までの全部の交信を、日本語の意味と理由つきで順に。',
    secs: [
      { id: 'comm.atis', t: '① ATIS を聞いて書き取る', h: () => `
<p>ATIS は、ふつうの情報を録音で繰り返し流して管制の周波数の混雑を減らす放送です（AIM 4-1-13）。内容：空港名・<b>情報の記号（Alpha, Bravo…）</b>・観測時刻（UTC）・風・視程・天気・雲・気温・露点・<b>高度計規正値</b>・使用滑走路・注意事項。雲高 5,000 ft 以上・視程 5 SM 以上なら雲と視程は省くことがある。</p>
${say([['ATIS', 'LAB information Bravo. One four five three Zulu. Wind three four zero at eight. Visibility one zero. Few clouds at three thousand five hundred. Temperature three one, dew point two two. Altimeter three zero zero one. Landing and departing runway three six. Advise on initial contact you have information Bravo.', 'LAB の情報 B。14:53 UTC。風 340° 8 kt。視程 10 SM。3,500 ft に少しの雲。気温 31℃・露点 22℃。高度計 30.01。使用滑走路 36。最初の交信で B を聞いたと伝えよ。']])}
${bk.t(['書き取る欄（ひざ板の例）', '値'], [['記号', 'B'], ['風', '340/08'], ['視程・雲', '10・FEW035'], ['温度・露点', '31/22'], ['高度計', '30.01 → すぐ合わせる'], ['滑走路', '36']])}
<p>最初の交信で “<b>with information Bravo</b>” と言うと、管制官は ATIS の内容を繰り返さなくてよくなる（AIM 4-1-13）。“have numbers”（風・滑走路・高度計だけ聞いた）は ATIS を聞いた意味にはならない。</p>
${fic}` },
      { id: 'comm.dep', t: '② 地上：タキシーの許可（出発周波数とコードも）', h: () => `
<p>出発する機は、エンジン始動前後に地上管制（または Clearance Delivery）と交信し、タキシーとランナップの間はその周波数にいて、<b>離陸の準備ができたら管制塔に変える</b>（AIM 4-3-14）。レーダー業務を受ける VFR 機には、離陸前に<b>出発周波数とトランスポンダーのコード</b>が伝えられる（JO 7110.65：“departure frequency …, squawk …”）。</p>
${say([
  ['P', `LAB Ground, ${CS}, student pilot, at the west ramp with information Bravo, VFR to the northeast practice area at three thousand five hundred, request taxi.`, '（相手・自分・場所・ATIS・行き先と高度・要求）'],
  ['Ground', `${CS}, LAB Ground, runway three six, taxi via Alpha, hold short of taxiway Charlie. Departure frequency one one niner point seven five, squawk four two seven one.`, '滑走路 36 へ。誘導路 A 経由、誘導路 C の手前で止まれ。出発管制 119.75、コード 4271。'],
  ['P', `Runway three six, taxi via Alpha, hold short of Charlie, departure one one niner point seven five, squawk four two seven one, ${CSS}.`, '（滑走路・経路・手前停止・周波数・コードを言われた順に）'],
  ['Ground', `${CSS}, continue via Alpha to runway three six.`, '誘導路 A をそのまま滑走路 36 へ。'],
  ['P', `Continue via Alpha to runway three six, ${CSS}.`, '']])}
${bk.warn('「Runway three six, taxi via Alpha」は滑走路 36 の<b>手前まで</b>行ってよいという意味で、<b>滑走路に入ってよい・横切ってよいという意味ではない</b>（AIM 4-3-18）。滑走路の手前の停止線（黄色の実線と破線）で必ず止まる。地上走行の指示に “cleared” という言葉は使われない。')}
<p>ランナップ（{ch:ground}）は滑走路の近くの決められた場所で。終わったら滑走路の手前で管制塔に変える。</p>` },

  ['Tower', `${CS}, LAB Tower, runway three six, line up and wait. Traffic, a Cessna on five mile final.`, '滑走路 36 に入って待て。5 マイルの最終進入に Cessna。'],
  ['P', `Runway three six, line up and wait, ${CSS}.`, '（離陸許可ではない。滑走路に入り、センターラインに合わせて止まる）'],
  ['Tower', `${CS}, runway three six, wind three four zero at eight, cleared for takeoff. Fly runway heading. Traffic, a Cessna on four mile final.`, '滑走路 36、風 340° 8 kt、離陸を許可。滑走路の方位を保って上昇せよ。4 マイルの最終進入に Cessna。'],
  ['P', `Runway three six, cleared for takeoff, fly runway heading, ${CSS}.`, '（滑走路＋cleared for takeoff＋追加の指示）'],
  ['Tower', `${CS}, contact departure.`, '出発管制と交信せよ（周波数はタキシー前にもらった 119.75）。'],
  ['P', `Contact departure, ${CSS}.`, '']])}
<ul><li>LUAW と離陸許可のときには、同じ滑走路の最終進入（6 マイル以内）にいる一番近い機が伝えられる（JO 7110.65 3-9-4・3-9-10）。</li>
<li>LUAW は「すぐ離陸させたいが、まだ許可を出せない」ときの指示（AIM 5-2-5）。管制方式では LUAW のまま 90 秒を超えて待たせないことになっている（JO 7110.65）。理由（着陸機など）がなくなったのに何も言われないときは確認する。</li>

<li>管制官は、パイロットが知っていると思えば周波数を省くことがある（AIM 4-3-14）。分からなければ聞く。</li></ul>
${bk.sim('課目「通常離陸と上昇」は、この離陸許可の復唱から始まります。', ['t1', '通常離陸と上昇'])}` },

    summary: 'CTAF での自己通報、トランスポンダーと MAYDAY・PAN-PAN、無線が使えないときの手順と灯火信号、Sanford で気をつけること、英国（ICAO）との言い方の違い、上達の練習法。',

      { id: 'comm.ctaf', t: '管制塔のない空港：CTAF で自己通報', h: () => `
<p>管制塔のない空港（または管制塔が閉まっている時間）では、全員が<b>共通の周波数（CTAF）</b>で、自分の位置と意図を知らせ合います（AIM 4-1-9）。CTAF は UNICOM・MULTICOM（122.9）・時間外の管制塔の周波数などで、チャートと Chart Supplement に載っています。</p>

<ul><li><b>空港名を最初と最後に</b>言う（近くの別の空港も同じ周波数を使うことがある）。</li>
<li>“active runway” ではなく<b>滑走路の番号</b>を言う。</li>
<li>“Traffic in the area, please advise” は決まった言い方ではなく、使わない（AIM 4-1-9）。</li>
<li>10 マイル以内では CTAF を聞く。VFR の直進着陸（straight-in）は空中衝突の危険が増えるので FAA は勧めていない（AIM 4-1-9）。</li></ul>` },
      { id: 'comm.xpdr', t: 'トランスポンダー・MAYDAY と PAN-PAN', h: () => `
${bk.t(['コード', '意味'], [['1200', 'VFR（管制から指定がないとき）'], ['7700', '緊急'], ['7600', '無線の故障'], ['7500', 'ハイジャック（不法な干渉）']])}
<p>AIM 6-1-2：<b>位置・燃料・天気などに不安を感じた時点で、少なくとも「緊急（urgency）」の状態</b>です。危険になってからではなく、<b>その時に助けを求める</b>。「遅れが事故を起こしてきた」と AIM は書いています。</p>
${bk.t(['', '遭難（distress）', '緊急（urgency）'], [['意味', '重大な危険が迫り、直ちに助けが必要', '直ちにではないが、安全に関わる状態'], ['言葉', '<b>MAYDAY</b> を 3 回', '<b>PAN-PAN</b> を 3 回'], ['優先', 'すべての交信より優先。その周波数は静かにする', '遭難以外より優先']])}
<p><b>伝える順番</b>（AIM 6-3-2。必要なものを、できればこの順に）：①MAYDAY ×3 / PAN-PAN ×3 ②相手の局 ③コールサインと機種 ④状況 ⑤天気 ⑥意図と要求 ⑦現在位置と針路（迷ったら最後に分かった位置・時刻・針路） ⑧高度 ⑨残りの燃料（分） ⑩乗っている人数 ⑪その他。</p>
${say([['P', `Mayday, Mayday, Mayday, LAB Tower, ${CS}, Piper Archer, engine failure, landing in a field five miles north of LAB, two thousand feet, two persons on board.`, '遭難。LAB 管制塔へ。Archer 7LA、パイパー・アーチャー。エンジン故障。LAB の北 5 マイルの畑に着陸する。2,000 ft。搭乗 2 名。'],

<ul><li>ふだん使っている周波数でよい。つながらなければ <b>121.5 MHz</b>（緊急周波数）や “<b>Any station</b>” への呼びかけ（AIM 6-3-1）。</li>

<h3>管制塔の灯火信号（AIM 4-3-13）</h3>
${bk.t(['信号', '地上の航空機', '飛行中の航空機'], [['緑の連続', '離陸してよい', '着陸してよい'], ['緑の点滅', 'タキシーしてよい', '着陸のために戻れ（後で緑の連続）'], ['赤の連続', '止まれ', '他機に進路を譲り、旋回を続けよ'], ['赤の点滅', '使用中の滑走路から出よ', '空港は危険、着陸するな'], ['白の点滅', '出発点に戻れ', '—'], ['赤と緑の交互', '十分に注意せよ', '十分に注意せよ']])}

      { id: 'comm.sfb', t: 'Sanford（KSFB）で気をつけること', h: () => `
<p>FAA の「From the Flight Deck: Sanford」は、次のことを説明しています。</p>
<ul><li>訓練生から旅客機まで経験の違う多くの操縦者が同じ空港を使う。</li>
<li>9L/27R・9C/27C・9R/27L の平行滑走路と、交差する 18/36。<b>滑走路の取り違え</b>が起きやすい。</li>
<li>Hot Spot HS1：誘導路 C と滑走路 27C の取り違え（滑走路 18 から出て誘導路 C へ右折するはずが 27C へ）。</li>
<li>Line Up and Wait を使う。<b>滑走路の指定・誘導路・hold short の指示は、コールサイン付きで同じ送信の中で復唱</b>する。足りなければ言い直しを求められる。</li>
<li>空域は Class C、その上に Orlando の Class B。訓練の場周は upwind・crosswind・base を約 1 マイルで。</li></ul>
${bk.key('平行滑走路では L・C・R まで復唱し、入る前に標識と方位で確かめる', '詳しくはメニューの「Sanford の資料」と「英語交信」の練習へ')}` },
      { id: 'comm.icao', t: 'FAA と ICAO（英国）の言い方の違い・上達の練習法', h: () => `
<p>公開情報では、ANA の座学はロンドンで英語で行い、航空管制通信のシミュレーションもあります。英国の無線の言い方は ICAO に沿った英国の手引き（CAA の <b>CAP 413</b>）にまとめられています。米国（FAA）の言い方と違うところがあるので、両方を知っておくと混乱しません（どちらで教わるかは<span class="tag unk">推測・要確認</span>）。代表的な例：</p>
${bk.t(['', 'FAA（米国：AIM・PCG）', 'ICAO・英国'], [
  ['小数点', 'point（one two one point seven）', 'decimal（AIM 4-2-8 の注記）'],
  ['高度計規正値', 'altimeter two niner niner two（inHg）', 'QNH one zero one three（hPa）'],
  ['はい', 'affirmative', 'affirm'],
  ['「どうぞ話して」', 'go ahead', 'pass your message'],
  ['滑走路の手前の待機', 'hold short of runway …', 'holding point（taxi to holding point runway …）'],
  ['フライトレベルに変わる高度', '18,000 ft（全国共通）', '英国は空域ごとに決められていて、ずっと低い']])}
<p>どちらでも共通：フォネティックアルファベット、数字の発音（niner など）、MAYDAY・PAN-PAN、line up and wait、復唱の考え方。</p>
<h3>上達の練習法（この教材の使い方）</h3>
<ol><li><b>型を覚える</b>：この部の表を見ずに、最初の呼び出しと復唱を言えるようにする。</li>
<li><b>台本で声に出す</b>：「英語交信」ページの「1 回の飛行」を音声に合わせて言う。次にパイロットの言葉を隠して、自分で言ってから答えを見る。</li>
<li><b>数字の練習</b>：同じページの「数字とアルファベット」と「聞き取り」で、聞いて書き取る。</li>
<li><b>本物を聞く</b>：インターネットで公開されている管制交信のライブ配信（例：LiveATC.net）を、空港図とチャートを見ながら聞く。</li>
<li><b>チェアフライング</b>：椅子に座り、1 回の飛行の交信と操作を最初から最後まで声に出す。</li></ol>` },

  // ======================================================================= 9
  B.add({ id: 'ground', part: 'p2', t: '飛行前の準備・点検・地上での操作', en: 'Preflight, engine start, taxi and run-up',
    summary: '機体の外部点検、エンジン始動、タキシー、ランナップ（エンジンの試運転）、離陸前の確認とブリーフィング。毎回同じ順番で、チェックリストを使う。',
    secs: [
      { id: 'ground.walk', t: '外部点検（walk-around）', h: () => `
<p>飛ぶ前に、機体の周りを決まった順番で一周して、飛べる状態かを自分の目と手で確かめます。訓練校の Archer のチェックリストでは、<b>操縦席の中 → 右翼 → 機首 → 左翼 → 胴体と尾翼</b>の順です。</p>
${bk.t(['場所', '主な確認（訓練校の Archer III チェックリストより）', 'なぜ'], [
  ['操縦席', '書類が機内にある・操縦輪が自由・パーキングブレーキ・スイッチ OFF・ミクスチャー IDLE CUT-OFF・マグネトー OFF → バッテリー ON で燃料計・灯火・ピトーヒーター・失速警報を確認 → OFF・フラップを下げる・トリム中立', '電源を入れて灯火やヒーターを確かめ、外で触って温かいかを見る。フラップは下げておくと外から点検できる'],
  ['翼（左右）', '表面に氷・霜・雪がない・フラップとエルロンの動きと取り付け・燃料タンクを目で見て量を確認しキャップを締める・<b>燃料のサンプを抜く（水・異物・燃料の種類）</b>・通気口・主脚の緩衝支柱（約 4.5 in）・タイヤ・ブレーキ', '翼の表面の霜でも揚力は大きく減る。燃料に水が混ざるとエンジンが止まる'],
  ['機首', 'カウリング・風防・<b>エンジンオイル（その訓練校の最少 6 qt）</b>・プロペラとスピナー・空気取り入れ口・前脚（約 3.25 in）・燃料ストレーナーのドレイン', 'プロペラの傷は回転中に割れる原因。オイル不足はエンジン故障の原因'],
  ['ピトー・尾翼', 'ピトー管のカバーを外し穴がふさがっていない・アンテナ・スタビレーター（全体が動く水平尾翼）とトリムタブ・ラダー・係留ロープを外す', 'ピトー管がふさがると速度計が働かない（{ch:sys}）']])}
${bk.key('チェックリストは「読んで・やって・確かめる」。記憶だけで済ませない', '燃料は燃料計だけを信じず、タンクを目で見て確かめる（14 CFR 91.103：飛行前に必要な情報を知る）', '数値（オイルの量・支柱の長さ）はその機体の POH と訓練校の決まりが優先')}
${bk.warn('サンプを抜いた燃料に水（燃料より重く、底にたまる玉）や異物があれば、なくなるまで抜く。なくならなければ飛ばない。Archer の燃料は 100LL（青色）。')}` },
      { id: 'ground.start', t: 'エンジン始動とタキシー', h: () => `
<p><b>始動の前</b>：座席・ベルト・ブレーキ・ブレーカー・燃料セレクター（使うタンク）・同乗者への安全説明。G1000 機では非常用バッテリー（EMERG BATT）を ARM にして予備計器と PFD が動くことを確かめてから、バッテリーマスターを ON。</p>
<p><b>始動</b>（キャブレター式の例）：オルタネーター ON・電動燃料ポンプ ON・マグネトー ON・衝突防止灯 ON・スロットル 1/4 インチ開・ミクスチャー全開（FULL RICH）・必要ならプライマー・<b>「Prop clear!」と叫んで周りに人がいないことを確かめる</b>・スターター。かかったら 1,000 rpm にして<b>油圧が上がるのを確認</b>（上がらなければすぐ止める）。</p>
<p><b>始動後</b>：800〜1,200 rpm・アビオニクス ON・燃料ポンプ OFF（エンジン駆動ポンプだけで動くか確かめる）・無線と計器の設定・トランスポンダー GROUND。</p>
<p><b>タキシー</b>：周りを確かめ、パーキングブレーキを外し、スロットルをゆっくり。動き出したらすぐブレーキを試す。人が歩く程度の速さで、<b>前輪の向きはラダーペダルで</b>変える（Archer は前輪がペダルとつながっている）。曲がりながら旋回計と方位が正しく動くか（計器のチェック）も見る。</p>
${bk.t(['風', 'タキシー中の操縦輪（AFH・PHAK の一般的な目安）'], [['前から（向かい風）', 'エルロンは風上側へ（風上の翼を下げる向き）、昇降舵は中立'], ['後ろから（追い風）', 'エルロンは風下側へ、昇降舵は前へ（尾翼を押さえる）'], ['覚え方', '「向かい風には向かって登る、追い風からは離れて降りる」（climb into, dive away）']])}
${bk.key('スロットルで速さ、ブレーキは止まるため。スロットルを開けたままブレーキで速さを調節しない', '地上で迷ったら止まって管制に確かめる（"Say again" は恥ずかしくない）。滑走路の手前の停止線（hold short line）は管制の許可なしに越えない')}
${bk.warn('始動時のエンジン火災：スターターを回し続けて火を吸い込ませる・ミクスチャー IDLE CUT-OFF・スロットル全開・燃料ポンプ OFF・燃料セレクター OFF。消えなければ機体から離れる（訓練校チェックリストの手順。機体ごとに POH を確認）。')}` },
      { id: 'ground.runup', t: 'ランナップと離陸前の確認', h: () => `
<p>滑走路の手前の試運転場所（run-up area）で、風上に機首を向けて止まり、エンジンと計器を確かめます。</p>
${bk.t(['項目', '訓練校の Archer チェックリスト', '何を見ているか'], [
  ['回転', 'ブレーキを踏んでパーキングブレーキ・ミクスチャー全開・2,000 rpm', ''],
  ['マグネトー', '左だけ・右だけにして回転の落ちを見る。<b>最大 175 rpm の低下・左右の差 50 rpm 以内</b>', '点火系統が 2 つとも働くか。落ちがゼロ（切っても落ちない）も異常（スイッチの故障）'],
  ['キャブレターヒーター', 'ON にして回転が少し落ちる（約 75 rpm）ことを確かめ OFF', '熱い空気は薄いので出力が落ちる＝ヒーターが働いている'],
  ['計器', '電流計・油温・油圧・燃料圧・警報灯のテスト', '緑の範囲'],
  ['アイドル', 'スロットルをアイドルにして止まらないか → 1,000 rpm', '着陸の進入でエンジンが止まらない'],
  ['操縦', '操縦輪・ペダルが自由で正しい方向に動く・トリム中立', '逆に動くのは整備の間違い。最も危険な見落とし'],
  ['離陸前', '燃料は多い方のタンク・燃料ポンプ ON・灯火 ON・フラップ・トリム・ドアと窓の閉・離陸ブリーフィング', '']])}
<h3>離陸ブリーフィング（声に出す）</h3>
<p>例：「滑走路 36、フラップ 0°、${AR.rotate} kt でローテーション、${AR.y} kt で上昇。<b>滑走中に異常があればスロットルを閉じてまっすぐ止まる。浮揚後に滑走路が残っていれば降りる。残っていなければ正面 ±30° 以内に降りる場所を選ぶ。引き返さない。</b>」</p>
${bk.key('ブリーフィングは「起きたら何をするか」を、起きる前に決めておくため（{ch:hf} SRM・{ch:crm} TEM）', '離陸前の確認の最後は、窓の外：滑走路・進入してくる機体・風向き')}
${bk.sim('課目「通常離陸と上昇」は、ランナップが終わって滑走路に並んだところから始まります。', ['t1', '通常離陸と上昇'])}` },
    ],
    terms: [['Preflight inspection / Walk-around', '飛行前点検・外部点検', ''], ['Fuel sump / Drain', '燃料のサンプ（水の抜き取り）', ''], ['Magneto', 'マグネトー（エンジンの点火用の発電機）', '2 系統'], ['Run-up', 'ランナップ（試運転）', ''], ['Carburetor heat', 'キャブレターヒーター', ''], ['Hold short line', '滑走路手前の停止線', ''], ['Prop clear', 'プロペラの周りに人がいない（始動前の掛け声）', ''], ['Takeoff briefing', '離陸ブリーフィング', '']],
    examples: ['マグネトーの点検で左 100 rpm・右 200 rpm 低下 → 右が上限 175 を超えている。チェックリストの手順（少し薄くして 20〜30 秒回し、戻して再確認）で直らなければ飛ばない（整備に報告：squawk）。', '燃料のサンプに水の玉 → 出なくなるまで抜く。前の晩の雨・タンクの結露が原因のことがある。'],
    cautions: ['この章の手順は公開されている訓練校のチェックリストの要約で、ANA・Acron Aviation の SOP ではない。実機はその機体の POH とその訓練校のチェックリストに従う。', 'シミュレータでは外部点検・始動・ランナップは省略している（課目は滑走路上または空中から始まる）。'],
    quiz: [
      { q: 'ランナップのマグネトー点検（訓練校の Archer チェックリスト）の限度は？', choices: ['最大 50 rpm 低下・差 175 rpm', '最大 175 rpm 低下・左右の差 50 rpm', '低下がないのが正常', '最大 500 rpm 低下'], answer: 1, why: 'チェックリストの値は「max drop 175 rpm, max difference 50 rpm」。落ちが全くないのもスイッチ故障の疑いで正常ではない。' },
      { q: '追い風でタキシーするときの操縦輪の位置は？', choices: ['エルロンは風上へ・昇降舵は後ろ', 'エルロンは風下へ・昇降舵は前', 'すべて中立', 'エルロンは風上へ・昇降舵は前'], answer: 1, why: '追い風では風が尾翼や翼を後ろから持ち上げないよう、昇降舵を前、エルロンは風下側へ（dive away）。' },
      { q: '始動直後にまず確かめる計器は？', choices: ['燃料流量', '油圧', '速度計', '高度計'], answer: 1, why: '油圧が上がらないままエンジンを回すと壊れる。チェックリストでも始動後すぐ「Oil Pressure — CHECK」。' },
    ],
    refs: [R.archerCk, R.afh, R.phak, R.cfr91], lessons: ['t1'] });

  // ======================================================================= 10
  B.add({ id: 'ops', part: 'p2', t: '基本操縦：姿勢・出力・トリムと空中操作', en: 'Basic flight maneuvers',
    summary: '「姿勢＋出力＝性能」から始めて、直線水平・上昇降下・旋回・急旋回・低速飛行・失速・対地目標操作を、自家用の実地試験の許容幅とあわせて学ぶ。',
    secs: [
      { id: 'ops.trim', t: '姿勢＋出力＝性能、そしてトリム', h: () => `
<p>飛行機の操縦の基本は<b>「姿勢（Attitude）＋出力（Power）＝性能（Performance）」</b>です。機首の角度（ピッチ）とバンク角を決め、スロットルで出力を決めると、速度と上昇・降下の率が決まります。</p>
${bk.t(['この教材の Archer（教材値）', 'ピッチ', '出力', '結果'], [['巡航', '約 0〜+2°', `約 2,400 rpm（スロットル ${Math.round(AR.cruiseThr * 100)}%）`, `約 ${AR.cruise} kt・水平`], ['上昇（Vy）', '約 +7〜9°', '全開', `${AR.y} kt・約 700〜800 fpm（海面付近）`], ['巡航降下', '約 −2〜−3°', '約 2,000 rpm', '約 100 kt・−500 fpm'], ['進入（フラップ 40°）', '約 −2°', '約 1,500 rpm', `${AR.appr} kt・−370 fpm`]])}
<p>操縦は<b>「見る → 変える → 待つ → 確かめる → トリム」</b>の順です。姿勢を変えたら、速度と昇降率が落ち着くまで数秒待ちます。落ち着いたら<b>トリム</b>で操縦輪の力を消します。トリムは「手を離してもいまの姿勢・速度を保つ」ための装置で、姿勢を変える道具ではありません。</p>
<p class="mute">シミュレータでは：<b>S / W</b> で機首の角度を動かし、離すとその角度を保ちます（設定で「離すと中立」も選べます）。<b>T</b> を押すと、いまの速度でトリムが取れ、手を離しても水平飛行が続きます。PFD の姿勢表示の目盛りで角度を読みます。</p>
${bk.key('速度は主にピッチで、上昇・降下は主に出力で（安定した状態では両方が関係する）', '出力を変えると機首が上下する（出力を上げると機首が上がる・左へ向く）。先回りして押さえる', 'トリムは最後。トリムで機首を上げ下げしない')}
${bk.sim('トリムを取って手放しで飛ぶ感覚を覚えましょう。', ['a1', '姿勢・出力・トリム'])}` },
      { id: 'ops.sl', t: '直線水平飛行', h: () => `
<p>高度・針路・速度を同時に保つ、すべての操作の土台です。外を見るときは、<b>機首（カウリングの上端）と水平線の位置関係</b>を覚えます。計器は確認に使い、目の大部分は外へ（有視界飛行のとき）。</p>
<ol><li>機首を水平線のいつもの位置に置き、翼を水平にする。</li><li>出力を巡航に合わせる。</li><li>速度が落ち着いたらトリム。</li><li>高度計・方位を時々確かめ、ずれたら<b>小さく</b>直す（高度 100 ft のずれなら、ピッチを 1〜2° だけ変える）。</li></ol>
${bk.t(['基準', '高度', '針路', '速度'], [['自家用 ACS（基礎的な計器飛行の項）', '±200 ft', '±20°', '±10 kt'], ['この教材の「基礎」', '±100 ft', '±10°', '±10 kt'], ['この教材の「精度」', '±50 ft', '±5°', '±5 kt']])}
${bk.key('翼が少しでも傾くと、ゆっくり曲がって高度も下がる。まず翼を水平に', 'ずれは小さいうちに小さく直す。大きく直すと行き過ぎる')}
${bk.sim('高度・針路・速度を同時に保つ練習です。', ['a2', '直線水平飛行'])}` },
      { id: 'ops.climb', t: '上昇・降下・レベルオフ', h: () => `
<p><b>上昇の始め方（PAT）</b>：Pitch（機首を上昇姿勢へ）→ Power（全開）→ Trim。速度が Vy（Archer ${AR.y} kt）に落ち着くようにピッチを調整します。上昇中は高出力・低速なので<b>右ラダー</b>が要ります（{ch:aero}「左偏向傾向」）。</p>
<p><b>レベルオフ</b>：目標高度の<b>昇降率の 10%</b> 手前から機首を下げ始めます（700 fpm で上昇中なら 70 ft 手前）。水平にしたら速度が巡航まで増えるのを待ってから出力を巡航に下げ、トリム（APT：Attitude → Power → Trim）。</p>
<p><b>降下</b>：出力を下げると機首が下がり、速度を保ったまま降下が始まります。降下率は出力で決めます。目標高度の手前（降下率の 10%）で出力を戻しながら機首を水平へ。</p>
${bk.t(['この教材の Archer の速度', '値（訓練校チェックリスト）'], [['Vx（最良上昇角）', `${AR.x} kt：短い距離で高さを稼ぐ（障害物越え）`], ['Vy（最良上昇率）', `${AR.y} kt：短い時間で高さを稼ぐ（通常の上昇）`], ['巡航上昇', `${AR.climb} kt：前がよく見え、エンジンも冷える（地上 1,000 ft 以上）`]])}
${bk.key('上昇中は前が見えにくい。ときどき左右に軽く旋回して前方を確かめる（clearing turns）', '自家用 ACS の通常離陸後の上昇：Vy ＋10／−5 kt')}
${bk.sim('上昇から始めて、目標高度で水平に戻し、降下までを通しで。', ['a3', '上昇・降下・レベルオフ'])}` },
      { id: 'ops.turns', t: '旋回と急旋回', h: () => `

<p><b>低速飛行（Slow flight）</b>は、失速警報が鳴る少し手前の速度で、高度・針路を保ちながら操縦する練習です。離着陸の直前・直後はいつもこの速度域なので、「操縦の効きが悪い・ピッチと出力の関係が逆に感じる（後退側）」状態に慣れるために行います。</p>

<p><b>回復の手順</b>（AFH の考え方）：①機首を下げて迎え角を減らす（これが第一） ②翼を水平 ③出力を全開 ④速度が付いたら上昇姿勢へ。高度を失うのを怖がって引き続けると、二次失速になります。</p>

  B.add({ id: 'tl', part: 'p2', t: '離陸・場周経路・着陸・ゴーアラウンド', en: 'Takeoffs, traffic patterns, landings and go-arounds',

      { id: 'ops.pattern', t: '場周経路（トラフィックパターン）', h: () => `

<p>飛行場の周りを長方形に飛んで着陸の順番と間隔を作る、決まった通り道です。標準は<b>左回り</b>（滑走路を左に見る）。AIM の推奨では、プロペラ機の場周高度は<b>地上 1,000 ft</b>、入るときはダウンウインドの<b>中央に 45° で</b>合流します（空港ごとに決まりがあり、Chart Supplement で確認）。</p>

  ['アビーム（接地点の横）', 'パワーを絞り（約 1,500 rpm）、フラップ 10°、降下開始・80 kt 前後'],

<p>ACS（自家用）の場周経路：<b>場周高度 ±100 ft・速度 ±10 kt</b>。風があれば各区間で偏流修正（対地目標操作の長方形コースと同じ）。</p>

      { id: 'ops.landing', t: '安定した進入と着陸', h: () => `

${bk.t(['AFH 第 9 章の安定進入の要素（ピストン機）', '内容'], [['進入角', '一定の 3°（障害物がなければ）'], ['方向', 'センターラインの延長上。ファイナルでのバンクは通常 15° まで'], ['速度', 'AFM の進入速度（または 1.3 Vso）の ＋10／−5 kt'], ['形態', '着陸形態・トリム済み'], ['降下率', '一般に 500〜1,000 fpm。それより大きければ地上 300 ft までに減らす'], ['判断', '<b>VMC で地上 500 ft までに安定しなければゴーアラウンド</b>（IMC は 1,000 ft）。地上 300 ft より下で不安定になったら直ちにゴーアラウンド']])}
${FIG.papi()}
<p><b>フレアと接地</b>：滑走路の端を越えたらスロットルをアイドル。地上 10〜20 ft から目線を滑走路の先へ移し、機首を少しずつ上げて降下を止め、浮いている間に速度が減って<b>主輪から</b>そっと接地します。接地後は操縦輪を引いたまま前輪をゆっくり下ろし、ラダーでセンターラインを保ち、ブレーキ。</p>
${bk.t(['基準', '値'], [['自家用 ACS', '進入速度 ＋10／−5 kt・<b>指定点から 400 ft 以内</b>に接地・横流れなし・機軸がセンターラインと平行'], ['事業用 ACS', '指定点から 200 ft 以内'], ['この教材の「基礎」', `${AR.appr} ±5 kt・進入角 3 ±0.9°・接地 300 fpm 以下・目標点の −100〜+400 m・センターライン ±6 m`]])}
${bk.key('速度は昇降舵、進入角は出力（安定しているとき）。2 つを同時に少しずつ', 'フロート（なかなか接地しない）は速度が速すぎるか、フレアが高すぎる。押して下ろさない。長すぎたらゴーアラウンド', 'バウンドしたら：小さければ姿勢を保ってもう一度フレア。大きければすぐゴーアラウンド')}

  B.add({ id: 'navp', part: 'p3', t: '地図・飛行計画・推測航法', en: 'Charts, flight planning and dead reckoning',
    summary: 'セクショナルチャートの読み方、真航路から磁針路までの計算、ナビゲーションログ、地文航法と推測航法。公開情報の「地図に線を引き、上空の風から針路を計算して飛ぶ」訓練の中身。',
    secs: [
      { id: 'nav.chart', t: 'セクショナルチャート（VFR の航空図）', h: () => `
<p>米国の有視界飛行で使う地図は<b>セクショナルチャート</b>（縮尺 1：500,000、1 インチ ≒ 6.9 NM）です。地形・目印・空港・電波施設・空域が描かれ、FAA が定期的に改訂します（古い版は使わない）。</p>
${bk.t(['記号・表示', '意味'], [
  ['MEF（区画ごとの大きな数字。例 <b>2</b>⁵）', 'Maximum Elevation Figure：その区画の最も高い地形・障害物に余裕を足した高さ（百 ft 単位。2⁵ ＝ 2,500 ft MSL）'],
  ['空港（青・マゼンタ）', '青は管制塔あり、マゼンタは管制塔なし。中の線は滑走路の向き'],
  ['空港の横の文字（架空の例）', '例「LAB CT 118.3 ★ 55 L 60 122.95」：管制塔（CT）の周波数 118.3・飛行場灯台（★）・標高 55 ft・灯火あり（L）・最長滑走路 6,000 ft・UNICOM 122.95（記号の意味は Chart User\'s Guide で確認）'],
  ['青の実線 / マゼンタの実線 / 青の破線', 'B クラス / C クラス / D クラス空域（{ch:law}）'],
  ['マゼンタのぼかし / 青のぼかし', 'E クラスの下限が地上 700 ft / 1,200 ft'],
  ['VOR のコンパスローズ', '磁方位の目盛り。局の周波数と識別符号（モールス）が四角の中に']])}
${bk.key('地図と Chart Supplement（空港の詳しい情報）と NOTAM（臨時の情報）の 3 つで計画する', 'この教材の地図・訓練点・LAB VOR は架空（NOT FOR NAVIGATION）')}
<p>${bk.see('law.airspace', '空域の種類と入る条件（{ch:law}）')}</p>` },
      { id: 'nav.plan', t: '針路の計算：真航路 → 磁針路 → コンパス針路', h: () => `
<ol><li><b>真航路（True Course, TC）</b>：地図に出発地と目的地を結ぶ線を引き、真北からの角度を分度器（プロッター）で測る。</li>
<li><b>偏流修正角（WCA）</b>：上空の風（予報の Winds Aloft）から、風の三角形で計算。風上へ機首を向ける。<b>真針路 TH ＝ TC ± WCA</b>。</li>
<li><b>磁気偏差（Variation）</b>：真北と磁北の差。地図の等偏差線（isogonic line）で読む。<b>西偏は足し、東偏は引く</b>（"East is least, West is best"）。磁針路 MH。フロリダ中部はおよそ西偏 6〜7°（年々変わる。NOAA の計算機や最新の地図で確認。この教材は 6°W）。</li>
<li><b>自差（Deviation）</b>：その機体のコンパスの誤差。コンパスの近くの修正表（compass card）で読む。<b>コンパス針路 CH</b>。</li></ol>
${FIG.windTriangle()}
${bk.calc('wca')}
<p>そのほか、<b>距離</b>（区間ごと）・<b>対地速度</b>・<b>所要時間（ETE）</b>・<b>燃料</b>を、10 NM 前後ごとの<b>チェックポイント</b>（はっきりした目印：大きな交差点・湖・塔・空港）で区切ってナビゲーションログに書きます。</p>
${bk.calc('fuel')}
${bk.t(['規則', '内容（要点）'], [['14 CFR 91.159 VFR の巡航高度', '地上 3,000 ft より上：磁航路 0〜179° は<b>奇数千 ft＋500</b>（例 5,500）、180〜359° は<b>偶数千 ft＋500</b>（例 4,500）'], ['14 CFR 91.151 VFR の燃料', '目的地まで＋昼は 30 分・夜は 45 分（通常の巡航で）'], ['14 CFR 91.103', 'IFR や飛行場の近くを離れる飛行では、天気・燃料・代替の飛行場・遅れの情報を知っておく']])}
${bk.key('真 → 磁 → コンパス。足し引きの方向を毎回確かめる（間違えると 12° 以上ずれる）', '高度を選ぶときは、巡航高度の規則・空域・雲からの距離（91.155）・地形（MEF）を同時に')}` },
      { id: 'nav.dr', t: '地文航法と推測航法', h: () => `
<p><b>地文航法（Pilotage）</b>は、地図の目印と外の景色を比べて進む方法。<b>推測航法（Dead Reckoning）</b>は、針路・速度・時間から位置を計算する方法です。実際は両方を組み合わせます：計算した針路と時間で飛び、チェックポイントで実際の位置を確かめて直します。</p>
<ol><li>出発点の上空で針路に乗り、<b>時刻を記録</b>（"Time off"）。</li><li>計算した磁針路を保つ（高度と針路を正確に。ずれは推測航法の誤差になる）。</li><li>チェックポイントの<b>予定時刻</b>に、地図と外を比べる。早い・遅い → 対地速度を直す。左右にずれた → 風の見積もりを直す（次の項「60 の法則」）。</li><li>次のチェックポイントの予定時刻を書き直す。</li></ol>
${bk.calc('rule60')}
${bk.key('「60 の法則」：60 NM で 1 NM ずれる ≒ 1°。20 NM 飛んで 2 NM 右にずれていたら 6° 左へ修正（さらに目的地へ向けるには残りの距離の分を足す）', 'GPS が使えても、推測航法の計算は続ける（GPS が止まったときの「現在地の見積もり」になる）')}
${bk.sim('針路と時間で目標へ飛び、途中で目的地を変更します。', ['n2', '推測航法と目的地変更'])}` },
    ],
    terms: [['Sectional chart', 'セクショナルチャート', '1:500,000'], ['Chart Supplement', '空港の詳しい情報', '旧 A/FD'], ['True / Magnetic / Compass heading', '真・磁・コンパス針路', ''], ['Variation / Deviation', '偏差・自差', ''], ['Wind correction angle (WCA)', '偏流修正角', ''], ['Groundspeed (GS)', '対地速度', ''], ['ETE / ETA', '所要時間・到着予定時刻', ''], ['Checkpoint', 'チェックポイント', ''], ['Pilotage / Dead reckoning', '地文航法・推測航法', ''], ['Navigation log', 'ナビゲーションログ', ''], ['VFR cruising altitude', 'VFR の巡航高度', '91.159']],
    examples: ['TC 090°・風 030°/15 kt・TAS 105 kt → WCA 左（北）へ約 7°・TH 083°・西偏 6° → MH 089°。', '20 NM 地点で予定より 1 分遅い → 対地速度が予想より遅い（向かい風が強い）→ 以降の到着時刻と燃料を直す。'],
    cautions: ['この教材の地図・訓練点・数値は架空（NOT FOR NAVIGATION）。実際の飛行は最新の航空図と公式情報で。', '磁気偏差の値は場所と年で変わる。この教材の 6°W は教材用近似。'],
    quiz: [
      { q: '真針路 095°、偏差 7°W。磁針路は？', choices: ['088°', '095°', '102°', '275°'], answer: 2, why: '西偏は足す（West is best）：095 ＋ 7 ＝ 102°。' },
      { q: '14 CFR 91.159：地上 3,000 ft より上、磁航路 210° の VFR の巡航高度として正しいのは？', choices: ['5,500 ft', '4,500 ft', '5,000 ft', '4,000 ft'], answer: 1, why: '180〜359° は偶数千 ft ＋ 500 ft。0〜179° なら奇数千＋500。' },
      { q: '30 NM 飛んで、航路から 3 NM 右にずれていた。平行に戻すには何度左へ直す？（60 の法則）', choices: ['3°', '6°', '10°', '30°'], answer: 1, why: '60 × 3 ÷ 30 ＝ 6°。目的地へ向けるには、残りの距離の分をさらに足す。' },
    ],
    refs: [R.phak, R.vfr, R.chartUG, R.cfr91, R.mag], lessons: ['n2'] });

  B.add({ id: 'navr', part: 'p3', t: '電波航法と GPS', en: 'Radio navigation and GPS',
    summary: 'VOR（ラジアル・TO/FROM・追跡）、DME、GPS と G1000 の CDI の目盛り、レーダーによる交通情報（Flight following）。',
    secs: [
      { id: 'nav.vor', t: 'VOR：ラジアルと追跡', h: () => `
<p><b>VOR</b>（超短波全方向式無線標識、108.00〜117.95 MHz）は、局から 360 本の<b>ラジアル</b>（局から外へ向かう磁方位の線）を出しています。受信機は「いまどのラジアルの上にいるか」がわかります。使う前に必ず<b>識別符号（モールス）を聞いて</b>局を確かめます。</p>
${bk.t(['表示', '意味'], [['CRS（OBS）', 'パイロットが選んだコース'], ['TO / FROM', 'そのコースを飛ぶと局に近づく（TO）か、離れる（FROM）か。機首の向きではなく<b>位置</b>で決まる'], ['CDI の針（G1000 の HSI）', 'コースが針の側にある。<b>針の方へ飛ぶ</b>。片側 2 ドットで、VOR は <b>1 ドット 5°・2 ドット（いっぱい）で 10°</b>'], ['フラグ（NO SIGNAL など）', '信号がない・弱い。表示を信じない']])}
<h3>コースに乗って追跡する</h3>
<ol><li>CRS を飛びたいコースに合わせる（局へ向かうなら TO が出る向き）。</li><li>針の方へ <b>30°〜45° の角度で会合</b>（intercept）。</li><li>針が中央に近づいたらコースの方位へ旋回。</li><li>風で流されたら、針の方へ 10° → 5° と<b>修正角を半分ずつ</b>変えて、針が止まる針路を探す（bracketing）。</li><li>局の上は針が大きく振れて TO→FROM に変わる（局通過）。</li></ol>
<p>HSI では、コースの矢印が機体の向きに合わせて回るので、TO で飛んでいれば「逆に感じる」ことはありません。昔ながらの VOR 計器では、FROM の向きで局へ飛ぶと針の動きが逆になる（<b>reverse sensing</b>）ので注意します。</p>
${bk.t(['IFR で使う前の VOR の点検（14 CFR 91.171・30 日以内）', '許容誤差'], [['VOT（試験信号）', '±4°'], ['地上の指定点', '±4°'], ['空中の指定点', '±6°'], ['2 台の受信機の比較', '差 4° 以内']])}
${bk.sim('NAV1 を LAB VOR に合わせ、局へ向かうコースに乗って追跡します。', ['n1', 'VOR の追跡'])}` },
      { id: 'nav.dme', t: 'DME と位置の確かめ方', h: () => `
<p><b>DME</b>（距離測定装置）は、局までの距離を示します。測っているのは機体から局への<b>斜めの距離</b>（slant range）なので、局の真上では高度の分（例えば 6,000 ft ＝ 約 1 NM）が表示されます。AIM では、高度 1,000 ft ごとに局から 1 NM 以上離れていれば誤差は小さいとされています。</p>
<p><b>ラジアル＋DME ＝ 位置</b>：例えば「LAB VOR の 030 ラジアル・12 NM」は、地図上の 1 点です。GPS が使えないときの位置の確かめ方として、この教材の課目「現在地を見失ったとき」で使います。</p>
<p>VOR が 2 局あれば、2 本のラジアルの交点（cross fix）でも位置がわかります。</p>
${bk.key('ラジアルは「局から出ていく向き」。局へ向かう針路はラジアル＋180°', 'DME の距離は「局まで」。空港までではない')}` },
      { id: 'nav.gps', t: 'GPS と G1000 の航法表示', h: () => `
<p><b>GPS</b> は人工衛星の電波で位置を出します。3 次元の位置には 4 機以上の衛星が必要で、受信機自身が衛星の異常を調べる <b>RAIM</b>（受信機による完全性監視）にはさらに衛星が必要です。米国では WAAS（衛星による補強）で精度と完全性が上がり、LPV という精密に近い進入ができます。</p>
${bk.t(['G1000 の CDI の目盛り（GPS）', 'いっぱいの振れ（2 ドット）'], [['ENR（航空路）', '2.0 NM'], ['TERM（空港の周り 30 NM 以内）', '1.0 NM'], ['APR（進入）', '0.3 NM 前後（角度で狭くなる）']])}
<p>MFD の地図には飛行計画の線（マゼンタ＝いまの区間）・自機の位置・航跡が出ます。<b>PFD の上の欄</b>には次のウェイポイント・希望航路（DTK）・距離・所要時間（ETE）が出ます。この教材の G1000 型表示でも同じ配置にしています（教材の簡略版）。</p>
${bk.warn('GPS に頼りきると、故障や妨害（ジャミング）のときに位置がわからなくなる。推測航法の見積もりと、VOR・DME での確かめを続ける。この教材の課目「現在地を見失ったとき」では GPS が途中で使えなくなる。')}
<p>${bk.see('sys.g1000', 'G1000 の表示（{ch:sys}）')}</p>` },
      { id: 'nav.ff', t: 'レーダーによる交通情報（Flight following）', h: () => `
<p>VFR でも、出発・進入管制や航空路管制に頼むと、レーダーで<b>他機の情報（traffic advisories）</b>をもらえます（AIM 4-1-15 Radar Traffic Information Service・4-1-18 VFR 機へのターミナルレーダー業務）。管制の業務量によって断られることがあり、<b>見張りの責任はパイロット</b>に残ります。</p>
<p>例：「Orlando Approach, Cherokee 123AB, 10 miles north of Sanford, 3,500, VFR to Ocala, request flight following.」</p>
${bk.key('flight following は「見てもらえる」安心ではなく「情報が増える」助け。見張りは自分', 'C クラス・B クラス空域に入る条件（{ch:law}）とは別のもの')}` },
    ],
    terms: [['VOR', '超短波全方向式無線標識', ''], ['Radial', 'ラジアル（局から出る磁方位）', ''], ['OBS / CRS', 'コースの選択', ''], ['TO / FROM', '局へ／局から', ''], ['CDI / HSI', 'コース偏位計・水平状況指示器', ''], ['Intercept / Track / Bracketing', '会合・追跡・修正角の絞り込み', ''], ['Station passage', '局通過', ''], ['DME / Slant range', '距離測定装置・斜距離', ''], ['RAIM / WAAS / LPV', 'GPS の完全性監視・補強・進入', ''], ['Flight following', 'VFR のレーダー交通情報', '']],
    examples: ['CRS 030・TO・針が右 1 ドット → コースは右に約 5°。040° 前後で会合し、針が中央に近づいたら 030° 前後へ。', 'DME 5.0 NM・高度 6,000 ft・局の真上へ向かう → 真上でも DME は約 1.0 NM を示す。'],
    cautions: ['LAB VOR（113.50）・I-LAB（109.90）は架空の教材用施設。', 'G1000 の表示は「型」を学ぶための教材の簡略版。実機の操作は G1000 の Pilot\'s Guide と機体の AFM 補足で。'],
    quiz: [
      { q: 'G1000 の HSI で VOR を使っている。針が左にいっぱい（2 ドット）振れている。コースはどこ？', choices: ['左に 10° 以上', '右に 10° 以上', '左に 2°', '真下'], answer: 0, why: '針の側にコースがある。VOR は 1 ドット 5°、2 ドットで 10°（いっぱい）。' },
      { q: 'TO / FROM 表示が決まるのは？', choices: ['機首の向き', '機体の位置（選んだコースに対して局のどちら側か）', '速度', '高度'], answer: 1, why: 'TO/FROM は位置で決まる。機首をどちらに向けても変わらない。' },
      { q: 'IFR で使う VOR の空中の指定点での点検の許容誤差（91.171）は？', choices: ['±2°', '±4°', '±6°', '±10°'], answer: 2, why: 'VOT と地上の指定点は ±4°、空中の指定点は ±6°、2 台の比較は差 4° 以内。' },
    ],
    refs: [R.phak, R.aim, R.ifh, R.g1000, R.cfr91], lessons: ['n1', 'n3'] });

  // ======================================================================= 16
  B.add({ id: 'navd', part: 'p3', t: '目的地変更・現在地を見失ったとき', en: 'Diversions and lost procedures',
    summary: '天気・体調・機体の不具合で目的地を変える手順、現在地を見失ったときの手順（4C / 5C）、クロスカントリー飛行の組み立て。',
    secs: [
      { id: 'nav.divert', t: '目的地変更（Diversion）', h: () => `
<p>公開情報（ANA）でも、目的地変更に伴う<b>再計算</b>が訓練の一部とされています。空の上で、地図・計算尺を広げる余裕は少ないので、<b>まず向きを変え、それから見積もり、最後に正確に</b>します（PHAK の考え方）。</p>
<ol><li><b>決める</b>：天気が悪くなる・燃料が予定より少ない・体調・機体の不具合。迷ったら早めに。</li>
<li><b>まず向きを変える</b>：地図上で現在地から新しい目的地への方向を目で見積もり、すぐその方へ旋回（「指で測る」「時計の文字盤で考える」）。</li>
<li><b>見積もる</b>：距離（地図の縮尺・指の幅）・時間（距離 ÷ 対地速度）・燃料。60 の法則で針路を直す。</li>
<li><b>確かめる</b>：最初のチェックポイントで位置を確かめ、針路と時間を直す。管制・FSS に変更を伝える。</li></ol>
${bk.t(['見積もりの道具', '使い方'], [['時速 → 分速', '105 kt ＝ 約 1.75 NM/分。12 NM なら約 7 分'], ['60 の法則', '1° ≒ 60 NM で 1 NM のずれ'], ['MFD の地図・GPS の Direct-To', '使えるときは確かめに使う（推測の答え合わせ）']])}
${bk.key('先に向きを変える。計算は向きを変えてから', '目的地変更は「失敗」ではなく安全のための判断（{ch:hf} ADM・{ch:crm} TEM）')}
${bk.sim('飛行中に目的地を変更し、新しい針路・距離・時間を見積もって入力します。', ['n2', '推測航法と目的地変更'])}` },
      { id: 'nav.lost', t: '現在地を見失ったとき', h: () => `
<p>位置がわからなくなったら、慌てて飛び回るのが最も危険です。FAA の教材でよく使われる手順は <b>4C</b>（または Conserve を加えた 5C）です。</p>
${bk.t(['C', 'すること'], [['Climb（上がる）', '高い方が遠くまで見え、無線や電波施設も届きやすい（雲・空域に注意）'], ['Communicate（伝える）', '管制・FSS・121.5 MHz を呼ぶ。トランスポンダーで位置がわかる'], ['Confess（認める）', '「迷った」と正直に言う（恥ずかしくない）'], ['Comply（従う）', '管制の指示に従う'], ['Conserve（節約）', '出力を下げて燃料を節約。時間を稼ぐ']])}
<p>自分で位置を確かめるには：最後に確かめた位置と、そこからの<b>針路・時間</b>で範囲を見積もる → その範囲の大きな目印（湖・高速道路・海岸線）を探す → VOR の<b>ラジアル＋DME</b>（または 2 局のラジアルの交点）で位置を出す。</p>
${bk.key('燃料と日没までの時間を常に把握。暗くなる前・燃料が少なくなる前に、近くの空港へ降りる判断を', 'GPS が使えても、迷ったときの手順は同じ：まず落ち着いて上がり、伝える')}
${bk.sim('GPS が途中で使えなくなります。VOR と DME で位置を確かめて飛行場へ戻ります。', ['n3', '現在地を見失ったとき（GPS 故障）'])}` },
      { id: 'nav.xc', t: 'クロスカントリー飛行の組み立て', h: () => `
<p>クロスカントリー（離れた空港への飛行）の準備は、これまでの章のまとめです。</p>

${bk.t(['スキャンの誤り', '例'], [['固着（fixation）', '方位だけを見続け、その間に高度が下がる'], ['省略（omission）', '旋回中に速度を見ない'], ['偏り（emphasis）', '1 つの計器を信じすぎ、ほかと比べない']])}
<p><b>標準旋回率</b>（1 秒に 3°、2 分で 360°）は計器飛行の基本です。バンク角の目安は「速度 ÷ 10 ＋ 7」。</p>

${bk.t(['磁気コンパスの誤差（北半球）', '覚え方'], [['北向き・南向きでの旋回誤差', '<b>UNOS</b>：北へ向かう旋回は早めに止める（Undershoot North）、南へは行き過ぎてから止める（Overshoot South）'], ['東向き・西向きでの加速誤差', '<b>ANDS</b>：加速で北を、減速で南を示す（Accelerate North, Decelerate South）']])}

${bk.t(['状態', '見分け方', '回復の順番（IFH）'], [

  ['機首下げ・速度増加（スパイラル）', '速度が増えている・姿勢が下で傾いている・高度が急に減る', '①<b>出力を下げる</b> ②<b>先に翼を水平</b> ③それから機首をゆっくり上げる（傾いたまま引くと旋回が締まり、荷重が大きくなる）']])}
<p>エアラインの訓練（FAA AC 120-111 の UPRT）では、大型機の機首上げからの回復を「Push（押す）・Roll（必要なら傾けて機首を下げる）・Power・Stabilize」の考え方で教えます。小型機でも大切なのは<b>迎え角を減らすこと（押す）</b>と<b>翼を水平にしてから引くこと</b>です。</p>

  B.add({ id: 'ifrp', part: 'p4', t: '計器飛行方式：規則・待機・ILS 進入', en: 'IFR rules, holding and the ILS approach',
    summary: 'IFR の飛行計画と許可、燃料と代替飛行場、最低高度、待機経路、ILS 進入と進入復行、計器飛行 ACS の許容幅。',
    secs: [
      { id: 'ifr.rules', t: 'IFR の規則の要点', h: () => `
${bk.t(['規則', '要点'], [
  ['IFR の許可（clearance）', '覚え方 <b>CRAFT</b>：Clearance limit（どこまで）・Route（経路）・Altitude（高度）・Frequency（出発後の周波数）・Transponder（コード）。全部を復唱'],
  ['燃料（91.167）', '目的地まで＋（必要なら）代替飛行場まで＋<b>通常巡航で 45 分</b>'],
  ['代替飛行場（91.169）', '「1-2-3 ルール」：到着予定の前後 1 時間、目的地の雲の高さ 2,000 ft 以上・視程 3 SM 以上なら代替は不要。代替の標準の最低気象条件は精密進入 600 ft・2 SM、非精密進入 800 ft・2 SM（決まりがあればそれに従う）'],
  ['最低 IFR 高度（91.177）', '決まった高度がないときは、4 NM 以内の最も高い障害物から 1,000 ft（山岳地は 2,000 ft）以上'],
  ['進入の最低高度（91.175）', '<b>DA / MDA より下へは</b>、滑走路の目印（灯火・標識など）が見え、視程が足り、通常の降下率で接地点へ降りられるときだけ'],
  ['計器飛行の経験（61.57(c)）', '6 か月以内に 6 回の進入・待機・コースの会合と追跡（実機・認められた装置）']])}
${bk.key('許可は全部を復唱し、わからないところは聞き返す（"Say again"）', 'この教材は IFR の飛行計画・許可の課目は簡略化している（ILS の進入許可の復唱だけ）')}` },
      { id: 'ifr.hold', t: '待機経路（ホールディング）', h: () => `
${FIG.holding()}
<p>待機経路は、管制の順番待ちや天候の回復待ちで使う、決まった形の<b>レーストラック</b>です（AIM 5-3-8）。</p>
${bk.t(['項目', '内容（AIM 5-3-8）'], [['標準の向き', '右回り（左回りは指示されたとき）'], ['インバウンドの長さ', '14,000 ft MSL 以下は <b>1 分</b>、それより上は 1.5 分'], ['最大速度（ピストン機は通常これより遅い）', '6,000 ft 以下 200 kt・6,001〜14,000 ft 230 kt'], ['入り方', '直接（direct）・平行（parallel）・ティアドロップ（teardrop）。来た方向で決まる'], ['時間の測り始め', 'フィックスの真横（abeam）で、またはわからなければ翼が水平になったとき'], ['風', 'インバウンドの時間が 1 分になるようにアウトバウンドの時間を変える。アウトバウンドの偏流修正はインバウンドの約 3 倍が目安']])}
<p>計器飛行 ACS（Holding Procedures）：<b>速度 ±10 kt・高度 ±100 ft・針路 ±10°・コースは CDI の 3/4 以内</b>。</p>
${bk.key('入る前に「どの入り方か・アウトバウンドの針路・時間」を声に出して決める', '旋回は標準旋回率（バンク 25° を超えない）')}
${bk.sim('LAB VOR を基準に、インバウンド 090° の右回りの待機。', ['i4', '待機経路'])}` },
      { id: 'ifr.ils', t: 'ILS 進入', h: () => `
${FIG.ils()}
<p><b>ILS（計器着陸装置）</b>は、<b>ローカライザー</b>（左右：108.10〜111.95 MHz）と<b>グライドスロープ</b>（上下：通常 3°）で、滑走路への道を電波で示す精密進入です（AIM 1-1-9）。G1000 の PFD では、HSI の針がローカライザー、姿勢表示の右の菱形がグライドスロープです。</p>
${bk.t(['表示', 'いっぱいの振れ（2 ドット）', '1 ドット'], [['ローカライザー', '約 ±2.5°（滑走路端で幅 700 ft になるよう調整される）', '約 1.25°'], ['グライドスロープ', '約 ±0.7°', '約 0.35°']])}
<ol><li><b>準備</b>：ATIS・進入図（チャート）のブリーフィング（周波数・最終進入コース・FAF の高度・DA・進入復行の手順）。NAV を ILS の周波数に・識別符号を聞く・CRS を最終進入コースに。</li>
<li><b>会合</b>：管制のレーダー誘導（vector）で 30° 程度の角度でローカライザーへ。針が動き出したら旋回して乗る。</li>
<li><b>グライドスロープ</b>：菱形が中央に来たら出力を下げ、降下率を対地速度 × 5 前後（90 kt なら約 450 fpm）に。</li>
<li><b>修正は小さく</b>：滑走路に近いほど針は敏感。ローカライザーは 2〜5° の針路の修正、グライドスロープは 100 fpm 前後の降下率の修正。</li>
<li><b>決心高度（DA）</b>：滑走路の目印が見えれば着陸、見えなければ<b>すぐ進入復行</b>（missed approach）。</li></ol>
${bk.t(['計器飛行 ACS（Precision Approach）', '許容幅'], [['最終進入の前', '高度 ±100 ft・針路 ±10°・速度 ±10 kt'], ['最終進入', 'ローカライザー・グライドスロープとも<b>3/4 スケール以内</b>・速度 ±10 kt'], ['DA', 'DA より下へは、目印が見えるときだけ（91.175）']])}
${bk.key('「出力で降下率、ピッチで速度」ではなく、「姿勢と出力を一緒に」小さく。速度を一定にすると修正が楽になる', '迷ったら進入復行。DA で見えなければ、見えるまで降りることは絶対にしない')}
${bk.sim('ローカライザーに会合してグライドスロープで降下し、決心高度で滑走路を確かめて着陸。', ['i5', 'ILS 進入'])}` },
      { id: 'ifr.np', t: '非精密進入・進入復行・自動操縦との関係', h: () => `
<p><b>非精密進入</b>（VOR・LNAV など）は、左右の誘導だけで高さの誘導がありません。決められた高度まで降り（<b>MDA</b>）、MDA を保って進み、<b>進入復行点（MAP）</b>までに滑走路が見えなければ進入復行します。計器飛行 ACS では MDA を ＋100／−0 ft で保つ。最近は、一定の角度で降りる<b>CDFA</b>（連続降下の最終進入）が推奨されています。</p>
<p>GPS の <b>LPV</b> 進入（WAAS）は、高さの誘導があり ILS に近い最低高度まで降りられます。</p>
<p><b>進入復行</b>は、ゴーアラウンドと同じ「出力・姿勢・形態」で始め、チャートの手順（上昇する方向・高度・待機するフィックス）に従います。進入の前のブリーフィングで必ず確認します。</p>
<p>実機の G1000 機には自動操縦（オートパイロット）があることが多いですが、この教材では<b>針路・高度を保つ自動操縦は実装していません</b>（自分の手で飛ぶ練習のため）。自動化の使い方の考え方は第 6 部で扱います。</p>

<h3>横滑りゼロ（zero sideslip）</h3>
<p>片発では、ボールを中央にしても横滑りしています。AFH は、<b>生きている側へ約 2° のバンク</b>と、ボールが生きている側へ<b>1/3〜1/2 ずれる</b>くらいのラダーの組み合わせで、横滑りがゼロになり上昇性能が最大になると説明しています（翼を水平・ボール中央では横滑りが残り、Vmc も公表値より高い）。</p>

<p class="mute">シミュレータでは：自動ラダーは使えません。<b>E / Q</b> で生きている側のラダーを踏み、<b>Z / X</b> のラダートリムで足を楽にします。止まった側を <b>[（左）/ ]（右）</b> でフェザーします。</p>

<p><b>Vmc</b> は、臨界発動機が突然止まったとき、生きているエンジンを最大出力にしたまま、<b>バンク 5° 以内で方向（まっすぐ）を保てる最小の速度</b>です（14 CFR 23 の考え方。AFH 第 13 章）。速度が下がるとラダーの効きが弱くなり、ある速度で「いっぱい踏んでも機首が止まった側へ回る」ようになります。</p>

<p>Vmc は<b>失速速度とは別</b>のものです。Vmc が失速速度より高い条件では、方向を失った（回り始めた）とき、出力を絞らないとスピンに入る危険があります。高い所では出力が減って Vmc が下がり、失速速度に近づく・逆転するので、<b>Vmc デモは失速の兆候でも直ちに回復</b>します。</p>
<h3>Vmc デモンストレーション（事業用 ACS・ガイドの要約）</h3>
<ol><li>地上 3,000 ft 以上（ガイド）。脚 UP・フラップ UP・プロペラ前。</li><li>片方（臨界発動機。Seminole は左で模擬）をアイドル（風車状態）、もう片方を全開。生きている側へ 5° 以内のバンク。</li><li>機首を上げて<b>1 秒に約 1 kt</b>ずつ速度を下げる。</li><li><b>方向が保てなくなった最初の兆候・失速警報・バフェット</b>で、<b>生きているエンジンの出力を絞り</b>、同時に機首を下げる。</li><li>方向を取り戻したら出力を戻して Vsse / Vyse（±5 kt）へ。ACS：<b>入った針路の ±20° 以内で回復</b>。</li></ol>
${bk.key('Vmc 付近で方向を失ったら「出力を絞る」が先。ラダーを強く踏むだけでは止まらない', '回復の方法は失速とは違う（失速は迎え角を減らす、Vmc は非対称の推力を減らす）。どちらの兆候も同時に起きうるので、両方をする')}
${bk.sim('Vmc の兆候を体験し、出力を絞って回復します。', ['m3', 'Vmc デモンストレーション'])}` },
      { id: 'me.drag', t: '抗力のデモンストレーション：何が上昇を奪うか', h: () => `
<p>公開ガイドの<b>抗力のデモ</b>は、片発（左はゼロ推力＝模擬フェザー）・Vyse で水平に飛んでいる状態から、形態を 1 つずつ変えて降下率がどれだけ増えるかを見る練習です。</p>
${bk.t(['形態の変化（ガイドの目安）', '降下率'], [['フラップ 10°', '約 200〜250 fpm'], ['＋脚 DOWN', '約 200〜300 fpm'], ['＋フラップ 45°（全開）', '約 400〜500 fpm'], ['＋止まった側を風車状態に（フェザーしない）', '約 500〜600 fpm']])}
<p>結論は単純です：<b>片発では、脚・フラップ・フェザーしていないプロペラが上昇を奪う</b>。だから手順は「全部前へ → 脚とフラップ UP → 特定・確認・フェザー」になります。</p>
<p class="mute">この教材の Seminole でも、脚（G）・フラップ（V）・フェザー（[ / ]）で降下率の違いを自由飛行で試せます（値は教材モデルの近似）。</p>` },
      { id: 'me.land', t: '片発の進入と着陸', h: () => `
<ul><li>進入は<b>ブルーライン（${SM.yse} kt）</b>で、<b>着陸が確実になるまで</b>脚とフラップを出しすぎない（ガイド：着陸が確実になってからフラップを増やす）。</li>
<li>出力を絞るとラダーの必要量が変わる（生きている側の推力が減る）。絞るときは<b>ラダーも戻す</b>。</li>
<li>片発のゴーアラウンドは非常に難しく、ガイドでは Seminole で行わない。だから「着陸すると決めたら降りる」進入を計画する（高めに、余裕をもって）。</li>
<li>接地は滑走路の最初の 1/3（事業用 ACS）。</li></ul>
${bk.warn('片発の進入で低く・遅くなると、出力を足しても上昇できず、Vmc に近づく。高めの進入が基本。')}` },
    ],
    terms: [['One engine inoperative (OEI)', '片発停止', ''], ['Identify, Verify, Feather', '特定・確認・フェザー', ''], ['Dead foot, dead engine', '遊んでいる足の側が止まったエンジン', ''], ['Zero sideslip', '横滑りゼロ', '生きている側へ約 2° バンク'], ['Vmc', '最小操縦速度（片発）', '赤い線'], ['Critical engine', '臨界発動機', ''], ['Windmilling propeller', '風車状態のプロペラ', ''], ['Vmc demonstration', 'Vmc デモ', ''], ['Drag demonstration', '抗力のデモ', ''], ['Secure', '止めたエンジンの片付け', '']],
    examples: ['巡航中に機首が左へ振れ、右足を強く踏んでいる → 左足が遊んでいる → 左エンジン停止を疑う → 左のスロットルを絞って変化なし → 左をフェザー（[）。', 'Vmc デモで速度 62 kt、ラダーいっぱいでも機首が左へ → すぐ右エンジンの出力を絞り、機首を下げる。'],
    cautions: ['Vmc デモ・抗力のデモは実機では教官と、決められた高度で行う。', 'この教材の Vmc（約 56 kt で方向を失う・バンク 5°・ラダーいっぱい）は教材モデルの近似値。'],
    quiz: [
      { q: '片発停止で、"Dead foot, dead engine" の意味は？', choices: ['踏んでいる足の側が止まった', '踏んでいない（遊んでいる）足の側が止まった', 'ラダーを使わない', '止まった側のラダーを踏む'], answer: 1, why: '生きている側のラダーを踏んで方向を保つので、遊んでいる足の側が止まったエンジン。' },
      { q: 'Vmc 付近で方向が保てなくなった。最初にすることは？', choices: ['ラダーをさらに強く踏む', '生きているエンジンの出力を絞り、機首を下げる', 'フラップを出す', '止まった側のエンジンを再始動'], answer: 1, why: '非対称の推力を減らさないと方向は戻らない。同時に機首を下げて速度を回復する。' },
      { q: '片発で上昇性能が最大になる飛び方（AFH）は？', choices: ['翼を水平・ボール中央', '生きている側へ約 2° のバンク・ボールは生きている側へ 1/3〜1/2', '止まった側へ 10° バンク', 'ラダーを使わずエルロンだけ'], answer: 1, why: 'この組み合わせで横滑りがゼロになり、抗力が最小になる。' },
      { q: '事業用 ACS の Vmc デモで、回復の基準になる針路の範囲は？', choices: ['±5°', '±10°', '±20°', '制限なし'], answer: 2, why: '入った針路の ±20° 以内で回復し、Vsse / Vyse ±5 kt へ加速する。' },

  B.add({ id: 'crm', part: 'p6', t: 'TEM と CRM：脅威とエラーを管理し、チームで飛ぶ', en: 'Threat and error management and crew resource management',
    summary: 'TEM（脅威・エラー・望ましくない状態）、CRM（チームで飛ぶための技術）、PF と PM の役割、懸念の伝え方。基礎訓練の後の副操縦士の訓練へつながる考え方。',
    secs: [
      { id: 'crm.tem', t: 'TEM：脅威とエラーの管理', h: () => `
${FIG.tem()}
<p><b>TEM</b>（Threat and Error Management）は、運航の安全を<b>「脅威」「エラー」「望ましくない機体の状態」</b>の 3 つで捉え、早く見つけて管理する考え方です（ICAO・SKYbrary）。もともとは航空会社の運航を観察する調査（LOSA）から生まれました。</p>
${bk.t(['分類', '意味', '例'], [
  ['脅威（Threat）', '乗員の外から来て、運航を難しくするもの', '天気（突風・雷雨）・混雑・管制の変更・機体の不具合・時間のプレッシャー・慣れない空港'],
  ['エラー（Error）', '乗員の行動・不作為で、意図や期待からずれたもの', '操作の誤り（機体操作）・手順の誤り（チェックリストの飛ばし）・交信の誤り（聞き違い）'],
  ['望ましくない機体の状態（UAS）', 'エラーや脅威の結果、安全の余裕が減った状態', '高度・速度の逸脱・誤った形態・誤った滑走路への進入']])}
<p><b>対策（countermeasures）</b>：</p>
<ul><li><b>予測</b>：出発前・進入前のブリーフィングで、今日の脅威と「起きたらどうするか」を言葉にする。</li><li><b>気づく</b>：モニター・クロスチェック・決めた「線」（例：500 ft で安定していなければゴーアラウンド）。</li><li><b>対処</b>：エラーは「見つけて直せば」事故にならない。UAS になったら、まず機体を立て直す（UAS の管理が最優先）。</li></ul>
${bk.key('エラーはなくせない。「起きる前提」で、早く見つけて小さいうちに直す仕組みを作る', '1 人で飛ぶときも同じ（SRM：{ch:hf}）')}
${bk.sim('出発前の脅威の予測、管制との食い違いへの気づき、突風を伴う横風での着陸。', ['r1', 'TEM：脅威を予測して管理する'])}` },
      { id: 'crm.crm', t: 'CRM：チームで飛ぶための技術', h: () => `
<p><b>CRM</b>（Crew Resource Management）は、操縦の腕だけでなく、<b>コミュニケーション・状況認識・意思決定・リーダーシップ・仕事量の管理</b>によって事故を防ぐ考え方です。1970 年代の事故の調査で、多くが技術ではなく乗員の連携の問題だったことから、航空会社の訓練に取り入れられました（SKYbrary）。</p>
${bk.t(['技術', '例'], [
  ['コミュニケーション', '決まった言葉（標準の用語・コールアウト）・復唱・「わからない」を言える'],
  ['状況認識', 'いま・この後どうなるかを、2 人で同じ絵として持つ（ブリーフィング）'],
  ['意思決定', '情報を集め、選択肢を挙げ、決めて、振り返る（DECIDE・{ch:hf}）'],
  ['リーダーシップ・フォロワーシップ', '機長が決め、副操縦士は懸念をはっきり伝える。どちらも必要'],
  ['仕事量の管理', '忙しくなる前に準備する。役割を分ける']])}
<h3>懸念の伝え方</h3>
<p>相手が上の立場でも、安全に関わることは言葉にします。よく教えられる組み立て：<b>①呼びかける（「機長」）②懸念を言う ③問題を具体的に ④解決案 ⑤同意を得る</b>。例：「機長、速度が 20 kt 速く、500 ft で安定していません。ゴーアラウンドしましょう。よろしいですか？」</p>
${bk.key('階級より安全。言いにくいことほど早く・具体的に', 'CRM は「仲良くする」ことではなく、チームとしての誤りを減らす技術')}` },
      { id: 'crm.pm', t: 'PF と PM：操縦する人と監視する人', h: () => `
<p>2 人乗りの運航では、操縦する人（<b>PF</b>：Pilot Flying）と監視する人（<b>PM</b>：Pilot Monitoring）に役割を分けます。FAA AC 120-71B は、<b>監視（monitoring）</b>を重要な仕事として位置づけ、標準運航手順（SOP）の中で役割をはっきりさせることを勧めています。</p>
${bk.t(['PF', 'PM'], [['機体の操縦（手動または自動操縦の操作）', '飛行経路・速度・形態・自動操縦のモードを監視し、ずれをコール'], ['決めた経路を飛ぶ', '無線・チェックリスト・計算'], ['PM のコールに応える（"Correcting"）', '逸脱が続けばさらに強くコール']])}
<p>この教材の課目は 1 人で飛びますが、PM の目を持つ練習として「自分で自分にコールする」ことが役に立ちます（例：「500 ft、安定」「速度プラス 10」）。</p>` },
    ],
    terms: [['TEM', '脅威とエラーの管理', 'Threat and Error Management'], ['Threat / Error / UAS', '脅威・エラー・望ましくない機体の状態', ''], ['Countermeasure', '対策', ''], ['LOSA', '運航の観察調査', 'Line Operations Safety Audit'], ['CRM', '乗員の資源管理', 'Crew Resource Management'], ['Situational awareness', '状況認識', ''], ['PF / PM', '操縦する人・監視する人', ''], ['Callout', 'コールアウト（決まった声かけ）', ''], ['Assertiveness', '懸念をはっきり伝えること', ''], ['SOP', '標準運航手順', '']],
    examples: ['脅威：午後の雷雨の予報 → 対策：出発を早める・代わりの空港を 2 つ決める・燃料を多めに。', 'エラー：管制の「runway 18」を復唱しかけた → 使用中は 36 のはず → "Say again" で確認 → エラーを管理できた。'],
    cautions: ['この部は一般的な TEM・CRM の考え方の入門で、ANA の副操縦士訓練や社内の手順の再現ではない。', 'エアラインの CRM・TEM は会社ごとの SOP と訓練で学ぶ。'],
    quiz: [
      { q: 'TEM で「脅威（Threat）」にあたるものは？', choices: ['チェックリストの項目を飛ばした', '午後の雷雨の予報', '高度を 300 ft 逸脱した', '周波数を間違えた'], answer: 1, why: '脅威は乗員の外から来るもの（天気・混雑・不具合など）。飛ばし・間違いはエラー、逸脱は UAS。' },
      { q: 'TEM で、望ましくない機体の状態（UAS）になったときに最優先すること', choices: ['原因のエラーを探す', '報告書を書く', '機体を立て直す（UAS の管理）', 'チェックリストを最初から読む'], answer: 2, why: 'UAS は事故の一歩手前。まず機体の状態を安全に戻し、その後で原因を考える。' },
      { q: 'PM（Pilot Monitoring）の主な役割は？', choices: ['操縦を代わる', '飛行経路・速度・形態・モードを監視し、ずれをコールする', '客室の案内', '何もしない'], answer: 1, why: 'AC 120-71B：監視は重要な仕事。ずれに気づいてコールすることで、エラーを早く見つける。' },
    ],
    refs: [R.tem, R.crm, R.icaoTEM, R.automation, R.rmh], lessons: ['r1'] });

  B.add({ id: 'jet', part: 'p6', t: 'ジェット機と自動化への準備', en: 'Preparing for jets and automation',

    secs: [

  ['プロペラの後流', '翼や尾翼に風が当たり、低速でも舵が効く・出力で揚力が増える', '後流がない。低速での出力による「助け」が小さい'],
  ['減速', '出力を絞ればすぐ減速', '抗力が小さく減速しにくい。<b>スピードブレーキ</b>を使う。降下と減速を同時にするのは難しい'],
  ['エネルギーの管理', '—', '降下の計画が大切（目安として「1,000 ft 降りるのに 3 NM」）'],

${bk.key('ジェット機では「先回り」がさらに大切。出力・減速・降下を早めに計画する', 'それでも基本は同じ：姿勢＋出力＝性能、安定進入、ゴーアラウンドの判断')}` },
      { id: 'crm.auto', t: '自動操縦とモード：自動化と付き合う', h: () => `
<p>エアラインの機体では、自動操縦（AP）・オートスロットル・飛行管理装置（FMS）を使って飛ぶ時間が長くなります。そこで大切なのは：</p>

<li><b>手動操縦の技量</b>：FAA の SAFO 13002 は、自動化に頼りすぎて手動操縦の技量が落ちることへの注意と、適切な場面で手で飛ぶ練習を推奨しています。</li></ul>
<p>この教材には<b>針路・高度を保つ自動操縦はありません</b>（意図的）。G1000 の表示と手動の操縦で、計器を読み・自分で修正する力を練習するためです。</p>
${bk.key('自動化は「仕事を減らす」道具。モードを理解していないと「仕事を増やす」', '最後に頼れるのは手で飛ぶ技量')}` },
      { id: 'crm.upset', t: '異常な姿勢を防ぐ（UPRT の考え方）', h: () => `

${bk.t(['防止の考え方', '例'], [['エネルギーを知る', '速度・高度・出力・形態の組み合わせで、余裕がどれだけあるかをいつも把握する（低速・低高度・アイドルは余裕が少ない）'], ['早く気づく', '速度の減少・失速警報・バフェット・予期しない姿勢の変化。自動操縦のモードの変化にも注意'], ['回復の順番を体に覚えさせる', '迎え角を減らす → 翼を水平 → 出力 → 安定。小型機の練習（{ch:ops}・{ch:ifr}）がそのまま基礎になる']])}
<p>${bk.see('ifr.upset', '異常姿勢からの回復（{ch:ifr}）')} ${bk.see('aero.stall', '失速とスピン（{ch:aero}）')}</p>` },
    ],
    terms: [['Spool-up', 'エンジンの加速（ジェット）', ''], ['Speedbrake / Spoiler', 'スピードブレーキ・スポイラー', ''], ['Energy management', 'エネルギーの管理', ''], ['Swept wing', '後退翼', ''], ['Mach number', 'マッハ数', ''], ['Autopilot / Autothrottle / FMS', '自動操縦・自動推力・飛行管理装置', ''], ['FMA', '飛行モードの表示', 'Flight Mode Annunciator'], ['Automation surprise', '自動化に驚かされること', ''], ['UPRT', '異常姿勢の防止と回復の訓練', ''], ['SAFO', '運航者向けの安全情報', 'FAA']],

<script>
/* ---- TEXTBOOK: render.js ---- */
// TEXTBOOK — render.js
// Chapters and sections → HTML strings (no DOM here, so the Node tests can run it in vm). The section bodies are
// FLIGHT LAB's (FL.book.html, unchanged); the chapter's end matter (terms, examples, cautions, the check questions,
// the lessons, the sources) is plain text in FLIGHT LAB's data, so it is escaped here (the same as textContent).
// Lessons are written as FLIGHT LAB writes them (button[data-lesson]); page.js turns every one into a tag.
(function (G) {
  'use strict';
  const NOTE = '本文は公開情報に基づく要約と教材の説明です。数値は仮想教材値または出典のある参考値（機体ごとに要確認）。実機訓練・教官・POH/AFM・SOP・航空法規を優先してください。';
  const APP_NOTE = 'この節は FLIGHT LAB（アプリ）の使い方の説明です。このページでは操作できません。';
  const APP_SECTIONS = ['intro.study'];        // and every section of the chapter 'sim'
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function make(FL) {
    const BK = FL.book;
    const flat = () => BK.CHAPTERS.flatMap(c => c.secs.map(s => s.id));
    const isApp = (ch, sec) => ch.id === 'sim' || APP_SECTIONS.includes(sec.id);
    const partOf = ch => BK.PARTS.find(p => p.id === ch.part);
    const lessonTitle = id => { const l = FL.school && FL.school.lesson(id); return l ? l.title : null; };
    const num = (ch, k) => `${ch.n}.${k + 1}`;

    // the chapter's end matter (on its last section)
    function endHtml(ch, quizResults) {
      let s = '<div class="tb-end">';
      if (ch.terms && ch.terms.length) s += '<h3>英語の用語（English terms）</h3><div class="tb-scroll"><table class="terms"><tr><th>English</th><th>日本語</th><th>補足</th></tr>'
        + ch.terms.map(([en, jp, note]) => `<tr><td class="en">${esc(en)}</td><td>${esc(jp)}</td><td class="mute">${esc(note || '')}</td></tr>`).join('') + '</table></div>';
      if (ch.examples && ch.examples.length) s += '<h3>例</h3><ul class="tb-ex">' + ch.examples.map(t => `<li>${esc(BK.fix(t))}</li>`).join('') + '</ul>';
      if (ch.cautions && ch.cautions.length) s += '<h3>注意</h3><ul class="tb-cau">' + ch.cautions.map(t => `<li>${esc(BK.fix(t))}</li>`).join('') + '</ul>';
      if (ch.quiz && ch.quiz.length) {
        s += '<h3>確認問題</h3>';
        ch.quiz.forEach((q, qi) => {
          const name = `q_${ch.id}_${qi}`, key = `${ch.id}.${qi}`, prev = quizResults && quizResults[key];
          s += `<div class="quiz" data-quiz="${esc(key)}"><div><b>問 ${qi + 1}. </b>${esc(BK.fix(q.q))}</div>`
            + q.choices.map((c, k) => `<label class="ch"><input type="radio" name="${esc(name)}" value="${k}"> ${esc(BK.fix(c))}</label>`).join('')
            + `<button type="button" class="tb-check">答え合わせ</button>`
            + (prev != null ? ` <span class="small mute tb-prev">前回：${prev ? '正解' : '不正解'}</span>` : '')
            + '<div class="res" aria-live="polite"></div></div>';
        });
      }
      if (ch.lessons && ch.lessons.length) s += '<h3>この章に対応する飛行課目</h3><div class="row tb-lessons">'
        + ch.lessons.map(id => `<button type="button" data-lesson="${esc(id)}">${esc(lessonTitle(id) || id)}</button>`).join('') + '</div>';
      if (ch.refs && ch.refs.length) s += '<h3>出典・参考資料（外部リンク・オンライン時）</h3><ul class="bk-src">'
        + ch.refs.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.label)}</a>${r.note ? ` — ${esc(r.note)}` : ''}</li>`).join('') + '</ul>';
      return s + '</div>';
    }

    // what the check of a question shows (the same words as FLIGHT LAB)
    function quizResult(ch, qi, k) {
      const q = ch.quiz[qi], ok = k === q.answer;
      return { ok, text: `${ok ? '正解' : '不正解'}（正答：${BK.fix(q.choices[q.answer])}）— ${BK.fix(q.why)}` };
    }

    // one section: the chapter's line, the title, the chapter's English title and summary (first section), the note on
    // FLIGHT LAB's own pages, FLIGHT LAB's body, the end matter (last section), the note under every section
    function sectionHtml(id, { nav = false, quizResults = null, level = 2 } = {}) {
      const x = BK.findSection(id); if (!x) return '';
      const { ch, sec } = x, k = ch.secs.indexOf(sec), last = k === ch.secs.length - 1;
      const h = 'h' + level;
      let s = `<section class="tb-sec" id="${esc(sec.id)}" data-sec-id="${esc(sec.id)}">`;
      s += `<div class="bk-chap">${esc(partOf(ch) ? partOf(ch).title : '')}　／　第 ${ch.n} 章　${esc(ch.t)}（${k + 1} / ${ch.secs.length}）</div>`;
      s += `<${h} class="bk-title"><span class="tb-num">${num(ch, k)}</span> ${esc(sec.t)}</${h}>`;
      if (k === 0 && ch.en) s += `<div class="bk-en">${esc(ch.en)}</div>`;
      if (k === 0 && ch.summary) s += `<p class="tb-summary"><b>この章で学ぶこと：</b>${esc(BK.fix(ch.summary))}</p>`;
      if (isApp(ch, sec)) s += `<p class="tb-appnote" role="note">${esc(APP_NOTE)}</p>`;
      s += `<div class="tb-body">${BK.html(sec)}</div>`;            // FLIGHT LAB's static textbook content (trusted)
      if (last) s += endHtml(ch, quizResults);
      if (nav) {
        const f = flat(), i = f.indexOf(id), prev = f[i - 1], next = f[i + 1], first = ch.secs[0].id;
        const t = sid => { const y = BK.findSection(sid); return `${num(y.ch, y.ch.secs.indexOf(y.sec))} ${esc(y.sec.t)}`; };
        s += '<nav class="tb-pager" aria-label="前後の節">'
          + (prev ? `<button type="button" data-go="${esc(prev)}">← 前の節：${t(prev)}</button>` : '')
          + (k > 0 ? `<button type="button" data-go="${esc(first)}">↑ 第 ${ch.n} 章のはじめへ</button>` : '')
          + (next ? `<button type="button" class="primary" data-go="${esc(next)}">次の節：${t(next)} →</button>` : '')
          + '</nav>';
      }
      s += `<p class="note tb-note">${esc(NOTE)}</p>`;
      return s + '</section>';
    }

    // the whole book on one page (to print): a table of contents, then every chapter (each from a new page)
    function allHtml({ quizResults = null } = {}) {
      let s = '<div class="tb-all"><h1 class="tb-all-title">FLIGHT LAB 教科書（全文）</h1><nav class="tb-all-toc" aria-label="全文の目次">';
      for (const p of BK.PARTS) {
        const chs = BK.CHAPTERS.filter(c => c.part === p.id); if (!chs.length) continue;
        s += `<h2>${esc(p.title)}</h2><ol class="tb-toc-ch">`;
        for (const c of chs) s += `<li><a href="#${esc(c.secs[0].id)}" data-jump="${esc(c.secs[0].id)}">第 ${c.n} 章　${esc(c.t)}</a><ol>`
          + c.secs.map((x, k) => `<li><a href="#${esc(x.id)}" data-jump="${esc(x.id)}">${num(c, k)} ${esc(x.t)}</a></li>`).join('') + '</ol></li>';
        s += '</ol>';
      }
      s += '</nav>';
      for (const c of BK.CHAPTERS) {
        s += `<article class="tb-chapter" data-chapter="${esc(c.id)}"><h2 class="tb-chapter-title">第 ${c.n} 章　${esc(c.t)}</h2>`
          + c.secs.map(x => sectionHtml(x.id, { quizResults, level: 3 })).join('') + '</article>';
      }
      return s + '</div>';
    }

    // the table of contents (parts → chapters → sections)
    function tocHtml(read, cur) {
      const r = new Set(read || []);
      let s = '';
      for (const p of BK.PARTS) {
        const chs = BK.CHAPTERS.filter(c => c.part === p.id); if (!chs.length) continue;
        s += `<h3 class="tb-part">${esc(p.title)}</h3>`;
        for (const c of chs) {
          s += `<div class="tb-toc-chap"><div class="tb-toc-ct">第 ${c.n} 章　${esc(c.t)}</div>`;
          s += c.secs.map((x, k) => `<button type="button" class="bk-item${r.has(x.id) ? ' done' : ''}${x.id === cur ? ' sel' : ''}" data-go="${esc(x.id)}"${x.id === cur ? ' aria-current="true"' : ''}><span class="bk-num">${num(c, k)}</span><span>${esc(x.t)}</span></button>`).join('');
          s += '</div>';
        }
      }
      return s;
    }

    // what the search looks in: the section's title and body (FL.book.text: the figures' words too), the chapter's
    // English title and summary on its first section, the end matter on its last
    function endText(ch) {
      return [].concat(
        (ch.terms || []).map(t => t.filter(Boolean).join(' ')),
        (ch.examples || []).map(BK.fix), (ch.cautions || []).map(BK.fix),
        (ch.quiz || []).map(q => [q.q, ...q.choices, q.why].map(BK.fix).join(' ')),
        (ch.lessons || []).map(id => lessonTitle(id) || id),
        (ch.refs || []).map(r => r.label + (r.note ? ' ' + r.note : '')),
      ).join(' ');
    }
    function index() {
      const out = [];
      for (const ch of BK.CHAPTERS) ch.secs.forEach((sec, k) => {
        const head = sec.t + ' ' + (k === 0 ? (ch.en || '') + ' ' + BK.fix(ch.summary || '') : '');
        out.push({ id: sec.id, ch, k, body: head + ' ' + BK.text(sec), end: k === ch.secs.length - 1 ? endText(ch) : '' });
      });
      return out;
    }
    function search(q, idx) {
      const f = String(q || '').trim().toLowerCase(); if (!f) return [];
      const hits = [];
      for (const e of idx || index()) {
        const b = e.body.toLowerCase().indexOf(f), n = b < 0 ? e.end.toLowerCase().indexOf(f) : -1;
        if (b < 0 && n < 0) continue;
        const src = b >= 0 ? e.body : e.end, at = b >= 0 ? b : n;
        hits.push({ id: e.id, inEnd: b < 0, snippet: (at > 30 ? '…' : '') + src.slice(Math.max(0, at - 30), at + f.length + 40).trim() + '…' });
      }
      return hits;
    }
    function resultsHtml(q, hits) {
      if (!hits.length) return `<p class="mute small">「${esc(q)}」は見つかりませんでした。</p>`;
      return `<p class="small mute">「${esc(q)}」：${hits.length} 節</p>` + hits.map(hh => {
        const y = BK.findSection(hh.id);
        return `<button type="button" class="bk-item tb-hit" data-go="${esc(hh.id)}" data-q="${esc(q)}"><span class="bk-num">${num(y.ch, y.ch.secs.indexOf(y.sec))}</span><span>${esc(y.sec.t)}${hh.inEnd ? '<span class="tag">章末</span>' : ''}<br><span class="small mute">${esc(hh.snippet)}</span></span></button>`;
      }).join('');
    }

    return { NOTE, APP_NOTE, esc, flat, isApp, lessonTitle, sectionHtml, endHtml, quizResult, allHtml, tocHtml, endText, index, search, resultsHtml };
  }
  G.TB = { make, NOTE, APP_NOTE, esc };
})(globalThis);

</script>
<script>
/* ---- TEXTBOOK: page.js ---- */
// TEXTBOOK — page.js
// The DOM: the table of contents, one section at a time (#節ID) or the whole book (#all), the search (marks on the
// shown text nodes only), FLIGHT LAB's lesson buttons turned into tags, the calculators (FL.book.wire), the check
// questions, the read marks and the settings (this browser's localStorage only, keys "textbook.*"), the print.
(function () {
  'use strict';
  const FL = globalThis.FL, BK = FL.book, R = globalThis.TB.make(FL);
  const $ = id => document.getElementById(id);
  const view = $('tbView'), toc = $('tbToc'), search = $('tbSearch'), root = document.documentElement;
  const FIRST = BK.CHAPTERS[0].secs[0].id, TOTAL = R.flat().length;

  // ------------------------------------------------------------ saved in this browser only (may be refused)
  const KEY = { read: 'textbook.read', quiz: 'textbook.quiz', prefs: 'textbook.prefs', last: 'textbook.last' };
  function load(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* not allowed: keep it for this visit */ } }
  const S = {
    read: (a => Array.isArray(a) ? a.filter(id => BK.findSection(id)) : [])(load(KEY.read, [])),
    quiz: (o => o && typeof o === 'object' ? o : {})(load(KEY.quiz, {})),
    prefs: Object.assign({ theme: 'auto', size: 16 }, load(KEY.prefs, {})),
    last: load(KEY.last, null),
    mode: 'sec', cur: null, idx: null,
  };

  // ------------------------------------------------------------ the look: light / dark, the text size
  const THEMES = ['auto', 'light', 'dark'], THEME_JP = { auto: '自動', light: '明るい', dark: '暗い' };
  function applyPrefs() {
    if (!THEMES.includes(S.prefs.theme)) S.prefs.theme = 'auto';
    if (S.prefs.theme === 'auto') delete root.dataset.theme; else root.dataset.theme = S.prefs.theme;
    $('tbTheme').textContent = '表示：' + THEME_JP[S.prefs.theme];
    S.prefs.size = Math.min(22, Math.max(13, +S.prefs.size || 16));
    root.style.setProperty('--fs', S.prefs.size + 'px');
  }
  $('tbTheme').addEventListener('click', () => { S.prefs.theme = THEMES[(THEMES.indexOf(S.prefs.theme) + 1) % THEMES.length]; applyPrefs(); save(KEY.prefs, S.prefs); });
  $('tbSmaller').addEventListener('click', () => { S.prefs.size--; applyPrefs(); save(KEY.prefs, S.prefs); });
  $('tbBigger').addEventListener('click', () => { S.prefs.size++; applyPrefs(); save(KEY.prefs, S.prefs); });

  // ------------------------------------------------------------ what only FLIGHT LAB (the app) has
  // a lesson button (in the "try it in the simulator" boxes and the chapter's lessons) becomes a tag that cannot be pressed
  function lessonTag(id) {
    const t = document.createElement('span');
    t.className = 'bk-lesson';
    t.dataset.lessonId = id;
    t.textContent = `FLIGHT LAB の課目『${R.lessonTitle(id) || id}』`;
    return t;
  }
  function toTags(el) { for (const b of el.querySelectorAll('button[data-lesson]')) b.replaceWith(lessonTag(b.dataset.lesson)); }
  // wide tables scroll sideways (the weight-and-balance calculator scrolls as a whole: .bk-calc)
  function wrapTables(el) {
    for (const t of el.querySelectorAll('table')) {
      if (t.closest('.tb-scroll, .bk-calc')) continue;
      const w = document.createElement('div'); w.className = 'tb-scroll';
      t.replaceWith(w); w.append(t);
    }
  }
  function enhance(el) { toTags(el); wrapTables(el); if (BK.wire) BK.wire(el); }

  // ------------------------------------------------------------ search marks: the shown text nodes only
  const SKIP = 'svg, button, input, textarea, select, option, script, style, mark, .tb-pager';
  function mark(el, q) {
    const f = String(q || '').trim(); if (!f) return 0;
    const src = f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), re = new RegExp(src, 'gi'), has = new RegExp(src, 'i');
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement && n.parentElement.closest(SKIP)) ? NodeFilter.FILTER_REJECT : (has.test(n.data) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP),
    });
    const nodes = []; for (let n = w.nextNode(); n; n = w.nextNode()) nodes.push(n);
    let count = 0;
    for (const n of nodes) {
      const frag = document.createDocumentFragment(), s = n.data; let at = 0;
      re.lastIndex = 0;
      for (let m = re.exec(s); m; m = re.exec(s)) {
        if (m.index > at) frag.append(s.slice(at, m.index));
        const mk = document.createElement('mark'); mk.className = 'tb-mark'; mk.textContent = m[0]; frag.append(mk);
        at = m.index + m[0].length; count++;
      }
      if (at < s.length) frag.append(s.slice(at));
      n.replaceWith(frag);
    }
    return count;
  }
  // a hit in the chapter's end matter opens its last section (search() says which section); a hit inside a closed
  // "考えてみよう" opens it
  function showMarks(el) {
    const ms = el.querySelectorAll('mark.tb-mark');
    for (const m of ms) { const d = m.closest('details'); if (d) d.open = true; }
    if (ms[0]) ms[0].scrollIntoView({ block: 'center' });
  }

  // ------------------------------------------------------------ the table of contents and the search results
  function drawToc() {
    const q = search.value.trim();
    if (q) {
      if (!S.idx) S.idx = R.index();
      toc.innerHTML = R.resultsHtml(q, R.search(q, S.idx));
    } else {
      toc.innerHTML = R.tocHtml(S.read, S.mode === 'sec' ? S.cur : null);
      const sel = toc.querySelector('.bk-item.sel'), side = $('tbNav');
      if (sel && side.scrollHeight > side.clientHeight) {
        const top = sel.offsetTop - side.offsetTop;
        if (top < side.scrollTop || top > side.scrollTop + side.clientHeight - 40) side.scrollTop = top - side.clientHeight / 3;
      }
    }
    $('tbProg').textContent = `読んだ節 ${S.read.length} / ${TOTAL}`;
  }
  search.addEventListener('input', drawToc);
  search.addEventListener('keydown', e => { if (e.key === 'Enter') { const b = toc.querySelector('.tb-hit'); if (b) b.click(); } });
  $('tbReset').addEventListener('click', () => { if (!confirm('読んだ印（✓）をすべて消しますか？')) return; S.read = []; save(KEY.read, S.read); drawToc(); });
  $('tbTocBtn').addEventListener('click', () => {
    const hide = !document.body.classList.contains('tb-toc-hidden');
    document.body.classList.toggle('tb-toc-hidden', hide);
    $('tbTocBtn').setAttribute('aria-expanded', String(!hide));
  });

  // ------------------------------------------------------------ the views (never both in the DOM: ids and radio names)
  function setHash(h) { if (location.hash !== '#' + h) history.replaceState(null, '', '#' + h); }
  function showSection(id, { q = '', scroll = true } = {}) {
    if (!BK.findSection(id)) id = FIRST;
    S.mode = 'sec'; S.cur = id;
    document.body.classList.remove('tb-mode-all');
    $('tbAll').setAttribute('aria-pressed', 'false'); $('tbAll').textContent = '全文';
    view.innerHTML = R.sectionHtml(id, { nav: true, quizResults: S.quiz });
    enhance(view);
    if (!S.read.includes(id)) { S.read.push(id); save(KEY.read, S.read); }
    S.last = id; save(KEY.last, id);
    setHash(id);
    drawToc();
    if (q && mark(view, q)) showMarks(view);
    else if (scroll) $(id).scrollIntoView({ block: 'start' });
  }
  function showAll() {
    S.mode = 'all';
    document.body.classList.add('tb-mode-all');
    $('tbAll').setAttribute('aria-pressed', 'true'); $('tbAll').textContent = '1 節ずつ';
    view.innerHTML = R.allHtml({ quizResults: S.quiz });
    enhance(view);
    setHash('all');
    drawToc();
    window.scrollTo(0, 0);
  }
  function go(id, q) {
    if (S.mode === 'all' && !q) { const el = $(id); if (el) { el.scrollIntoView({ block: 'start' }); return; } }
    showSection(id, { q });
  }
  function route(first) {
    let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { h = ''; }
    if (h === 'all') return showAll();
    if (BK.findSection(h)) return showSection(h, { scroll: !first });
    showSection(BK.findSection(S.last) ? S.last : FIRST, { scroll: false });
  }
  window.addEventListener('hashchange', () => route(false));
  $('tbAll').addEventListener('click', () => { if (S.mode === 'all') showSection(S.cur || S.last || FIRST); else showAll(); });

  // ------------------------------------------------------------ the clicks (one listener: the views are redrawn)
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go], button[data-sec], a[data-jump], .tb-check'); if (!t) return;
    if (t.matches('a[data-jump]')) { e.preventDefault(); go(t.dataset.jump); return; }
    if (t.matches('[data-go]')) { go(t.dataset.go, t.dataset.q || ''); return; }
    if (t.matches('button[data-sec]')) { go(t.dataset.sec); return; }
    // a check question
    const box = t.closest('.quiz'), key = box.dataset.quiz, dot = key.lastIndexOf('.');
    const ch = BK.CHAPTERS.find(c => c.id === key.slice(0, dot)), qi = +key.slice(dot + 1);
    const res = box.querySelector('.res'), sel = box.querySelector('input[type="radio"]:checked');
    if (!sel) { res.className = 'res'; res.textContent = '選択肢を選んでください。'; return; }
    const r = R.quizResult(ch, qi, +sel.value);
    res.className = 'res ' + (r.ok ? 'ok' : 'ng'); res.textContent = r.text;
    S.quiz[key] = r.ok; save(KEY.quiz, S.quiz);
  });

  // ------------------------------------------------------------ print: the "考えてみよう" boxes open
  let opened = [];
  window.addEventListener('beforeprint', () => { opened = [...view.querySelectorAll('details:not([open])')]; for (const d of opened) d.open = true; });
  window.addEventListener('afterprint', () => { for (const d of opened) d.open = false; opened = []; });

  applyPrefs();
  route(true);
  globalThis.__tb = { ready: true, get mode() { return S.mode; }, get cur() { return S.cur; } };
})();

</script>
</body>
