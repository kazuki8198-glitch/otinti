<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="288" viewBox="0 0 1200 288" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs></defs><rect width="1200" height="288" fill="#FFFFFF"/><rect x="30" y="20" width="330" height="130" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="195" y="70" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">要求勾配</text><text x="195" y="122" font-size="32" fill="#1F3A5F" text-anchor="middle" font-weight="700">300 ft/NM</text><rect x="435" y="20" width="330" height="130" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="600" y="70" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">対地速度</text><text x="600" y="122" font-size="32" fill="#1F3A5F" text-anchor="middle" font-weight="700">120 kt ＝ 2 NM/min</text><rect x="840" y="20" width="330" height="130" rx="12" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="3"/><text x="1005" y="70" font-size="25" fill="#1F2937" text-anchor="middle" font-weight="500">必要な上昇率</text><text x="1005" y="122" font-size="32" fill="#1F3A5F" text-anchor="middle" font-weight="700">600 ft/min</text><text x="397.5" y="100" font-size="44" fill="#1F2937" text-anchor="middle" font-weight="700">×</text><text x="802.5" y="100" font-size="44" fill="#1F2937" text-anchor="middle" font-weight="700">＝</text><text x="600" y="212" font-size="28" fill="#1F3A5F" text-anchor="middle" font-weight="700">上昇率 ＝ 上昇勾配 × 毎分の対地移動距離</text><text x="600" y="264" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">架空の計算例</text></svg>