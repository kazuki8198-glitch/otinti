<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="370" viewBox="0 0 1120 370" font-family="'Noto Sans JP','Noto Sans CJK JP','Yu Gothic UI','Meiryo','Hiragino Sans',sans-serif"><defs><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#2E6DA4"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#2E7D5B"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 L2.6,5 z" fill="#6B7280"/></marker></defs><rect width="1120" height="370" fill="#FFFFFF"/><line x1="190" y1="70" x2="190" y2="305.1666049839541" stroke="#C9D3DE" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity="1"/><line x1="190" y1="70" x2="320" y2="70" stroke="#2E6DA4" stroke-width="5" stroke-linecap="round" marker-end="url(#a-blue)" opacity="1"/><line x1="320" y1="70" x2="320" y2="295.1666049839541" stroke="#2E6DA4" stroke-width="5" stroke-linecap="round" marker-end="url(#a-blue)" opacity="1"/><line x1="190" y1="70" x2="320" y2="295.1666049839541" stroke="#2E7D5B" stroke-width="7" stroke-linecap="round" marker-end="url(#a-green)" opacity="1"/><path d="M225,130.6217782649107 A70,70 0 0 1 190,140" stroke="#C8742A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="216.91718069066215" y="179.55628593406308" font-size="26" fill="#C8742A" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="6.5" stroke-linejoin="round" paint-order="stroke"></text><text x="176" y="154" font-size="26" fill="#C8742A" text-anchor="end" font-weight="700">30°</text><text x="255" y="48" font-size="26" fill="#2E6DA4" text-anchor="middle" font-weight="700">横風 10 kt</text><text x="342" y="174.58330249197704" font-size="26" fill="#2E6DA4" text-anchor="start" font-weight="700">向かい風</text><text x="342" y="209.68330249197703" font-size="26" fill="#2E6DA4" text-anchor="start" font-weight="700">約 17.32 kt</text><text x="168" y="265.1666049839541" font-size="26" fill="#2E7D5B" text-anchor="end" font-weight="700">風 20 kt</text><g transform="translate(560 250) rotate(-90) scale(0.34)"><path d="M40,-12 L30,-180 L0,-180 L-10,-12 Z M40,12 L30,180 L0,180 L-10,12 Z" fill="#C9D3DE" stroke="#1F3A5F" stroke-width="7.352941176470588"/><path d="M-120,-10 L-136,-62 L-152,-62 L-146,-8 Z M-120,10 L-136,62 L-152,62 L-146,8 Z" fill="#C9D3DE" stroke="#1F3A5F" stroke-width="7.352941176470588"/><rect x="-20" y="-82" width="96" height="20" rx="9" fill="#AEBBCB" stroke="#1F3A5F" stroke-width="7.352941176470588"/><rect x="-20" y="62" width="96" height="20" rx="9" fill="#AEBBCB" stroke="#1F3A5F" stroke-width="7.352941176470588"/><rect x="78" y="-104" width="5" height="64" fill="#6B7280"/><rect x="78" y="40" width="5" height="64" fill="#6B7280"/><path d="M-150,0 C-146,-8 -130,-14 -100,-14 L80,-14 C104,-14 120,-8 128,0 C120,8 104,14 80,14 L-100,14 C-130,14 -146,8 -150,0 Z" fill="#C9D3DE" stroke="#1F3A5F" stroke-width="7.352941176470588"/></g><line x1="560" y1="190" x2="560" y2="50" stroke="#6B7280" stroke-width="5" stroke-linecap="round" marker-end="url(#a-gray)" opacity="1"/><text x="560" y="345" font-size="24" fill="#6B7280" text-anchor="middle" font-weight="500">航空機の進行方向</text><rect x="712" y="60" width="384" height="190" rx="12" fill="#F6F8FB" stroke="#C9D3DE" stroke-width="2"/><text x="904" y="110" font-size="26" fill="#1F3A5F" text-anchor="middle" font-weight="700">滑走路に対する風向差 30°</text><text x="904" y="165" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">向かい風 = 20 cos30°</text><text x="904" y="215" font-size="26" fill="#1F2937" text-anchor="middle" font-weight="500">横風 = 20 sin30°</text><text x="904" y="295" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">風が吹いていく向きを</text><text x="904" y="324.7" font-size="22" fill="#6B7280" text-anchor="middle" font-weight="500">矢印で表示</text></svg>